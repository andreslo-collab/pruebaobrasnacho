/*__CSS_INICIO__*/
/* ============================================================================
   ENUE Obras — estilos

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

/* ---------------------------------------------------------------- cabecera */
.cabecera { background: #16181a; color: #fff; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

.marca small { color: #9a9fa6; font-size: 11px; }

.contenido { max-width: none; margin: 0; padding: 18px 28px 60px; }

/* ----------------------------------------------------------------- botones */
.btn-primario, .btn-sec, .btn-mini {

.btn-mini { padding: 5px 10px; font-size: 12px; background: #16181a; color: #fff; }
button:disabled { opacity: .6; cursor: default; }

/* -------------------------------------------------------------- generador */
.gen-hero { text-align: center; margin: 8px auto 22px; max-width: 640px; }
.gen-hero h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.6px; }
.gen-hero p { margin: 0; color: #555a61; font-size: 14px; }
.gen-card { background: #fff; border: 1px solid #e3e5e8; border-radius: 18px; padding: 22px; box-shadow: 0 1px 3px rgba(22,24,26,.06); }

.gen-cab { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; padding-top: 16px; border-top: 1px solid #f0f1f2; font-weight: 700; font-size: 13px; }
.gen-acciones { text-align: center; margin-top: 22px; }
.nota-pie { font-size: 12px; color: #6e737a; margin: 8px 0 0; }

.zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.zona { border: 2px dashed #cfd2d6; border-radius: 14px; padding: 12px; background: #f7f8f8; display: flex; flex-direction: column; gap: 8px; transition: .15s; }
.zona.arrastrando { border-color: #5a5f66; background: #f1f2f3; }

.zona-area { display: none; width: 100%; min-height: 90px; font-family: ui-monospace, monospace; font-size: 11px; padding: 8px; border: 1px solid #cfd2d6; border-radius: 8px; resize: vertical; }
.zona-area.abierta { display: block; }

/* ------------------------------------------------------------ procesando */
.pasos { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; }

.barra { background: #e3e5e8; border-radius: 999px; height: 10px; overflow: hidden; width: 100%; }
.barra.grande { height: 14px; }
.barra-i { height: 100%; background: linear-gradient(90deg, #2d3035, #6b7078); border-radius: 999px; transition: width .2s; }
.barra-i.verde { background: linear-gradient(90deg, #059669, #34d399); }
.barra-i.ambar { background: linear-gradient(90deg, #d97706, #fbbf24); }

/* ------------------------------------------- definición de materiales */
.fases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.fase-card { font: inherit; text-align: left; cursor: pointer; background: #fff; border: 1px solid #e3e5e8; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 5px; transition: .15s; }

.plano-card.ok { background: #ecfdf5; border-color: #a7f3d0; }

.plano-t { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; color: #3f4349; }
.plano-e { font-size: 12.5px; color: #16181a; font-weight: 600; line-height: 1.4; }

.opciones-col { background: #f7f8f8; border: 1px solid #e3e5e8; border-radius: 10px; padding: 10px; }

/* ------------------------------------------------------------- validación */
.val-wrap { display: flex; flex-direction: column; gap: 16px; }

.val-titulo p { margin: 0; color: #555a61; font-size: 13px; }

.val-nota { font-size: 12px; color: #555a61; background: #f7f8f8; border: 1px solid #e3e5e8; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }

.val-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

.val-field { display: flex; flex-direction: column; gap: 5px; }
.val-field > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #555a61; }
.val-field small { font-size: 10px; color: #9a9fa6; }

.val-input { font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid #cfd2d6; border-radius: 9px; background: #fff; color: #16181a; width: 100%; }

.val-tabla-scroll { overflow: auto; border: 1px solid #e3e5e8; border-radius: 10px; max-height: 420px; }

/* panel de datos detectados automáticamente */
.detectado-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }

.val-texto { margin-top: 14px; border-top: 1px solid #f0f1f2; padding-top: 10px; }.val-texto summary { cursor: pointer; font-size: 12px; font-weight: 700; color: #2f3338; }

/* -------------------------------------------------------------- dashboard */
.dash { display: flex; flex-direction: column; gap: 16px; }
.dash-cabecera { background: linear-gradient(135deg, #16181a, #3a3d42); color: #fff; border-radius: 18px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }

.dash-chip { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #d4d7da; background: rgba(107,112,120,.18); border: 1px solid rgba(107,112,120,.35); border-radius: 999px; padding: 4px 10px; }
.dash-botones { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------------------------------------- cómo compartir el dashboard */
.dash-compartir { background: #fff; border: 1px solid #e3e5e8; border-radius: 14px; padding: 12px 16px; font-size: 12.5px; }

.ok-enlace { color: #047857; font-weight: 700; margin: 0 0 8px; }

.compartir-card .btn-primario, .compartir-card .btn-sec { align-self: flex-start; }
.salida-enlace { display: flex; flex-direction: column; gap: 8px; }

.correo-box { margin-top: 6px; padding-top: 12px; border-top: 1px solid #e3e5e8; display: flex; flex-direction: column; gap: 8px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px; background: #fff; border: 1px solid #e3e5e8; border-radius: 14px; }

.tab:hover { background: #f0f1f2; color: #16181a; }

.dash-cuerpo { display: flex; flex-direction: column; gap: 16px; }

.kpi-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #6e737a; }
.kpi-v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.kpi-n { font-size: 11px; color: #6e737a; }

.kpi.k-dark { background: #16181a; border-color: #3f4349; } .kpi.k-dark .kpi-t { color: #c4c8cc; } .kpi.k-dark .kpi-v { color: #d9dce0; }

.bloque { background: #fff; border: 1px solid #e3e5e8; border-radius: 16px; padding: 18px; }

.tabla th { text-align: left; padding: 9px 10px; font-size: 10.5px; text-transform: uppercase; color: #555a61; border-bottom: 2px solid #e3e5e8; background: #f7f8f8; }
.tabla td { padding: 9px 10px; border-bottom: 1px solid #f0f1f2; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip-estado { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 10px; border: 1px solid; }
.e-en-obra { background: #dcfce7; color: #166534; border-color: #86efac; }

/* ===== pestaña Seguimiento económico (diseño de dossier) ===== */
.se { --se-p:#16181A; --se-a:#6E737A; --se-ok:#047857; --se-bd:#E3E5E8; background:transparent; color:#16181A; border:0; border-radius:0; padding:0; }

.se-btn:hover { background:#000000; transform:translateY(-1px); }
.se-nav { display:flex; gap:6px; flex-wrap:wrap; padding:12px 0 4px; }
.se-navb { background:transparent; border:0; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; color:#3A3D42; cursor:pointer; transition:background .15s, color .15s; }

.se-sec { margin-top:34px; }
.se-sh { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px; border-bottom:1px solid var(--se-bd); padding-bottom:10px; margin-bottom:16px; }

.se-sh p { margin:2px 0 0; font-size:12px; color:#6E737A; }
.se-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
.se-card { position:relative; overflow:hidden; background:#fff; border:1px solid var(--se-bd); border-radius:16px; padding:18px; transition:border-color .2s, box-shadow .2s, transform .2s; }
.se-card::before { content:""; position:absolute; top:-26px; right:-26px; width:96px; height:96px; border-bottom-left-radius:100%; background:#f3f4f6; transition:transform .3s; }

.se-q small { font-size:11px; color:#6E737A; }
.se-note { margin-top:14px; padding:12px 14px; background:#F7F8F8; border:1px solid #E3E5E8; border-radius:10px; font-size:11.5px; color:#555A61; line-height:1.5; }
.se-scroll { overflow-x:auto; }
.se-tab { width:100%; border-collapse:collapse; font-size:12.5px; }
.se-tab th { background:var(--se-p); color:#fff; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; padding:12px; text-align:left; }
.se-tab td { padding:12px; border-bottom:1px solid #F0F1F2; color:#3A3D42; }
.se-tab tbody tr:hover { background:#F7F8F8; }
.se-tab tfoot td { background:#F0F1F2; border-top:2px solid #D1D4D8; font-size:12px; color:#16181A; }
.se-tab .r { text-align:right; } .se-tab .c { text-align:center; }
.se-mono { font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.se-tot { text-align:right; } .se-tot span { display:block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:#6E737A; } .se-tot strong { font-size:21px; font-weight:800; color:#065f46; }
.se-2 { display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:16px; align-items:start; }

.se-ph { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#F7F8F8; border-bottom:1px solid #E3E5E8; }
.se-ph span { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:#3A3D42; } .se-ph small { font-size:11px; color:#6E737A; }
.se-lista { max-height:520px; overflow-y:auto; }
.se-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid #F0F1F2; font-size:12.5px; transition:background .15s; }

.se-pie { display:flex; justify-content:space-between; padding:13px 16px; background:#F7F8F8; border-top:1px solid var(--se-bd); font-size:12px; font-weight:800; color:#16181A; }

.se-bars { display:flex; flex-direction:column; gap:6px; }

.se-bar-f { height:100%; border-radius:999px; background:var(--se-p); transition:background .2s, width .5s; }

.se-tag { display:inline-block; font-size:11.5px; font-weight:700; background:#FEF3C7; color:#78350f; border:1px solid #fde68a; padding:4px 10px; border-radius:8px; }

.se-form { margin:12px 0 0; font-size:13px; font-weight:700; color:#3A3D42; }

            var suma = res.capitulos.reduce(function (a, b) { return a + b.importeSinIva; }, 0);
            if (!res.totales.pem) { res.totales.pem = +suma.toFixed(3); }
            if (Math.abs(suma - (res.totales.pem || 0)) > Math.max(1, suma * 0.02)) {
                res.avisos.push('La suma de capítulos (' + suma.toFixed(2) + ' €) no coincide con el total del documento (' +
                    (res.totales.pem != null ? res.totales.pem.toFixed(2) : 'sin identificar') + ' €). Revisar.');
            }
        } else {
            res.avisos.push('No se han reconocido capítulos. Pega el texto del resumen de presupuesto en el área de texto para forzar la lectura.');
        }
        return res;
    }

    /* ------------------------------------------------------ CERTIFICACIÓN (PDF) */

    function normalizarLineaCert(t) {
        t = String(t == null ? '' : t);
        var A = '(?:€\\s*)?-?[0-9][0-9.]*,[0-9]+(?:\\s*€)?';
        var m = t.match(new RegExp('^\\s*((?:' + A + '\\s*){1,3})(Totales\\b.*|Total\\s+(?:Sub)?Cap[ií]tulo\\b.*)$', 'i'));
        if (m) { t = m[2].replace(/\s+$/, '') + ' ' + m[1].replace(/€/g, ' ').replace(/\s+/g, ' ').trim(); }
        return t;
    }

    function parseCertification(lines, opts) {
        lines = (lines || []).map(function (l) { return normalizarLineaCert(typeof l === 'string' ? l : analyseRow(l).text); });
        var text = lines.join('\n');
        var res = {
            tipo: 'certificacion',
            ident: { obra: null, cliente: null, certificacion: null, presupuesto: null, fecha: null },
            totales: { origen: null, anterior: null, actual: null, ivaPct: null, iva: null, total: null },
            capitulos: [],
            partidas: [],
            avisos: []
        };
        var m;
        m = text.match(/Obra\s*:\s*([^\n]{3,90}?)(?=\s*(?:Fecha|P[aá]gina|Cliente|Certificaci[oó]n)\s*:|$)/i);
        if (m) { res.ident.obra = clean(m[1]); }
        m = text.match(/Cliente\s*:\s*([^\n]{3,80})/i);
        if (m) { res.ident.cliente = clean(m[1]); }
        // El nº de certificación solo se acepta si el dígito está en la MISMA
        // línea y pegado a la etiqueta (en estos PDFs el campo suele venir vacío
        // y una búsqueda laxa captura números de descripciones: "menor de 3,5 m").
        var reCert = /n[ºo°]\s*:?\s{0,3}(\d{1,4})(?![\d,.])/i;
        for (var lp = 0; lp < Math.min(lines.length, 60) && !res.ident.certificacion; lp++) {
            var lcp = String(lines[lp]).match(/Certificaci[oó]n\s*n[ºo°]\.?\s*:?\s{0,3}(\d{1,4})(?![\d,.])/i);
            if (lcp) { res.ident.certificacion = lcp[1]; }
        }
        for (var li = 0; li < Math.min(lines.length, 60) && !res.ident.certificacion; li++) {
            var ltxt = typeof lines[li] === 'string' ? lines[li] : analyseRow(lines[li]).text;
            var lc = ltxt.match(reCert);
            if (lc) { res.ident.certificacion = lc[1]; break; }
        }
        m = text.match(/(?:Presupuesto)\s*:?\s*([0-9]{3,6}(?:[.,][0-9]{1,2})?)/i);
        if (m) { res.ident.presupuesto = m[1]; }
        m = text.match(/(?:Fecha)\s*:?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
        if (m) { res.ident.fecha = m[1]; }

        // --- totales finales. Se busca desde el FINAL del documento.
        var tail = lines.slice(-45);
        var tailText = tail.join('\n');
        var m2;
        // "Totales  9.999,129 €  9.999,129 €"  (puede venir en una sola linea)
        for (var t3 = tail.length - 1; t3 >= 0 && !res._tot3; t3--) {
            var m3 = String(tail[t3]).replace(/€/g, ' ').match(/^\s*Totales\s+(-?[0-9][0-9.]*,[0-9]{2})\s+(-?[0-9][0-9.]*,[0-9]{2})\s+(-?[0-9][0-9.]*,[0-9]{2})\s*$/i);
            if (m3) {
                res._tot3 = true;
                res.totales.origen = numDec(m3[1]);
                res.totales.anterior = numDec(m3[2]);
                res.totales.actual = numDec(m3[3]);
                res._origenTexto = m3[1];
            }
        }
        for (var ti = tail.length - 1; ti >= 0 && !res._tot3; ti--) {
            m2 = String(tail[ti]).match(/^\s*Totales?\s+(-?[0-9][0-9.]*[.,][0-9]+)\s*€?\s+(-?[0-9][0-9.]*[.,][0-9]+)\s*€?/i);
            if (m2) {
                res.totales.anterior = num(m2[1]);
                res.totales.actual = num(m2[2]);
                res.totales.origen = numDec(m2[1]);
                res.totales.origenAlt = numMiles(m2[1]);
                res._origenTexto = m2[1];
                break;
            }
        }
        m = tailText.match(/Total\s+Ejecuci[oó]n\s*:?\s*(-?[0-9][0-9.]*[.,][0-9]+)/i);
        if (res._tot3) { res._ejec = m ? numDec(m[1]) : null; m = null; }
        if (m) {
            res.totales.origen = numDec(m[1]);
            res.totales.origenAlt = numMiles(m[1]);
            res._origenTexto = m[1];
            if (res.totales.actual == null) { res.totales.actual = numDec(m[1]); }
        }
        // IVA: se toma la ULTIMA aparicion valida (<=50 %) del bloque final.
        // El tipo es decimal; el importe se deja sin decidir ("dec"/"miles").
        var reIva = /I\.?V\.?A\.?\s*\(?\s*([0-9]{1,2}(?:[.,][0-9]{1,2})?)\s*%\s*\)?\s*:?\s*(-?[0-9][0-9.]*[.,][0-9]+)?/gi;
        var mI;
        while ((mI = reIva.exec(tailText)) !== null) {
            var pc = numDec(mI[1]);
            if (pc !== null && pc > 0 && pc <= 50) {
                res.totales.ivaPct = pc;
                if (mI[2]) {
                    var iv = toNumber(mI[2]);
                    res._ivaDec = iv.dec;
                    res._ivaMiles = iv.miles;
                }
            }
        }
        // "Total  10.999,042€"  (ultima linea de total suelta)
        for (var tj = tail.length - 1; tj >= 0; tj--) {
            var mt = String(tail[tj]).match(/^\s*Total\s*:?\s*(-?[0-9][0-9.]*[.,][0-9]+)\s*€?\s*$/i);
            if (mt) {
                res.totales.total = num(mt[1]);
                res.totales.totalDec = numDec(mt[1]);
                res.totales.totalMiles = numMiles(mt[1]);
                break;
            }
        }

        // --- desambiguacion de la coma de 3 cifras usando la aritmetica del
        // propio documento:  Origen + IVA  debe dar el Total declarado.
        if (!res._tot3 && res.totales.origen != null && res.totales.total != null) {
            var candO = [numDec(res._origenTexto || ''), numMiles(res._origenTexto || '')];
            var candI = [res._ivaDec, res._ivaMiles];
            var candT = [res.totales.totalDec, res.totales.totalMiles];
            var mejor = null;
            for (var a = 0; a < candO.length; a++) {
                for (var b = 0; b < candI.length; b++) {
                    for (var c = 0; c < candT.length; c++) {
                        if (candO[a] == null || candT[c] == null) { continue; }
                        var suma = candO[a] + (candI[b] || 0);
                        var err = Math.abs(suma - candT[c]);
                        if (mejor === null || err < mejor.err) { mejor = { err: err, o: candO[a], i: candI[b], t: candT[c] }; }
                    }
                }
            }
            if (mejor) {
                res.totales.origen = mejor.o;
                if (mejor.i != null) { res.totales.iva = mejor.i; }
                res.totales.total = mejor.t;
                res.totales.actual = mejor.o;
                res.totales.anterior = mejor.o;
                res._cuadre = mejor.err < 0.02 ? 'exacto' : (mejor.err < 1 ? 'redondeo' : 'revisar');
            }
        }
        if (res._tot3) {
            var mIv = tailText.match(/(-?[0-9][0-9.]*,[0-9]{2})[ \t]*€?[ \t]*I\.?V\.?A\.?\s*\(/i) || tailText.match(/I\.?V\.?A\.?\s*\([^)]*\)[ \t]*:?[ \t]*(-?[0-9][0-9.]*,[0-9]{2})/i);
            if (mIv) { res.totales.iva = numDec(mIv[1]); }
            else if (res.totales.ivaPct != null) { res.totales.iva = +(res.totales.actual * res.totales.ivaPct / 100).toFixed(2); }
            if (res.totales.total == null) { res.totales.total = +((res.totales.actual || 0) + (res.totales.iva || 0)).toFixed(2); }
            var errT = Math.abs((res.totales.actual || 0) + (res.totales.iva || 0) - res.totales.total);
            res._cuadre = errT < 0.02 ? 'exacto' : (errT < 1 ? 'redondeo' : 'revisar');
        }
        if (res.totales.iva == null && res.totales.origen != null && res.totales.ivaPct != null) {
            res.totales.iva = +(res.totales.origen * res.totales.ivaPct / 100).toFixed(3);
        }
        if (res.totales.total == null && res.totales.origen != null) {
            res.totales.total = +(res.totales.origen + (res.totales.iva || 0)).toFixed(3);
        }
        if (res._cuadre === 'revisar') {
            res.avisos.push('Los totales de la certificación no cuadran (Origen + IVA ≠ Total). Revisar en la pantalla de validación.');
        }

        // --- capítulos y subcapítulos
        var totalesCap = {};
        var ordenCap = [];
        // Columnas del cuadro de capítulos (orden en que aparecen en la cabecera del PDF)
        var colsHeader = [];
        for (var hi = 0; hi < lines.length && !colsHeader.length; hi++) {
            var ht = typeof lines[hi] === 'string' ? lines[hi] : analyseRow(lines[hi]).text;
            if (!ht) { continue; }
            var pm = ht.search(/\bMes\b/i), po = ht.search(/\bOrigen\b/i), pa = ht.search(/\bAnterior\b/i);
            if (pm >= 0 && po >= 0) {
                colsHeader = [['mes', pm], ['origen', po], ['anterior', pa]].filter(function (x) { return x[1] >= 0; })
                    .sort(function (a, b) { return a[1] - b[1]; }).map(function (x) { return x[0]; });
            }
        }
        function columnasMesOrigen(n) {
            var k = n.length, r = { mes: null, origen: null };
            if (!k) { return r; }
            if (colsHeader.length && k === colsHeader.length) {
                colsHeader.forEach(function (nm, i) { if (nm === 'mes') { r.mes = n[i]; } if (nm === 'origen') { r.origen = n[i]; } });
                return r;
            }
            if (k === 1) { r.origen = n[0]; return r; }   // columna Mes vacía: solo viene el origen
            var mesAntes = !(colsHeader.length && colsHeader.indexOf('origen') < colsHeader.indexOf('mes'));
            if (mesAntes) { r.mes = n[k - 2]; r.origen = n[k - 1]; } else { r.origen = n[k - 2]; r.mes = n[k - 1]; }
            return r;
        }
        for (var i = 0; i < lines.length; i++) {
            var line = typeof lines[i] === 'string' ? lines[i] : analyseRow(lines[i]).text;
            if (!line) { continue; }
            var mc = line.match(/^Total\s+Cap[ií]tulo\s+([A-Za-z0-9]{2,4})(?:\s*\(.*?\))?\s*-\s*(.*?)(?:\s+(-?[0-9][0-9.,]*)\s+(-?[0-9][0-9.,]*))?\s*$/);
            if (mc) {
                var vals = [];
                if (mc[3] != null) { vals.push(numDec(mc[3])); }
                if (mc[4] != null) { vals.push(numDec(mc[4])); }
                var mn = line.match(/^Total\s+Cap[ií]tulo\s+([A-Za-z0-9]{2,4})(?:\s*\(.*?\))?\s*-\s*(.*?)((?:\s+-?[0-9][0-9.]*[.,][0-9]+)*)\s*$/);
                var nums = [];
                if (mn && mn[3]) { mn[3].trim().split(/\s+/).forEach(function (s0) { var v0 = numDec(s0); if (v0 !== null && v0 !== undefined) { nums.push(v0); } }); }
                var cm = columnasMesOrigen(nums);
                var tri = null;
                if (res._tot3 && nums.length >= 3) { tri = { origen: nums[nums.length - 3], anterior: nums[nums.length - 2], actual: nums[nums.length - 1] }; }
                else if (res._tot3 && nums.length === 2) { tri = { origen: nums[0], anterior: nums[1], actual: 0, dos: true }; }
                if (!totalesCap[mc[1]]) { ordenCap.push(mc[1]); }
                totalesCap[mc[1]] = {
                    codigo: mc[1],
                    descripcion: clean(mn ? mn[2] : mc[2]),
                    anterior: tri ? tri.anterior : (vals.length > 1 ? vals[0] : null),
                    actual: tri ? tri.actual : (vals.length ? vals[vals.length - 1] : null),
                    importes: vals,
                    mes: tri ? (tri.actual || null) : cm.mes,
                    origen: tri ? tri.origen : cm.origen,
                    columnas3: tri ? true : undefined
                };
                continue;
            }
            var ms = line.match(/^Total\s+SubCap[ií]tulo\s+(\d{2}(?:\.\d+)+)\s*-\s*(.*?)(?:\s+(-?[0-9][0-9.,]*)\s+(-?[0-9][0-9.,]*))?\s*$/);
            if (ms) {
                var v2 = [];
                if (ms[3] != null) { v2.push(numDec(ms[3])); }
                if (ms[4] != null) { v2.push(numDec(ms[4])); }
                res.partidas.push({
                    nivel: 'subcapitulo', codigo: ms[1], descripcion: clean(ms[2]),
                    anterior: v2.length > 1 ? v2[0] : null,
                    actual: v2.length ? v2[v2.length - 1] : null
                });
                continue;
            }
            var mi = line.match(/^(\d{2}(?:\.\d+)+)\s+([a-zA-Z]{1,3})\s+(.+?)\s*(?:OR\s+AN\s+AC.*)?$/);
            if (mi) {
                res.partidas.push({
                    nivel: 'partida', codigo: mi[1], unidad: mi[2], descripcion: clean(mi[3]),
                    anterior: null, actual: null
                });
            }
        }
        res.capitulos = (res._tot3 ? ordenCap : Object.keys(totalesCap).sort()).map(function (k) { return totalesCap[k]; });

        if (res._tot3 && res.capitulos.length) {
            var hdr = {};
            lines.forEach(function (l0) {
                var h1 = l0.match(/^(\d{3})\s+([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ \/,.()-]{3,70})$/);
                var h2 = l0.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ \/,.()-]{3,70}?)(\d{3})$/);
                if (h1) { hdr[h1[1]] = clean(h1[2]); } else if (h2) { hdr[h2[2]] = clean(h2[1]); }
            });
            var faltan = Object.keys(hdr).filter(function (k0) { return !totalesCap[k0]; });
            var sO0 = 0, sA0 = 0, sC0 = 0;
            res.capitulos.forEach(function (c0) { sO0 += c0.origen || 0; sA0 += c0.anterior || 0; sC0 += c0.actual || 0; });
            if (faltan.length === 1 && Math.abs(sO0 - res.totales.origen) > 0.05) {
                var kf = faltan[0];
                var dO = +(res.totales.origen - sO0).toFixed(2), dA = +(res.totales.anterior - sA0).toFixed(2), dC = +(res.totales.actual - sC0).toFixed(2);
                var cNew = { codigo: kf, descripcion: hdr[kf], anterior: dA, actual: dC, importes: [], mes: dC || null, origen: dO, columnas3: true, porDiferencia: true };
                var ix = res.capitulos.length;
                for (var q = 0; q < res.capitulos.length; q++) { if (/^\d+$/.test(res.capitulos[q].codigo) && res.capitulos[q].codigo > kf) { ix = q; break; } }
                res.capitulos.splice(ix, 0, cNew);
                res.avisos.push('El capítulo ' + kf + ' (' + hdr[kf] + ') no trae línea de total en el PDF: su importe se ha calculado por diferencia con los totales (' + dO.toFixed(2).replace('.', ',') + ' € a origen).');
            }
            var sO = 0, sA = 0;
            res.capitulos.forEach(function (c0) { sO += c0.origen || 0; sA += c0.actual || 0; });
            if (Math.abs(sA - res.totales.actual) > 0.05) { res.avisos.push('Los capítulos leídos no suman la columna ACTUAL del total (' + sA.toFixed(2) + ' frente a ' + res.totales.actual.toFixed(2) + '). Revisa la validación.'); }
            if (Math.abs(sO - res.totales.origen) > 0.05) { res.avisos.push('Los capítulos leídos no suman la columna ORIGEN del total (' + sO.toFixed(2) + ' frente a ' + res.totales.origen.toFixed(2) + '). Revisa la validación.'); }
        }

        if (!res.capitulos.length && !res.partidas.length) {
            res.avisos.push('No se han reconocido partidas ni capítulos en la certificación.');
        }
        if (res.totales.origen == null) {
            res.avisos.push('No se ha identificado el total certificado. Comprueba la última página (bloque "Totales").');
        }
        return res;
    }

    /* ------------------------------------------- FICHA DE SEGUIMIENTO (PDF/Excel) */

    var ECON_LABELS = [
        { key: 'presupuestoObraAprox', label: 'Presupuesto obra aprox.', re: /^presupuesto\s*obra\s*aprox/i },
        { key: 'pendienteCertificar', label: 'Pendiente de certificar', re: /^pendiente\s*de\s*certificar/i },
        { key: 'pendienteFacturar', label: 'Pendiente de facturar', re: /^pendiente\s*de\s*facturar/i },
        { key: 'anticipoInicial', label: 'Anticipo inicial / Previsión de fondos', re: /^(?:anticipo\s*inicial|anticipo\s*inicial\s*\/\s*previsi[oó]n\s*de\s*fondos|previsi[oó]n\s*de\s*fondos)/i },
        { key: 'anticipoPendiente', label: 'Anticipo pendiente', re: /^pendiente\s*:/i },
        { key: 'descontado', label: 'Anticipo descontado', re: /^descontado/i },
        { key: 'totalSaldoFavorEnue', label: 'Total saldo pendiente de pago', re: /^total\s*saldo\s*a\s*favor\s*de\s*enue/i }
    ];

    function parseTracking(lines, opts) {
        var text = lines.join('\n');
        var res = {
            tipo: 'seguimiento',
            ident: { obra: null, cliente: null, fecha: null },
            kpis: {},
            facturas: [],
            pagos: [],
            partidas: [],
            avisos: []
        };
        var m = text.match(/Cliente\s*:\s*([^\n]{3,80})/i);
        if (m) { res.ident.cliente = clean(m[1]); }
        m = text.match(/proyecto\s+en\s+([^\n]{5,90})/i);
        if (m) { res.ident.obra = clean(m[1]); }
        m = text.match(/(?:Fecha|Actualizado a)\s*:?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
        if (m) { res.ident.fecha = m[1]; }

        // KPIs: se recorren TODAS las líneas buscando cada etiqueta
        for (var i = 0; i < lines.length; i++) {
            var line = typeof lines[i] === 'string' ? lines[i] : analyseRow(lines[i]).text;
            if (!line) { continue; }
            var nl = norm(line);
            for (var k = 0; k < ECON_LABELS.length; k++) {
                var def = ECON_LABELS[k];
                if (res.kpis[def.key] && res.kpis[def.key].valor != null) { continue; }
                if (def.re.test(line)) {
                    var found = null, j;
                    for (j = i; j <= Math.min(i + 2, lines.length - 1) && found === null; j++) {
                        var cur = typeof lines[j] === 'string' ? lines[j] : analyseRow(lines[j]).text;
                        var nums = String(cur).match(/-?[0-9][0-9.,]*/g) || [];
                        for (var n = 0; n < nums.length; n++) {
                            var v = num(nums[n]);
                            if (v !== null && v !== 0) { found = v; break; }
                        }
                        if (found === null && nums.length) { found = num(nums[0]); }
                    }
                    if (found === null) {
                        for (j = i; j <= Math.min(i + 2, lines.length - 1); j++) {
                            var c2 = typeof lines[j] === 'string' ? lines[j] : analyseRow(lines[j]).text;
                            var n2 = String(c2).match(/-?[0-9][0-9.,]*/g) || [];
                            for (var q = 0; q < n2.length; q++) {
                                var vv = num(n2[q]);
                                if (vv !== null) { found = vv; break; }
                            }
                            if (found !== null) { break; }
                        }
                    }
                    if (found !== null) {
                        res.kpis[def.key] = { etiqueta: def.label, valor: found, textoFuente: line };
                    }
                }
            }
        }
        // bloque de facturación agregada
        m = text.match(/Facturas\s*emitidas\s*[^0-9]{0,20}(-?[0-9][0-9.,]*)/i);
        if (m) { res.kpis.facturasEmitidas = { etiqueta: 'Facturas emitidas', valor: num(m[1]), textoFuente: m[0] }; }
        m = text.match(/Pagos\s*(?:r[ec]ibidos|recibidos)\s*[^0-9]{0,20}(-?[0-9][0-9.,]*)/i);
        if (m) { res.kpis.pagosRecibidos = { etiqueta: 'Pagos recibidos', valor: num(m[1]), textoFuente: m[0] }; }

        if (!Object.keys(res.kpis).length) {
            res.avisos.push('No se han reconocido los KPIs de la ficha. Pega el texto de la ficha para forzar la lectura.');
        }
        return res;
    }

    /* -------------------------------------------------------------- FACTURA (PDF) */

    function parseInvoice(lines, opts) {
        var text = lines.join('\n');
        var res = {
            tipo: 'factura',
            ident: { numero: null, fecha: null, cliente: null, cif: null },
            totales: { base: null, ivaPct: null, iva: null, total: null },
            pie: { pctRE: null, cuotaRE: null, suplidos: null, irpf: null, pctIRPF: null, pctRT: null, retGat: null, nota: null },
            avisos: []
        };
        var m = text.match(/(?:Factura|Fra\.?|N[ºo°]\s*Factura)\s*:?\s*(?:n[ºo°]?\s*)?([A-Z0-9][A-Z0-9._\/-]{1,24})/i);
        if (m) { res.ident.numero = clean(m[1]); }
        m = text.match(/Fecha\s*(?:de\s*expedici[oó]n)?\s*:?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
        if (m) { res.ident.fecha = m[1]; }
        m = text.match(/(?:C\.?I\.?F\.?|N\.?I\.?F\.?)\s*:?\s*([A-Z0-9][A-Z0-9-]{7,12})/i) ||
            text.match(/\b([A-HJ-NP-SUVW]\d{7}[0-9A-J]|\d{8}[A-Z])\b/);
        if (m) { res.ident.cif = clean(m[1]); }
        m = text.match(/(?:Cliente|Destinatario|A\s+la\s+atenci[oó]n\s+de)\s*:?\s*\n?\s*([^\n]{3,70})/i);
        if (m) { res.ident.cliente = clean(m[1]); }

        var base = amountAfter(text, '(?:Base\\s*Imponible|Importe\\s*Bruto|Subtotal|Base)', 40);
        var ivaPct = null, mPct = text.match(/I\.?V\.?A\.?\s*\(?\s*(\d{1,2}(?:[.,]\d{1,2})?)\s*%\s*\)?/i);
        if (mPct) { ivaPct = num(mPct[1]); }
        var ivaImp = amountAfter(text, '(?:Cuota\\s*(?:de\\s*)?I\\.?V\\.?A\\.?|I\\.?V\\.?A\\.?)', 30);
        var total = amountAfter(text, '(?:Total\\s*Factura|Total\\s*a\\s*pagar|Importe\\s*Total|Total\\s*\\€)', 30);

        res.totales.base = base;
        res.totales.ivaPct = ivaPct;
        res.totales.iva = ivaImp;
        res.totales.total = total;
        if (total == null) {
            var tt = text.match(/\bTotal\b[^0-9\-]{0,25}(-?[0-9][0-9.]*[.,][0-9]{2})\s*€?/i);
            if (tt) { res.totales.total = num(tt[1]); }
        }
        if (res.totales.iva == null && base != null && ivaPct != null) {
            res.totales.iva = +(base * ivaPct / 100).toFixed(2);
        }
        if (res.totales.total == null && base != null && res.totales.iva != null) {
            res.totales.total = +(base + res.totales.iva).toFixed(2);
        }
        if (res.totales.total == null) {
            res.avisos.push('No se ha identificado el total de la factura.');
        }
        res.pie.nota = (function () {
            var cand = [], ult = lines.slice(Math.max(0, lines.length - 30));
            ult.forEach(function (l) {
                var t = clean(l);
                if (!t) { return; }
                if (/^(aplicaci[oó]n|inversi[oó]n|operaci[oó]n|exenci[oó]n|exent[oa]|iva\s+(?:reducido|exento|superreducido))/i.test(t) ||
                    /Real\s+Decreto|\bArt(?:\.|[ií]culo)\s*\d|\bLey\s+\d+\/\d{4}/i.test(t)) {
                    if (cand.indexOf(t) < 0) { cand.push(t); }
                }
            });
            return cand.length ? cand.slice(0, 2).join(' ') : null;
        })();
        if (looksGarbled(lines)) {
            res.avisoGrave = 'El texto de esta factura no se ha podido leer: el PDF usa una fuente con ' +
                'codificación propia que el lector no sabe mapear. Abre el PDF, copia el texto y pégalo ' +
                'en la pantalla de validación para completar número, base, IVA y total.';
            res.avisos.push(res.avisoGrave);
        }
        return res;
    }

    /* ------------------------------------------------------------------ MATERIALES */

    var MAT_SYN = {
        codigo: ['codigo', 'cod', 'ref', 'referencia', 'item', 'id'],
        nombre: ['material', 'insumo', 'descripcion', 'concepto', 'articulo', 'producto', 'partida'],
        categoria: ['categoria', 'capitulo', 'familia', 'zona', 'tipo', 'gremio'],
        cantidad: ['cantidad', 'cant', 'uds', 'unidades', 'medicion', 'm2', 'm3', 'ml'],
        proveedor: ['proveedor', 'suministrador', 'marca', 'fabricante', 'tienda'],
        fecha: ['fecha', 'entrega', 'plazo', 'recepcion'],
        estado: ['estado', 'situacion', 'status', 'fase', 'seleccion']
    };
    var MAT_ESTADOS = [
        [/obra|recibid|entregad|acopi/i, 'En obra'],
        [/compr|pedido|adjudicad/i, 'Comprado'],
        [/aprob|valid|aceptad/i, 'Aprobado'],
        [/presupuest|oferta|cotiz|pedir/i, 'Pedir presupuesto'],
        [/elecc|pendient|selec|definir/i, 'Pendiente de elección']
    ];

    function pickField(row, keys, headers) {
        for (var i = 0; i < keys.length; i++) {
            for (var h = 0; h < headers.length; h++) {
                if (norm(headers[h]).indexOf(keys[i]) !== -1 && row[h] != null && String(row[h]).trim() !== '') {
                    return String(row[h]).trim();
                }
            }
        }
        return '';
    }

    function parseMaterials(sheets) {
        var out = { tipo: 'materiales', items: [], avisos: [], hojas: [] };
        var vistos = {};
        for (var s = 0; s < sheets.length; s++) {
            var sheet = sheets[s], rows = sheet.rows || [];
            out.hojas.push(sheet.name + ' (' + rows.length + ' filas)');
            // cabecera: primera fila con >=3 celdas no vacias
            var headerIdx = -1;
            for (var r = 0; r < Math.min(rows.length, 20); r++) {
                var nonEmpty = (rows[r] || []).filter(function (c) { return String(c).trim() !== ''; }).length;
                if (nonEmpty >= 3) { headerIdx = r; break; }
            }
            if (headerIdx < 0) { continue; }
            var headers = (rows[headerIdx] || []).map(function (c) { return String(c).trim(); });
            for (var i = headerIdx + 1; i < rows.length; i++) {
                var row = rows[i] || [];
                var nombre = pickField(row, MAT_SYN.nombre, headers);
                if (!nombre || nombre.length < 3) { continue; }
                if (/^total/i.test(norm(nombre))) { continue; }
                var codigo = pickField(row, MAT_SYN.codigo, headers) || ('MAT-' + (out.items.length + 1));
                var estadoRaw = pickField(row, MAT_SYN.estado, headers);
                var estado = 'Sin estado';
                for (var e = 0; e < MAT_ESTADOS.length; e++) {
                    if (estadoRaw && MAT_ESTADOS[e][0].test(norm(estadoRaw))) { estado = MAT_ESTADOS[e][1]; break; }
                }
                var key = norm(codigo) + '|' + norm(nombre);
                if (vistos[key]) { continue; }
                vistos[key] = 1;
                out.items.push({
                    id: codigo,
                    nombre: nombre,
                    categoria: pickField(row, MAT_SYN.categoria, headers) || 'General',
                    cantidad: pickField(row, MAT_SYN.cantidad, headers) || '—',
                    proveedor: pickField(row, MAT_SYN.proveedor, headers) || 'Por definir',
                    fechaEntrega: pickField(row, MAT_SYN.fecha, headers) || 'Pendiente',
                    estado: estado,
                    hoja: sheet.name
                });
            }
        }
        if (!out.items.length) {
            out.avisos.push('No se han encontrado filas de materiales. Se esperan columnas tipo ' +
                'Material/Descripción, Cantidad, Proveedor, Fecha, Estado.');
        }
        return out;
    }

    /* -------------------------------------- DEFINICIÓN DE MATERIALES POR FASES
     * Formato del libro "Definición":
     *   - primera hoja: resumen de la obra
     *   - hojas "Fase 1".."Fase 5": una tabla por fase, con cabeceras repetidas
     *     (GFH | ELEMENTO | DESCRIPCIÓN | COMENTARIOS | ESTADO | FECHA).
     *     El GFH va fusionado: solo aparece en la primera fila de cada bloque.
     *   - última hoja "datos": listas de opciones de referencia.
     * ---------------------------------------------------------------------- */

    function esFilaCabecera(rows) {
        var t = (rows || []).map(function (c) { return norm(c); }).join(' ');
        return /elemento/.test(t) && /descripcion/.test(t) && (/estado/.test(t) || /gfh/.test(t));
    }

    function normalizaEstado(v) {
        var s = clean(v).toUpperCase();
        if (!s) { return 'SIN ESTADO'; }
        return s.replace(/\s+/g, ' ');
    }

    /** Una hoja de fase -> lista de definiciones. */
    function parseFaseSheet(nombre, rows) {
        var fase = (String(nombre).match(/fase\s*(\d+)/i) || [])[1] || null;
        var titulo = clean((rows[0] || [])[0] || '');   // la primera fila es el título de la fase
        var definiciones = [];
        var gfh = '', elemento = '';
        for (var r = 1; r < rows.length; r++) {
            var fila = rows[r] || [];
            var col = function (i) { return clean(fila[i]); };
            if (esFilaCabecera(fila)) { gfh = ''; elemento = ''; continue; }
            var a = col(0), b = col(1), c = col(2), d = col(3), e = col(4), f = col(5);
            if (!a && !b && !c && !d && !e && !f) { continue; }
            // fila de sección: solo la primera columna
            if (a && !b && !c && !d && !e && !f) { gfh = a; elemento = ''; continue; }
            // fila con el grupo en A y algo en B: nuevo elemento
            if (a) { gfh = a; }
            if (b) { elemento = b; }
            // fila de definición: necesita elemento, descripción o estado
            if (!elemento && !c) { continue; }
            definiciones.push({
                fase: fase ? ('Fase ' + fase) : clean(nombre),
                faseNum: fase ? parseInt(fase, 10) : null,
                grupo: gfh || 'Sin grupo',
                elemento: elemento || '—',
                descripcion: c || '',
                comentarios: d || '',
                estado: normalizaEstado(e),
                fecha: f || '',
                hoja: nombre
            });
        }
        return { nombre: nombre, fase: fase ? ('Fase ' + fase) : clean(nombre), faseNum: fase ? parseInt(fase, 10) : null, titulo: titulo, definiciones: definiciones };
    }

    function parseMaterialPhases(sheets) {
        var out = { tipo: 'materiales', fases: [], items: [], avisos: [], hojas: [], estados: {}, grupos: [] };
        for (var s = 0; s < sheets.length; s++) {
            var sh = sheets[s];
            if (!/^\s*fase\s*\d+/i.test(String(sh.name || ''))) { continue; }
            var f = parseFaseSheet(sh.name, sh.rows || []);
            out.fases.push(f);
            out.hojas.push(sh.name + ' (' + f.definiciones.length + ' definiciones)');
            for (var i = 0; i < f.definiciones.length; i++) {
                var d = f.definiciones[i];
                out.items.push({
                    id: 'F' + (d.faseNum || '') + '-' + String(i + 1).padStart(2, '0'),
                    fase: d.fase, grupo: d.grupo, elemento: d.elemento,
                    nombre: d.descripcion || d.elemento,
                    categoria: d.grupo, comentarios: d.comentarios,
                    cantidad: '—', proveedor: '—',
                    fechaEntrega: d.fecha || '—',
                    estado: d.estado, hoja: d.hoja
                });
                out.estados[d.estado] = (out.estados[d.estado] || 0) + 1;
            }
        }
        // orden de fases
        out.fases.sort(function (a, b) {
            var na = a.faseNum === null ? 99 : a.faseNum, nb = b.faseNum === null ? 99 : b.faseNum;
            return na - nb;
        });
        // grupos únicos para filtros
        var vistos = {};
        out.items.forEach(function (i) {
            if (!vistos[i.grupo]) { vistos[i.grupo] = 1; out.grupos.push(i.grupo); }
        });
        out.grupos.sort();
        if (!out.items.length) {
            out.avisos.push('No se han reconocido hojas de fase. Se esperan hojas llamadas «Fase 1» … «Fase 5» con las columnas ' +
                'GFH, ELEMENTO, DESCRIPCIÓN, COMENTARIOS, ESTADO y FECHA.');
        }
        return out;
    }

    /* ------------------------------------------- RESUMEN DE OBRA + DATOS
     * Hoja "Resumen de la obra": proyecto, definición de planos y avance de fases.
     * Hoja "datos": listas de opciones de referencia (bloques 2D).
     * ---------------------------------------------------------------------- */

    function parseProjectSummary(sheets) {
        var out = {
            tipo: 'resumen_obra',
            obra: null, titulo: null,
            planos: [],            // [{ concepto, estado }]
            fases: [],             // [{ fase, estado, notas }]
            datos: [],             // [{ titulo, columnas:[{titulo, opciones:[]}] }]
            estados: [],           // valores de la columna ESTADO
            pedidos: [],           // valores de la columna PEDIDO
            avisos: [], hojas: []
        };
        var hojaResumen = null, hojaDatos = null;
        for (var s = 0; s < sheets.length; s++) {
            var n = norm(sheets[s].name);
            if (!hojaResumen && /resumen/.test(n)) { hojaResumen = sheets[s]; }
            if (!hojaDatos && /^\s*datos/.test(n)) { hojaDatos = sheets[s]; }
        }

        if (hojaResumen) {
            out.hojas.push(hojaResumen.name);
            var rows = hojaResumen.rows || [];
            var seccion = '';
            for (var r = 0; r < rows.length; r++) {
                var fila = rows[r] || [];
                var col = function (i) { return clean(fila[i]); };
                var a = col(0), b = col(1), c = col(2), d = col(3), e = col(4);
                if (!a && !b && !c && !d && !e) { continue; }
                var na = norm(a);
                if (/^definicion general/.test(na)) { out.titulo = a; seccion = ''; continue; }
                if (/^obra$/.test(na) && b) { out.obra = b; continue; }
                if (/^(definicion de planos|planos)/.test(na)) { seccion = 'planos'; continue; }
                if (/^avance de fases/.test(na)) { seccion = 'fases'; continue; }
                if (/^fase\s*\d+/.test(na)) {
                    out.fases.push({ fase: a.toUpperCase(), estado: b || '', notas: c || '' });
                    continue;
                }
                if (seccion === 'planos' && a) {
                    out.planos.push({ concepto: a, estado: b || '', notas: c || '' });
                }
            }
        }

        if (hojaDatos) {
            out.hojas.push(hojaDatos.name);
            var dr = hojaDatos.rows || [];
            // columnas ESTADO / PEDIDO de la cabecera de la hoja
            for (var i = 0; i < Math.min(dr.length, 10); i++) {
                for (var c2 = 0; c2 < (dr[i] || []).length; c2++) {
                    var v = clean(dr[i][c2]);
                    if (!v) { continue; }
                    if (norm(v) === 'estado') { out.estados = recogeColumna(dr, i + 1, c2); }
                    if (norm(v) === 'pedido') { out.pedidos = recogeColumna(dr, i + 1, c2); }
                }
            }
            // bloques 2D: una fila con varias cabeceras seguidas de filas de opciones
            var bloques = [];
            var i2 = 0;
            while (i2 < dr.length) {
                var fila = dr[i2] || [];
                var cabeceras = [];
                for (var c3 = 0; c3 < fila.length; c3++) {
                    if (clean(fila[c3])) { cabeceras.push({ col: c3, titulo: clean(fila[c3]) }); }
                }
                // ¿es una fila de cabeceras? (todas las celdas con texto corto y ninguna numérica)
                var pareceCabecera = cabeceras.length >= 2 && cabeceras.every(function (h) { return h.titulo.length <= 60 && !/^[\d.,]+$/.test(h.titulo); });
                if (!pareceCabecera) { i2++; continue; }
                // recoge las opciones de cada columna hasta dos filas vacías seguidas
                var columnas = cabeceras.map(function (h) { return { titulo: h.titulo, opciones: [] }; });
                var j = i2 + 1, vacias = 0;
                while (j < dr.length && vacias < 2) {
                    var fr = dr[j] || [];
                    var algo = false;
                    for (var k = 0; k < cabeceras.length; k++) {
                        var val = clean(fr[cabeceras[k].col]);
                        if (val) { columnas[k].opciones.push(val); algo = true; }
                    }
                    vacias = algo ? 0 : vacias + 1;
                    j++;
                }
                var conOpciones = columnas.filter(function (c) { return c.opciones.length; });
                if (conOpciones.length) {
                    bloques.push({ titulo: cabeceras.map(function (h) { return h.titulo; }).join(' / '), columnas: conOpciones });
                }
                i2 = Math.max(j, i2 + 1);
            }
            out.datos = bloques;
        }

        if (!out.obra && !out.planos.length) {
            out.avisos.push('No se ha reconocido la hoja «Resumen de la obra». Se esperan ahí el nombre de la obra, ' +
                'la definición de planos y el avance de fases.');
        }
        return out;
    }

    function recogeColumna(rows, desde, col) {
        var vals = [], vacias = 0;
        for (var i = desde; i < rows.length && vacias < 2; i++) {
            var v = clean((rows[i] || [])[col]);
            if (v) { if (vals.indexOf(v) === -1) { vals.push(v); } vacias = 0; } else { vacias++; }
        }
        return vals;
    }

    /* ------------------------------------------ IDENTIFICACIÓN AUTOMÁTICA
     * Deduce la obra, el cliente y la quincena a partir de los documentos
     * cargados, sin que el usuario tenga que escribir nada.
     * Prioridad de fuentes (de más a menos fiable):
     *   1. Excel de definición: hoja "Resumen de la obra" -> nombre de la obra
     *   2. Certificación: Obra / Presupuesto / Cliente / Fecha
     *   3. Presupuesto: PROYECTO / CLIENTE (van en línea aparte)
     *   4. Ficha de seguimiento (suele venir carácter a carácter)
     *   5. Nombre del archivo como último recurso
     * ---------------------------------------------------------------------- */

    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
        'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    var MESES_ABREV = {
        ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6,
        jul: 7, ago: 8, sep: 9, sept: 9, set: 9, oct: 10, nov: 11, dic: 12
    };

    var RE_FECHA = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/;

    /** Convierte a Date interpretando dd/mm/aaaa (formato español). */
    function fechaEspanola(txt) {
        var m = String(txt || '').match(RE_FECHA);
        if (!m) { return null; }
        var d = parseInt(m[1], 10), mes = parseInt(m[2], 10), a = parseInt(m[3], 10);
        if (a < 100) { a += 2000; }
        if (mes < 1 || mes > 12 || d < 1 || d > 31) {
            // quizá venga en formato aaaa-mm-dd
            var m2 = String(txt).match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
            if (m2) { return new Date(parseInt(m2[1], 10), parseInt(m2[2], 10) - 1, parseInt(m2[3], 10)); }
            return null;
        }
        return new Date(a, mes - 1, d);
    }

    /** "15/09/2026" -> "2ª quincena de septiembre de 2026" (días 1-15 = 1ª). */
    function periodoDesdeFecha(txt) {
        var f = (txt instanceof Date) ? txt : fechaEspanola(txt);
        if (!f || isNaN(f.getTime())) { return null; }
        var q = f.getDate() <= 15 ? 1 : 2;
        return {
            fecha: f,
            quincena: q,
            etiqueta: q + 'ª quincena de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear(),
            corto: MESES[f.getMonth()].slice(0, 3) + '-' + f.getFullYear() + '-Q' + q
        };
    }

    /** Intenta sacar una fecha del nombre del archivo ("... 15 de septiembre.pdf"). */
    function periodoDesdeNombre(nombre) {
        var base = String(nombre || '').replace(/\.(pdf|xlsx|xls|csv)$/i, '');
        var n = norm(base);
        // 0) "16 de octubre", "15 septiembre", "septiembre 2026"
        var mDia = n.match(/(\d{1,2})\s*(?:de\s+)?([a-z]{3,12})/);
        var mesDetectado = -1;
        if (mDia) {
            var palabra = mDia[2];
            for (var w = 0; w < MESES.length; w++) {
                if (MESES[w].indexOf(palabra) === 0 || palabra.indexOf(MESES[w].slice(0, 3)) === 0) { mesDetectado = w; break; }
            }
        }
        var elegido = mesDetectado;
        if (elegido === -1) {
            for (var i = 0; i < MESES.length; i++) {
                if (new RegExp('\\b' + MESES[i] + '\\b').test(n)) { elegido = i; break; }
            }
        }
        if (elegido === -1) {
            var claves = Object.keys(MESES_ABREV);
            for (var k = 0; k < claves.length; k++) {
                if (new RegExp('\\b' + claves[k] + '\\b').test(n)) { elegido = MESES_ABREV[claves[k]] - 1; break; }
            }
        }
        if (elegido >= 0) {
            var anio = base.match(/(20\d{2})/);
            var dia = mDia ? parseInt(mDia[1], 10) : 15;
            if (dia < 1 || dia > 31) { dia = 15; }
            return periodoDesdeFecha(new Date(anio ? parseInt(anio[1], 10) : new Date().getFullYear(), elegido, dia));
        }
        var mf = base.match(RE_FECHA);
        return mf ? periodoDesdeFecha(mf[0]) : null;
    }

    /** Busca el valor que sigue a una etiqueta, admitiendo salto de línea. */
    function valorTrasEtiqueta(texto, etiqueta, maxLen) {
        var re = new RegExp(etiqueta + '\\s*:?\\s*\\n?\\s*([^\\n]{3,' + (maxLen || 90) + '})', 'i');
        var m = String(texto).match(re);
        if (!m) { return null; }
        var v = clean(m[1]);
        // descarta cabeceras de columna y valores sin contenido real
        if (!v || /^(cliente|proyecto|obra|direcci[oó]n|fecha|expediente|c\.?i\.?f\.?|n[ºo°])$/i.test(v)) { return null; }
        return v;
    }

    /** Limpia un nombre de obra: quita el código de expediente y la versión. */
    function limpiaNombreObra(v) {
        if (!v) { return null; }
        var s = clean(v);
        s = s.replace(/\(versi[oó]n\s*\d+\)/ig, '').trim();
        s = s.replace(/^(?:obra|proyecto)\s*:?\s*/i, '').trim();
        return s || null;
    }

    function puntuaCliente(nombre, fuente) {
        var v = clean(nombre || '');
        var n = norm(v);
        var p = 0;
        if (fuente === 'certificacion') { p += 40; }
        if (fuente === 'presupuesto') { p += 35; }
        if (fuente === 'ficha') { p += 15; }
        if (fuente === 'excel') { p += 30; }
        // los PDFs "carácter a carácter" devuelven el nombre sin espacios: se penalizan
        if (v.indexOf(' ') !== -1) { p += 25; }
        var palabras = v.split(/\s+/).filter(Boolean).length;
        if (palabras >= 2) { p += 10; }
        if (palabras >= 3) { p += 6; }
        if (v.replace(/\s/g, '').length < 8) { p -= 20; }
        if (/^(d\.?|do[nñ]a|sr\.?|sra\.?)\s*$/i.test(v)) { p -= 40; }
        if (/^\d/.test(n)) { p -= 10; }
        return p;
    }

    function puntuaObra(nombre, fuente) {
        var n = norm(nombre || '');
        var p = 0;
        if (fuente === 'excel') { p += 60; }
        if (fuente === 'certificacion') { p += 40; }
        if (fuente === 'presupuesto') { p += 35; }
        if (fuente === 'ficha') { p += 20; }
        if (fuente === 'archivo') { p += 5; }
        if (/villarrasa|calle|avenida|c\/|obra|reforma|vivienda/i.test(n)) { p += 8; }
        if (n.length > 8 && n.length < 70) { p += 6; }
        if (n.length >= 20) { p += 6; }            // los nombres completos describen mejor
        if (/\s-\s|\s\(/.test(nombre)) { p += 4; } // "… - DF Cristina Andrés"
        if (/construccion|proyectos|s\.?\s*l|sl$|enue/i.test(n)) { p -= 45; }  // el contratista no es la obra
        if (/^[0-9.\-\s]+$/.test(n)) { p -= 30; }
        return p;
    }

    /**
     * Deduce los datos identificativos.
     * @param {object} docs  { pdf1, pdf2, pdf3, pdf4, excel5, _ficheros: {zona: nombreArchivo} }
     * @param {object} resumenObra  salida de parseProjectSummary (opcional)
     */
    function identificarObra(docs, resumenObra) {
        docs = docs || {};
        var candObra = [], candCliente = [], candExpediente = [], candPeriodo = [], notas = [];

        function add(lista, valor, fuente, peso) {
            if (!valor) { return; }
            var v = clean(valor);
            if (!v || v.length < 3) { return; }
            lista.push({ valor: v, fuente: fuente, peso: peso || 0 });
        }

        // 1. Excel de definición
        if (resumenObra && resumenObra.obra) {
            add(candObra, resumenObra.obra, 'excel', 0);
        }

        // 2. Certificación
        var cer = docs.pdf1;
        if (cer && cer.ident) {
            add(candObra, limpiaNombreObra(cer.ident.obra), 'certificacion', 0);
            add(candCliente, cer.ident.cliente, 'certificacion', 0);
            add(candExpediente, cer.ident.presupuesto, 'certificacion', 0);
            if (cer.ident.fecha) { add(candPeriodo, cer.ident.fecha, 'certificacion', 0); }
        }

        // 3. Presupuesto (PROYECTO y CLIENTE van en la línea siguiente)
        var pre = docs.pdf2;
        if (pre && pre._lineas) {
            var texto = pre._lineas.join('\n');
            var vProy = valorTrasEtiqueta(texto, 'PROYECTO', 110) || valorTrasEtiqueta(texto, 'Denominaci[oó]n', 110);
            var vCli = valorTrasEtiqueta(texto, 'CLIENTE', 80);
            var vDir = valorTrasEtiqueta(texto, 'DIRECCI[OÓ]N', 110);
            var vExp = texto.match(/\b(\d{4,6}\.\d{2})\b/);
            add(candObra, limpiaNombreObra(vProy), 'presupuesto', 0);
            add(candCliente, vCli, 'presupuesto', 0);
            add(candExpediente, vExp ? vExp[1] : null, 'presupuesto', 0);
            if (vDir) { notas.push('Dirección de la obra: ' + vDir); }
        } else if (pre && pre.ident) {
            add(candObra, limpiaNombreObra(pre.ident.proyecto), 'presupuesto', 0);
            add(candCliente, pre.ident.cliente, 'presupuesto', 0);
            add(candExpediente, pre.ident.expediente, 'presupuesto', 0);
        }

        // 4. Ficha de seguimiento
        var seg = docs.pdf3;
        if (seg) {
            if (seg.ident && seg.ident.obra) { add(candObra, seg.ident.obra, 'ficha', 0); }
            if (seg.ident && seg.ident.cliente) { add(candCliente, seg.ident.cliente, 'ficha', 0); }
            if (seg._lineas) {
                var tf = seg._lineas.join('\n');
                var mProy = tf.match(/proyecto\s+en\s+([^\n]{5,80})/i);
                if (mProy) { add(candObra, mProy[1], 'ficha', 0); }
                var mCli = tf.match(/Cliente\s*:\s*([^\n]{4,60})/i);
                if (mCli) { add(candCliente, mCli[1], 'ficha', 0); }
            }
        }

        // 5. Nombre del archivo (último recurso)
        var ficheros = docs._ficheros || {};
        Object.keys(ficheros).forEach(function (zona) {
            var nom = String(ficheros[zona] || '').replace(/\.(pdf|xlsx|xls)$/i, '');
            var p = periodoDesdeNombre(nom);
            if (p) { add(candPeriodo, p.fecha, 'archivo:' + zona, 0); }
            // nombre de obra plausible dentro del nombre del archivo
            var limpio = nom.replace(/(certificaci[oó]n|presupuesto|ficha|seguimiento|econ[oó]mico|de|del|la|el)/ig, ' ')
                .replace(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/g, ' ')
                .replace(/\b(20\d{2}|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/ig, ' ')
                .replace(/[_\-\s]+/g, ' ').trim();
            if (limpio.length > 8 && limpio.length < 60) { add(candObra, limpio, 'archivo', 0); }
        });

        // --- resolución: el candidato con más puntos; si empatan, el más largo
        function mejor(lista, tipo) {
            if (!lista.length) { return null; }
            var vistos = {};
            var unicos = [];
            lista.forEach(function (c) {
                var k = norm(c.valor);
                if (vistos[k]) { vistos[k].rep = (vistos[k].rep || 1) + 1; return; }
                vistos[k] = c; c.rep = 1; unicos.push(c);
            });
            unicos.forEach(function (c) {
                var base;
                if (tipo === 'obra') { base = puntuaObra(c.valor, c.fuente); }
                else if (tipo === 'cliente') { base = puntuaCliente(c.valor, c.fuente); }
                else { base = 30; }
                c.total = base + c.peso + (c.rep - 1) * 12 + Math.min(20, c.valor.length / 3);
            });
            unicos.sort(function (a, b) { return b.total - a.total; });
            return unicos[0];
        }

        var obra = mejor(candObra, 'obra');
        var cliente = mejor(candCliente, 'cliente');
        var expediente = mejor(candExpediente, 'expediente');

        // --- periodo: la fecha más reciente entre las encontradas
        var periodos = [];
        candPeriodo.forEach(function (c) {
            var p = periodoDesdeFecha(c.valor);
            if (p) { periodos.push(p); }
        });
        // también la fecha del presupuesto y de la factura
        if (pre && pre.ident && pre.ident.fecha) {
            var pf = periodoDesdeFecha(pre.ident.fecha);
            if (pf) { periodos.push(pf); }
        }
        if (docs.pdf4 && docs.pdf4.ident && docs.pdf4.ident.fecha) {
            var ff = periodoDesdeFecha(docs.pdf4.ident.fecha);
            if (ff) { periodos.push(ff); }
        }
        // último recurso: la fecha que aparezca en el nombre de los archivos
        if (!periodos.length) {
            Object.keys(ficheros).forEach(function (zona) {
                var p = periodoDesdeNombre(String(ficheros[zona] || ''));
                if (p) { periodos.push(p); }
            });
        }
        periodos.sort(function (a, b) { return b.fecha - a.fecha; });
        var periodo = periodos[0] || null;

        // --- conflictos entre fuentes (para avisar en la validación)
        var conflictos = [];
        function variantes(lista) {
            var v = {};
            lista.forEach(function (c) { v[norm(c.valor)] = (v[norm(c.valor)] || 0) + 1; });
            return Object.keys(v);
        }
        if (variantes(candObra).length > 1) {
            conflictos.push('Se han leído ' + variantes(candObra).length + ' nombres de obra distintos: ' +
                variantes(candObra).slice(0, 3).map(function (x) { return '"' + x + '"'; }).join(', ') + '. Se ha elegido el más fiable.');
        }
        if (variantes(candCliente).length > 1) {
            conflictos.push('Se han leído ' + variantes(candCliente).length + ' clientes distintos; comprueba cuál es el correcto.');
        }

        var nombre = obra ? obra.valor : null;
        // identificador final: nombre de obra + quincena
        var identificador = null;
        if (nombre) {
            identificador = nombre + (periodo ? ' · ' + periodo.etiqueta : '');
        } else if (periodo) {
            identificador = 'Obra sin nombre · ' + periodo.etiqueta;
        }

        return {
            obra: nombre,
            obraFuente: obra ? obra.fuente : null,
            obraCandidatos: candObra.map(function (c) { return { valor: c.valor, fuente: c.fuente, puntos: c.total || 0 }; })
                .sort(function (a, b) { return b.puntos - a.puntos; }),
            cliente: cliente ? cliente.valor : null,
            clienteFuente: cliente ? cliente.fuente : null,
            expediente: expediente ? expediente.valor : null,
            fecha: periodo ? periodo.fecha : null,
            fechaTexto: periodo ? (periodo.fecha.getDate() + '/' + (periodo.fecha.getMonth() + 1) + '/' + periodo.fecha.getFullYear()) : null,
            quincena: periodo ? periodo.quincena : null,
            periodo: periodo ? periodo.etiqueta : null,
            periodoCorto: periodo ? periodo.corto : null,
            identificador: identificador,
            slug: (function () {
                var base = (nombre || 'obra') + (periodo ? ' ' + periodo.corto : '');
                return norm(base).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            })(),
            notas: notas,
            conflictos: conflictos
        };
    }

    /* ------------------------------------------------------------------ CSV */

    function parseCsv(text) {
        var lines = String(text).replace(/\uFEFF/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
        if (!lines.length) { return []; }
        var first = lines[0];
        var sep = ',';
        if ((first.match(/;/g) || []).length > (first.match(/,/g) || []).length) { sep = ';'; }
        else if ((first.match(/\t/g) || []).length > (first.match(/,/g) || []).length) { sep = '\t'; }
        return lines.map(function (l) {
            return l.split(sep).map(function (c) { return c.trim().replace(/^["']|["']$/g, ''); });
        });
    }

    /* --------------------------------------------------------- texto corrupto */

    /**
     * Heurística: detecta texto que ha salido ilegible porque el PDF usa una
     * fuente con codificación propia que el lector no sabe mapear. En ese caso
     * lo correcto no es inventar datos, sino avisar y ofrecer el pegado manual.
     */
    function looksGarbled(lines) {
        var sample = lines.slice(0, 40).join(' ');
        if (sample.length < 60) { return false; }
        var letters = (sample.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g) || []).length;
        var simbolos = (sample.match(/[&$()*+<=>@\[\]{}|~_\\^`]/g) || []).length;
        var espacios = (sample.match(/\s/g) || []).length;
        var ratioSimbolos = simbolos / sample.length;
        var ratioLetras = letters / sample.length;
        var ratioEspacios = espacios / sample.length;
        // texto sano: muchas letras, algunos espacios, pocos simbolos raros
        return (ratioSimbolos > 0.10 && ratioLetras > 0.45) || ratioEspacios < 0.03;
    }

    /* --------------------------------------------------------- estadísticas */

    function stats(obj, keys) {
        var found = 0, total = 0;
        for (var i = 0; i < keys.length; i++) {
            total++;
            var path = keys[i].split('.');
            var cur = obj;
            for (var p = 0; p < path.length; p++) { cur = cur == null ? null : cur[path[p]]; }
            if (cur !== null && cur !== undefined && cur !== '') { found++; }
        }
        return { encontrados: found, total: total, pct: total ? Math.round((found / total) * 100) : 0 };
    }

    return {
        version: '2.0',
        norm: norm,
        clean: clean,
        deLigature: deLigature,
        num: num,
        numDec: numDec,
        numMiles: numMiles,
        toNumber: toNumber,
        amountAfter: amountAfter,
        analyseRow: analyseRow,
        looksCharSpaced: looksCharSpaced,
        pageToLines: pageToLines,
        linesFromRows: linesFromRows,
        rowsFromItems: rowsFromItems,
        parseTable: parseTable,
        parseBudget: parseBudget,
        parseCertification: parseCertification,
        parseTracking: parseTracking,
        parseInvoice: parseInvoice,
        parseMaterials: parseMaterials,
        parseMaterialPhases: parseMaterialPhases,
        parseProjectSummary: parseProjectSummary,
        parseFaseSheet: parseFaseSheet,
        identificarObra: identificarObra,
        periodoDesdeFecha: periodoDesdeFecha,
        periodoDesdeNombre: periodoDesdeNombre,
        fechaEspanola: fechaEspanola,
        parseCsv: parseCsv,
        looksGarbled: looksGarbled,
        readWorkbook: readWorkbook,
        stats: stats,
        labels: { econ: ECON_LABELS, matSyn: MAT_SYN, matEstados: MAT_ESTADOS }
    };
}));

/*__DX_FIN__*/
</script>

<script>
/*__REPORT_INICIO__*/
/* ==========================================================================
   Motor de informes (DXReport): genera las 12 pestañas del dashboard.
   Lo comparten la aplicación y el informe exportado.

/* ============================================================================
 * ENUE Obras — MOTOR DE INFORMES (compartido)
 * ----------------------------------------------------------------------------
 * Genera el HTML de las 12 pestañas del dashboard a partir de un objeto de

(function (root) {

    }

    function tabla(headers, filas, alineaciones) {

        }).join('') + '</tr>';
        var b = filas.map(function (f) {
            return '<tr>' + f.map(function (c, i) {
                return '<td class="' + ((alineaciones && alineaciones[i]) || '') + '">' + c + '</td>';
            }).join('') + '</tr>';

    }

    function sinDatos(que, detalle) {

            esc(detalle || 'Carga el documento correspondiente y vuelve a generar el dashboard.') + '</p></div>';
    }

    function filaCabecera(titulo, descripcion, extra) {
        return '<div class="bloque-head"><div><h3>' + esc(titulo) + '</h3><p>' + esc(descripcion) + '</p></div>' +
            (extra ? '<span class="chip">' + esc(extra) + '</span>' : '') + '</div>';
    }

    function claseEstado(estado) {

            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function resumenEstados(items) {
        var mapa = {};
        items.forEach(function (i) { mapa[i.estado] = (mapa[i.estado] || 0) + 1; });
        var orden = ['ELEGIDO', 'EN PROCESO', 'PENDIENTE', 'MODIFICADO', 'NO PROCEDE', 'SIN ESTADO'];
        return Object.keys(mapa).sort(function (a, b) {
            var ia = orden.indexOf(a), ib = orden.indexOf(b);
            if (ia === -1) { ia = 99; }
            if (ib === -1) { ib = 99; }
            return ia - ib || a.localeCompare(b);
        }).map(function (k) { return { estado: k, n: mapa[k] }; });
    }

    /* ------------------------------------------------------------ pestañas */

    function ivaDe(D) {
        var p = (D.presupuesto && D.presupuesto.totales) || {}, c = (D.certificacion && D.certificacion.totales) || {}, f = (D.factura && D.factura.totales) || {};
        var cand = [p.ivaPct, c.ivaPct, f.ivaPct];
        for (var i = 0; i < cand.length; i++) { if (cand[i] !== null && cand[i] !== undefined && !isNaN(cand[i])) { return cand[i]; } }
        return null;
    }

    function kpisCabecera(D) {
        var p = D.presupuesto || {}, c = D.certificacion || {}, s = D.seguimiento || {}, f = D.factura || {};
        var ok = function (v) { return v !== null && v !== undefined && !isNaN(v); };
        var pem = p.totales ? p.totales.pem : null;
        var cert = c.totales ? c.totales.origen : null;
        var iva = ivaDe(D);
        var fac = iva === null ? 1 : 1 + iva / 100;
        var pemIva = (p.totales && ok(p.totales.total)) ? p.totales.total : ((ok(pem) && iva !== null) ? pem * fac : null);
        var certIva = (ok(cert) && iva !== null) ? cert * fac : null;

        var rv = function (key, sin) {
            var r = s.resumen && s.resumen[key];
            if (r && ok(r.total)) { return r.total; }
            return (ok(sin) && iva !== null) ? sin * fac : null;
        };
        var pendCert = kv('pendienteCertificar'), pendFact = kv('pendienteFacturar');
        return {
            pem: pem, cert: cert, iva: iva,
            pemIva: pemIva, certIva: certIva,
            pctCert: (pem && cert !== null) ? (cert / pem) * 100 : null,
            certTotal: c.totales ? c.totales.total : null,
            saldo: kv('totalSaldoFavorEnue'),
            pendCert: pendCert, pendFact: pendFact,
            pendCertIva: rv('pendienteCertificar', pendCert),
            pendFactIva: rv('pendienteFacturar', pendFact),
            facturaTotal: f.totales ? f.totales.total : null
        };
    }

    function columnasCapitulo(x) {
        var okN = function (v) { return v !== null && v !== undefined && !isNaN(v); };
        var pos = (x.cOrigen !== undefined || x.cAnterior !== undefined || x.cActual !== undefined);
        var o = okN(x.origen) ? x.origen : (okN(x.cOrigen) ? x.cOrigen : (okN(x.actual) ? x.actual : null));
        var a = pos ? (okN(x.cAnterior) ? x.cAnterior : null) : ((x.columnas3 && okN(x.anterior)) ? x.anterior : null);
        var m = okN(x.mes) ? x.mes : (okN(x.cActual) ? x.cActual : ((!pos && okN(x.actual)) ? x.actual : null));
        return { origen: o, anterior: a, actual: m };

        var aOrigen = function (c) { return (c.origen !== undefined && c.origen !== null && !isNaN(c.origen)) ? c.origen : c.actual; };
        var conI = function (v) { return (v === null || v === undefined || isNaN(v) || fac === null) ? null : v * fac; };

                pct: (certif !== null && certif !== undefined && p.importeSinIva) ? (certif / p.importeSinIva) * 100 : null
            });

        });

                var kx = columnasCapitulo(c);

            }
        });

    }

    function materialesInfo(D) {
        var m = D.materiales;
        var items = (m && m.items) || [];
        var orden = ['En obra', 'Comprado', 'Aprobado', 'Pedir presupuesto', 'Pendiente de elección', 'Sin estado'];
        var mapa = {};
        items.forEach(function (i) { mapa[i.estado] = (mapa[i.estado] || 0) + 1; });
        return {
            items: items,
            porEstado: orden.filter(function (e) { return mapa[e]; }).map(function (e) {
                return { estado: e, n: mapa[e], clase: e.toLowerCase().replace(/[^a-z]+/g, '-') };
            })
        };
