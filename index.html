<style>
/*__CSS_INICIO__*/
/* ============================================================================
   ENUE Proyectos y Construcción — estilos corporativos
   Paleta: verde corporativo, blanco hueso y negro.
   Para ajustar el verde, cambia solo las variables --verde* de este bloque.
   ========================================================================== */
:root {
    --verde: #1B5E34;
    --verde-osc: #123F24;
    --verde-med: #2F7D4D;
    --verde-claro: #E3EDE5;
    --verde-lima: #9BD3AE;
    --hueso: #F4F1E8;
    --hueso-2: #EAE6D8;
    --papel: #FBFAF5;
    --linea: #D8D3C3;
    --linea-fuerte: #B9B3A0;
    --negro: #111411;
    --texto: #1B1F1B;
    --suave: #5A5D55;
    --tenue: #8A8C82;
    --ambar: #8A6A12;
    --ambar-bg: #F6EDCF;
    --ambar-bd: #E3D49B;
    --rojo: #8E2A1D;
    --rojo-bg: #F5E1DC;
    --rojo-bd: #E2B8AE;
    --alto-cab: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    background: var(--hueso);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
}
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
h1, h2, h3 { color: var(--negro); }

/* ---------------------------------------------------------------- cabecera */
.cabecera { background: var(--negro); color: var(--hueso); position: sticky; top: 0; z-index: 60; border-bottom: 3px solid var(--verde-med); }
.cabecera-in { width: 100%; height: var(--alto-cab); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.marca { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.marca .logo { width: 34px; height: 34px; background: var(--verde); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .5px; border-radius: 2px; }
.marca strong { display: block; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1.15; }
.marca small { display: block; color: #A9AB9F; font-size: 11px; letter-spacing: .04em; line-height: 1.2; }
.chip-lector, .cab-estado, .cabecera-in .solo-lectura { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #B5B7AB; white-space: nowrap; }

.contenido { width: 100%; padding: 24px 28px 64px; }
.pie { width: 100%; padding: 16px 28px 32px; display: flex; justify-content: space-between; gap: 10px; color: var(--suave); font-size: 12px; flex-wrap: wrap; border-top: 1px solid var(--linea); }

/* ----------------------------------------------------------------- botones */
.btn-primario, .btn-sec, .btn-mini {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 3px; transition: background .15s, color .15s, border-color .15s;
    border: 1px solid transparent; padding: 9px 18px; font-size: 13px; letter-spacing: .01em;
}
.btn-primario { background: var(--verde); color: #fff; border-color: var(--verde); }
.btn-primario:hover { background: var(--verde-osc); border-color: var(--verde-osc); }
.btn-primario.grande { padding: 13px 28px; font-size: 14px; }
.btn-sec { background: transparent; color: var(--negro); border-color: var(--negro); }
.btn-sec:hover { background: var(--negro); color: var(--hueso); }
.btn-mini { padding: 4px 10px; font-size: 12px; background: var(--negro); color: #fff; }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, .tab:focus-visible, summary:focus-visible { outline: 2px solid var(--verde-med); outline-offset: 2px; }

/* -------------------------------------------------------------- generador */
.gen-hero { text-align: left; margin: 0 0 22px; padding-bottom: 18px; border-bottom: 1px solid var(--linea); }
.gen-hero h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.gen-hero p { margin: 0; color: var(--suave); font-size: 14px; max-width: 760px; }
.gen-card { background: var(--papel); border: 1px solid var(--linea); border-radius: 3px; padding: 24px; }
.gen-card.centro { max-width: 560px; margin: 64px auto; text-align: center; }
.gen-cab { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; padding-top: 16px; border-top: 1px solid var(--linea); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.gen-acciones { text-align: left; margin-top: 24px; }
.nota-pie { font-size: 12px; color: var(--suave); margin: 8px 0 0; }
.chip { background: var(--hueso-2); color: var(--texto); border: 1px solid var(--linea); border-radius: 2px; padding: 3px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }

.zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.zona { border: 1px dashed var(--linea-fuerte); border-radius: 3px; padding: 14px; background: var(--hueso); display: flex; flex-direction: column; gap: 8px; transition: background .15s, border-color .15s; }
.zona.arrastrando { border-color: var(--verde); background: var(--verde-claro); }
.zona.con-archivo { border: 1px solid var(--verde-med); background: #EEF4EF; }
.zona-top { display: flex; justify-content: space-between; align-items: center; }
.zona-id { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--verde); }
.zona-quitar { border: none; background: none; color: var(--tenue); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
.zona-quitar:hover { color: var(--rojo); }
.zona-titulo { font-size: 13px; font-weight: 600; cursor: pointer; line-height: 1.35; }
.zona-titulo:hover { color: var(--verde); }
.zona-vacio { font-size: 12px; color: var(--tenue); }
.zona-archivo { background: var(--papel); border: 1px solid var(--linea); border-radius: 2px; padding: 6px 8px; font-size: 11px; }
.zona-archivo span { display: block; font-weight: 600; color: var(--verde-osc); word-break: break-all; }
.zona-archivo small { color: var(--suave); }
.zona-pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
.zona-btn { font-size: 11px; font-weight: 600; color: #fff; background: var(--verde); border-radius: 2px; padding: 5px 11px; cursor: pointer; }
.zona-btn:hover { background: var(--verde-osc); }
.zona-texto { font-size: 11px; font-weight: 600; color: var(--texto); background: var(--papel); border: 1px solid var(--linea-fuerte); border-radius: 2px; padding: 4px 10px; cursor: pointer; }
.zona-texto:hover { border-color: var(--negro); }
.zona-area { display: none; width: 100%; min-height: 90px; font-family: ui-monospace, monospace; font-size: 11px; padding: 8px; border: 1px solid var(--linea-fuerte); border-radius: 3px; resize: vertical; background: var(--papel); }
.zona-area.abierta { display: block; }

/* ------------------------------------------------------------ procesando */
.pasos { list-style: none; padding: 0; margin: 20px 0 0; text-align: left; }
.pasos li { font-size: 13px; color: var(--tenue); padding: 6px 0 6px 24px; position: relative; }
.pasos li::before { content: ''; position: absolute; left: 0; top: 10px; width: 10px; height: 10px; border: 1.5px solid var(--linea-fuerte); border-radius: 50%; }
.pasos li.actual { color: var(--negro); font-weight: 600; }
.pasos li.actual::before { border-color: var(--verde); background: var(--verde-claro); }
.pasos li.hecho { color: var(--verde-osc); }
.pasos li.hecho::before { border-color: var(--verde); background: var(--verde); }
.progreso { font-weight: 700; color: var(--negro); margin: 10px 0 0; }

.barra { background: var(--hueso-2); border-radius: 1px; height: 8px; overflow: hidden; width: 100%; }
.barra.grande { height: 10px; }
.barra-i { height: 100%; background: var(--verde); transition: width .2s; }
.barra-i.verde { background: var(--verde); }
.barra-i.ambar { background: #C29A1E; }
.barra-i.rojo { background: #B5402F; }
.barra-i.indet { width: 35%; animation: indet 1.2s ease-in-out infinite alternate; }
@keyframes indet { from { margin-left: 0; } to { margin-left: 65%; } }

/* ------------------------------------------- definición de materiales */
.fases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
.fase-card { font: inherit; text-align: left; cursor: pointer; background: var(--papel); border: 1px solid var(--linea); border-left: 3px solid var(--linea-fuerte); border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 5px; transition: background .15s, border-color .15s; }
.fase-card:hover { border-color: var(--verde-med); background: #fff; }
.fase-card.activa { border-color: var(--negro); border-left-color: var(--verde); background: #fff; box-shadow: inset 0 0 0 1px var(--negro); }
.fase-nombre { font-weight: 700; font-size: 13px; color: var(--negro); }
.fase-titulo { font-size: 11px; color: var(--suave); line-height: 1.35; min-height: 28px; }
.fase-num { font-size: 11px; font-weight: 700; color: var(--verde); }
.fase-detalle { font-size: 11px; color: var(--suave); }

/* ------------------------------------------- planos y opciones */
.planos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.plano-card { border-radius: 2px; padding: 12px; border: 1px solid var(--linea); border-left: 3px solid var(--linea-fuerte); background: var(--papel); display: flex; flex-direction: column; gap: 4px; }
.plano-card.ok { background: #EEF4EF; border-color: #BFD3C4; border-left-color: var(--verde); }
.plano-card.pend { background: #FAF4DF; border-color: var(--ambar-bd); border-left-color: #C29A1E; }
.plano-card.warn { background: #FAECE8; border-color: var(--rojo-bd); border-left-color: #B5402F; }
.plano-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
.plano-e { font-size: 13px; color: var(--negro); font-weight: 600; line-height: 1.4; }
.plano-n { font-size: 11px; color: var(--suave); }

.opciones-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 4px 0 12px; }
.opciones-col { background: var(--hueso); border: 1px solid var(--linea); border-radius: 2px; padding: 10px; }
.opciones-t { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--verde); margin-bottom: 6px; }
.opciones-col ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--texto); line-height: 1.6; }

/* estados */
.e-elegido, .e-obra, .e-en-obra { background: #DCEADF; color: var(--verde-osc); border-color: #B3CDBA; }
.e-en-proceso, .e-comprado { background: #E3E9EB; color: #2B4350; border-color: #C3CFD4; }
.e-aprobado { background: #EBF0D6; color: #4A5C12; border-color: #D2DBA6; }
.e-pendiente, .e-pedir-presupuesto { background: var(--ambar-bg); color: var(--ambar); border-color: var(--ambar-bd); }
.e-pendiente-de-eleccion { background: var(--rojo-bg); color: var(--rojo); border-color: var(--rojo-bd); }
.e-no-procede, .e-sin-estado { background: var(--hueso-2); color: var(--suave); border-color: var(--linea); }
.e-modificado { background: #E8E4EE; color: #4A3F6B; border-color: #CFC8DC; }
.e-sin-estado { background: transparent; }

/* -------------------------------------------------------------- validación */
.val-wrap { display: flex; flex-direction: column; gap: 18px; }
.val-titulo { padding-bottom: 14px; border-bottom: 1px solid var(--linea); }
.val-titulo h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.val-titulo p { margin: 0; color: var(--suave); font-size: 13px; }
.val-card { background: var(--papel); border: 1px solid var(--linea); border-radius: 3px; padding: 20px; }
.val-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--linea); padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.val-head h3 { margin: 0 0 3px; font-size: 16px; font-weight: 700; }
.val-head p { margin: 0; font-size: 12px; color: var(--suave); }
.val-badge { font-size: 11px; font-weight: 600; color: var(--verde-osc); background: var(--verde-claro); border: 1px solid #B3CDBA; border-radius: 2px; padding: 3px 10px; }
.val-aviso { background: var(--ambar-bg); border: 1px solid var(--ambar-bd); border-left: 3px solid #C29A1E; color: #5E460A; border-radius: 2px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; line-height: 1.5; }
.val-aviso.grave { background: var(--rojo-bg); border-color: var(--rojo-bd); border-left-color: #B5402F; color: #6E2016; }
.val-nota { font-size: 12.5px; color: var(--suave); background: var(--hueso); border: 1px solid var(--linea); border-radius: 2px; padding: 8px 12px; margin-bottom: 10px; }
.val-nota .warn { color: var(--ambar); font-weight: 700; }
.val-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.val-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.val-grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 12px; }
.val-field { display: flex; flex-direction: column; gap: 5px; }
.val-field > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
.val-field small { font-size: 11px; color: var(--tenue); }
.val-field.destacado > span { color: var(--verde); }
.val-field.destacado .val-input { background: #EEF4EF; border-color: #B3CDBA; font-weight: 600; }
.val-input { font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--linea-fuerte); border-radius: 3px; background: #fff; color: var(--negro); width: 100%; }
.val-input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(27,94,52,.18); }
.val-input.mini { padding: 4px 6px; font-size: 12px; text-align: right; font-family: ui-monospace, monospace; }
.val-tabla-scroll { overflow: auto; border: 1px solid var(--linea); border-radius: 2px; max-height: 460px; background: #fff; }
.val-tabla-scroll.alto { max-height: 560px; }
.val-tabla { width: 100%; border-collapse: collapse; font-size: 12px; }
.val-tabla th { position: sticky; top: 0; background: var(--hueso-2); text-align: left; padding: 8px 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--suave); border-bottom: 2px solid var(--negro); }
.val-tabla td { padding: 6px 10px; border-bottom: 1px solid var(--hueso-2); }
.val-tabla td.num, .val-tabla th.num { text-align: right; }
.val-tabla tbody tr:hover { background: #F7F5EE; }
.val-acciones { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.detectado-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.detectado-item { background: var(--hueso); border: 1px solid var(--linea); border-left: 3px solid var(--verde); border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 3px; }
.detectado-t { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--verde); }
.detectado-item strong { font-size: 14px; color: var(--negro); line-height: 1.35; }
.detectado-item small { font-size: 11px; color: var(--suave); }

.val-texto { margin-top: 14px; border-top: 1px solid var(--linea); padding-top: 10px; }
.val-texto summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--verde); }
.val-texto summary .warn { color: var(--ambar); }
.val-texto-acciones { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 8px; }
.val-texto-acciones .btn-sec { padding: 6px 12px; font-size: 12px; }
.val-pre { background: var(--negro); color: #E6E4DA; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; padding: 12px; border-radius: 2px; max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }

/* -------------------------------------------------------------- dashboard */
.dash { display: flex; flex-direction: column; gap: 18px; }
.dash-cabecera { background: var(--verde-osc); color: var(--hueso); border-radius: 0; margin: -24px -28px 0; padding: 26px 28px 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #0b2b18; }
.dash-cabecera h1 { margin: 10px 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; color: #fff; }
.dash-cabecera p { margin: 0; color: #C9D6CC; font-size: 14px; }
.dash-chip { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--verde-lima); border-bottom: 1px solid rgba(155,211,174,.45); padding-bottom: 3px; }
.dash-botones { display: flex; gap: 8px; flex-wrap: wrap; }
.dash-cabecera .btn-primario { background: var(--hueso); color: var(--verde-osc); border-color: var(--hueso); }
.dash-cabecera .btn-primario:hover { background: #fff; border-color: #fff; }
.dash-cabecera .btn-sec { color: var(--hueso); border-color: rgba(244,241,232,.55); }
.dash-cabecera .btn-sec:hover { background: var(--hueso); color: var(--verde-osc); border-color: var(--hueso); }
.dash-enlace { font-size: 12px; color: var(--suave); background: var(--papel); border: 1px solid var(--linea); border-radius: 2px; padding: 10px 14px; }
.dash-enlace code { color: var(--verde); }
.dash-avisos { background: var(--ambar-bg); border: 1px solid var(--ambar-bd); border-left: 3px solid #C29A1E; border-radius: 2px; padding: 10px 14px; font-size: 12.5px; color: #5E460A; }
.dash-avisos summary { cursor: pointer; font-weight: 700; }
.dash-avisos ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.6; }

/* ------------------------------------------------------- compartir */
.dash-compartir { background: var(--papel); border: 1px solid var(--linea); border-radius: 2px; padding: 12px 18px; font-size: 13px; }
.dash-compartir > summary { cursor: pointer; font-weight: 700; color: var(--negro); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
.compartir-aviso { background: var(--hueso); border: 1px solid var(--linea); color: var(--texto); border-radius: 2px; padding: 10px 12px; margin-top: 12px; line-height: 1.6; }
.compartir-aviso.ok { background: #EEF4EF; border-color: #BFD3C4; color: var(--verde-osc); }
.compartir-aviso code { background: #fff; border: 1px solid var(--linea); border-radius: 2px; padding: 0 4px; }
.ok-enlace { color: var(--verde); font-weight: 700; margin: 0 0 8px; }
.pasos-mini { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--suave); }
.pasos-mini span { background: #fff; border: 1px solid var(--linea); border-radius: 2px; padding: 6px 9px; }
.compartir-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.compartir-card { background: var(--hueso); border: 1px solid var(--linea); border-radius: 2px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.compartir-card.recomendado { background: #EEF4EF; border-color: #BFD3C4; }
.compartir-t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--negro); }
.compartir-card p { margin: 0; color: var(--suave); line-height: 1.55; }
.compartir-card code { background: #fff; border: 1px solid var(--linea); border-radius: 2px; padding: 0 4px; font-size: 11px; }
.compartir-card .btn-primario, .compartir-card .btn-sec { align-self: flex-start; }
.salida-enlace { display: flex; flex-direction: column; gap: 8px; }
.enlace-area { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; padding: 8px; border: 1px solid var(--linea-fuerte); border-radius: 3px; resize: vertical; background: #fff; }
.salida-enlace .warn, .warn { color: var(--ambar); font-weight: 600; }
.salida-enlace .warn { margin: 0; }

/* -------------------------------------------------------------- pestañas */
.tabs { display: flex; gap: 0; overflow-x: auto; background: var(--hueso); border-bottom: 1px solid var(--linea-fuerte); position: sticky; top: calc(var(--alto-cab) + 3px); z-index: 40; margin: 0 -28px; padding: 0 28px; }
.tab { font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; padding: 13px 16px 11px; border: none; border-bottom: 3px solid transparent; background: transparent; color: var(--suave); }
.tab:hover { color: var(--negro); background: rgba(17,20,17,.04); }
.tab.activa { color: var(--negro); border-bottom-color: var(--verde); }

.dash-cuerpo { display: flex; flex-direction: column; gap: 18px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kpi { background: var(--papel); border: 1px solid var(--linea); border-top: 3px solid var(--linea-fuerte); border-radius: 2px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
.kpi-v { font-size: 24px; font-weight: 700; letter-spacing: -.01em; color: var(--negro); }
