    /* ------------------------------------------------------------ carga de PDF.js */

    var pdfjsCargado = null;
    function cargarScript(src, timeout) {
        return new Promise(function (res, rej) {
            var s = document.createElement('script'), t = null;
            function fin() { if (t) { clearTimeout(t); } s.onload = null; s.onerror = null; }
            t = setTimeout(function () { fin(); if (s.parentNode) { s.parentNode.removeChild(s); } rej(new Error('timeout ' + src)); }, timeout || 15000);
            s.onload = function () { fin(); res(); };
            s.onerror = function () { fin(); if (s.parentNode) { s.parentNode.removeChild(s); } rej(new Error('error de red ' + src)); };
            s.src = src;
            document.head.appendChild(s);
        });
    }

    async function asegurarPdfJs() {
        if (pdfjsCargado) { return pdfjsCargado; }
        if (window.pdfjsLib) {
            if (window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }
            pdfjsCargado = window.pdfjsLib;
            state.usaPdfJs = true;
            return pdfjsCargado;
        }
        var urls = [
            ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'],
            ['https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js'],
            ['https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.min.js', 'https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.worker.min.js']
        ];
        for (var i = 0; i < urls.length; i++) {
            try {
                await cargarScript(urls[i][0], 15000);
                if (window.pdfjsLib) {
                    if (window.pdfjsLib.GlobalWorkerOptions) { window.pdfjsLib.GlobalWorkerOptions.workerSrc = urls[i][1]; }
                    pdfjsCargado = window.pdfjsLib;
                    state.usaPdfJs = true;
                    return pdfjsCargado;
                }
            } catch (e) { /* siguiente CDN */ }
        }
        state.usaPdfJs = false;
        return null;
    }

    /** Lee un PDF y devuelve las lineas de texto ya reconstruidas por el motor. */
    async function leerPdf(file, selPaginas) {
        var lib = await asegurarPdfJs();
        if (!lib) {
            throw new Error('No se ha podido cargar el lector de PDF (sin conexión a internet). ' +
                'Abre el PDF, copia el texto y pégalo en el área de texto de esa casilla.');
        }
        var buffer = await file.arrayBuffer();
        var pdf = await lib.getDocument({ data: buffer }).promise;
        var crudos = [];
        var paginas = [];
        var listaPag = [];
        if (typeof selPaginas === 'function') { listaPag = selPaginas(pdf.numPages) || []; }
        else { for (var pp = 1; pp <= pdf.numPages; pp++) { listaPag.push(pp); } }
        for (var pi = 0; pi < listaPag.length; pi++) {
            var p = listaPag[pi];
            var page = await pdf.getPage(p);
            var cont = await page.getTextContent();
            var items = [];
            for (var i = 0; i < cont.items.length; i++) {
                var it = cont.items[i];
                if (!it.str || !it.transform) { continue; }
                items.push([it.transform[4], it.transform[5], it.str]);
                crudos.push({ p: p, x: it.transform[4], y: it.transform[5], w: it.width || 0, s: it.str });
            }
            var rows = DX.rowsFromItems(items);
            var lineasPag = [];
            for (var r = 0; r < rows.length; r++) {
                var t = DX.analyseRow(rows[r]).text;
                if (!t) { continue; }
                lineasPag.push({ pagina: p, texto: t, items: rows[r] });
            }
            paginas.push(lineasPag);
        }
        var planas = [];
        for (var q = 0; q < paginas.length; q++) { planas = planas.concat(paginas[q]); }
        return { lineas: planas, numPaginas: pdf.numPages, items: planas, crudos: crudos };
    }

    /* ---- Presupuesto: el resumen por capítulos está SIEMPRE en las últimas páginas del PDF ----
       Se leen solo la primera página (cabecera) y las tres últimas. Si el resumen no cuadra
       con su propio total, devuelve null y se lee el documento entero como antes. */
    function presupuestoDesdeUltimas(lectura) {
        var n = (lectura && lectura.numPaginas) || 0;
        if (!n || !lectura.lineas || !lectura.lineas.length) { return null; }
        var ult = [], prim = [];
        lectura.lineas.forEach(function (l) {
            if (l.pagina >= n - 2) { ult.push(l.texto); }
            else if (l.pagina === 1) { prim.push(l.texto); }
        });
        if (!ult.length) { return null; }
        var r = parsearCon('presupuesto', ult, { origen: 'PDF', numPaginas: n });
        if (!r.capitulos || !r.capitulos.length) { return null; }
        var T = r.totales || {};
        var suma = 0;
        r.capitulos.forEach(function (c) { suma += c.importeSinIva; });
        if (T.pem === null || T.pem === undefined || T.ivaPct === null || T.ivaPct === undefined) { return null; }
        if (Math.abs(suma - T.pem) > Math.max(0.05, T.pem * 0.0001)) { return null; }
        if (T.ivaImporte === null || T.ivaImporte === undefined) { T.ivaImporte = +(T.pem * T.ivaPct / 100).toFixed(2); }
        if (T.total === null || T.total === undefined) { T.total = +(T.pem + T.ivaImporte).toFixed(2); }
        if (prim.length) {
            var r1 = DX.parseBudget(prim, {});
            ['cliente', 'expediente', 'proyecto', 'fecha'].forEach(function (k) {
                if (r1.ident && r1.ident[k]) { r.ident[k] = r1.ident[k]; }
            });
        }
        r.sumaCapitulos = +suma.toFixed(2);
        r.lecturaUltimasPaginas = true;
        r._lineas = prim.concat(ult);
        return r;
    }

    /* ---- Tabla "DETALLE OBRA EJECUTADA" y cuadro resumen de la ficha (por coordenadas) ---- */
    function leerDetalleFicha(crudos) {
        var out = { detalle: [], totales: null, resumen: {} };
        var RE_NUM = /^-?\d{1,3}(?:\.\d{3})*,\d{2}\s*€?$/;
        var toNum = function (t) { return parseFloat(String(t).replace(/[€\s]/g, '').replace(/\./g, '').replace(',', '.')); };
        var normT = function (t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); };
        var esNum = function (c) { return RE_NUM.test(String(c.s).trim()); };
        var cx = function (c) { return c.x + (c.w || 0) / 2; };
        var unir = function (lista) {
            lista = lista.slice().sort(function (a, b) { return a.x - b.x; });
            var t = '', fin = null;
            lista.forEach(function (c) { if (fin !== null && c.x - fin > 1.5) { t += ' '; } t += c.s; fin = c.x + (c.w || 0); });
            return t.replace(/\s+/g, ' ').trim();
        };
        var paginas = {};
        (crudos || []).forEach(function (c) { if (c.s && String(c.s).trim()) { (paginas[c.p] = paginas[c.p] || []).push(c); } });
        Object.keys(paginas).forEach(function (pk) {
            var its = paginas[pk];

            /* ---------- detalle de obra ejecutada ---------- */
            if (!out.detalle.length) {
                var hMes = null, hPar = null;
                its.filter(function (c) { return normT(c.s) === 'mes'; }).forEach(function (m) {
                    if (hMes) { return; }
                    var p = its.filter(function (c) { return normT(c.s) === 'partida' && Math.abs(c.y - m.y) < 4 && c.x < m.x; })[0];
                    if (p) { hMes = m; hPar = p; }
                });
                if (hMes) {
                    var cMes = cx(hMes);
                    var candOri = its.filter(function (c) { return normT(c.s) === 'origen' && Math.abs(c.y - hMes.y) < 4 && c.x > hMes.x; })
                        .sort(function (a, b) { return (Math.abs(a.y - hMes.y) - Math.abs(b.y - hMes.y)) || (a.x - b.x); });
                    var hOri = candOri[0] || null;
                    var cOri = hOri ? cx(hOri) : cMes + 34;
                    var candAnt = its.filter(function (c) { var n = normT(c.s); return (n === 'origen' || n === 'anterior' || n === 'origen anterior') && c.x > (hOri ? hOri.x : cOri) + 20 && Math.abs(c.y - hMes.y) < 12; })
                        .sort(function (a, b) { return a.x - b.x; });
                    var cAnt = candAnt[0] ? cx(candAnt[0]) : cOri + (cOri - cMes);
                    var b1 = (cMes + cOri) / 2, b2 = (cOri + cAnt) / 2;
                    var xName = hPar.x - 45;
                    var debajo = its.filter(function (c) { return c.y < hMes.y - 4; });
                    var nombres = debajo.filter(function (c) { return !esNum(c) && c.x >= xName && c.x < hMes.x - 5; });
                    var numeros = debajo.filter(function (c) { return esNum(c) && c.x >= hMes.x - 30 && cx(c) < cAnt + 30; });
                    var filas = [];
                    nombres.concat(numeros).sort(function (a, b) { return b.y - a.y; }).forEach(function (c) {
                        var f = filas.filter(function (r) { return Math.abs(r.y - c.y) <= 3; })[0];
                        if (!f) { f = { y: c.y, noms: [], nums: [] }; filas.push(f); }
                        (esNum(c) ? f.nums : f.noms).push(c);
                    });
                    filas.sort(function (a, b) { return b.y - a.y; });
                    for (var r = 0; r < filas.length; r++) {
                        var f = filas[r];
                        var nom = unir(f.noms);
                        var v = { mes: null, origen: null, anterior: null };
                        f.nums.forEach(function (c) { var m = cx(c); var k = m < b1 ? 'mes' : (m < b2 ? 'origen' : 'anterior'); v[k] = toNum(c.s); });
                        if (!nom) { if (f.nums.length) { out.totales = v; } break; }
                        out.detalle.push({ nombre: nom, mes: v.mes, origen: v.origen, anterior: v.anterior });
                    }
                }
            }

            /* ---------- cuadro resumen (base / IVA / total) ---------- */
            var defs = [
                ['facturasEmitidas', /^facturas emitidas/], ['anticipoInicial', /^anticipo inicial/], ['descontado', /^descontado/],
                ['anticipoPendiente', /^pendiente\s*:/], ['presupuesto', /^presupuesto obra/],
                ['pendienteCertificar', /^pendiente de certificar/], ['pendienteFacturar', /^pendiente de facturar/]
            ];
            var izq = its.filter(function (c) { return c.x < 500; }).sort(function (a, b) { return b.y - a.y; });
            var grupos = [];
            izq.forEach(function (c) {
                var g = grupos.filter(function (q) { return Math.abs(q.y - c.y) <= 2.5; })[0];
                if (!g) { g = { y: c.y, it: [] }; grupos.push(g); }
                g.it.push(c);
            });
            grupos.forEach(function (g) {
                var etq = normT(unir(g.it.filter(function (c) { return !esNum(c) && c.x < 200; })));
                var nums = g.it.filter(esNum).sort(function (a, b) { return a.x - b.x; });
                if (!etq || !nums.length) { return; }
                defs.forEach(function (d) {
                    if (!out.resumen[d[0]] && d[1].test(etq)) {
                        out.resumen[d[0]] = { base: toNum(nums[0].s), iva: nums[1] ? toNum(nums[1].s) : null, total: nums[2] ? toNum(nums[2].s) : null };
                    }
                });
            });
        });
        return out;
    }

    /* ---- Pie de la factura (Base, % IVA, Cuota IVA ... TOTAL FACTURA), leído por coordenadas ---- */
    function leerPieFactura(crudos) {
        var ETQ = [
            ['base', ['base', 'baseimponible']], ['ivaPct', ['%iva']], ['iva', ['cuotaiva']],
            ['pctRE', ['%re']], ['cuotaRE', ['cuotare']], ['suplidos', ['cuotasuplidos', 'suplidos']],
            ['irpf', ['irpf']], ['pctIRPF', ['%irpf']], ['baseRT', ['basert']], ['pctRT', ['%rt']],
            ['retGat', ['retgat']], ['total', ['totalfactura']]
        ];
        var norm = function (t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').replace(/\./g, ''); };
        var RE_NUM = /^-?\d{1,3}(?:\.\d{3})*,\d{1,2}\s*€?$|^-?\d+,\d{1,2}\s*€?$/;
        var toNum = function (t) { return parseFloat(String(t).replace(/[€\s]/g, '').replace(/\./g, '').replace(',', '.')); };
        var paginas = {};
        (crudos || []).forEach(function (c) { if (c.s && String(c.s).trim()) { (paginas[c.p] = paginas[c.p] || []).push(c); } });
        var claves = Object.keys(paginas).map(Number).sort(function (a, b) { return b - a; });
        for (var pi = 0; pi < claves.length; pi++) {
            var its = paginas[claves[pi]];
            var cands = its.filter(function (c) { var n = norm(c.s); return n === 'base' || n === 'baseimponible'; })
                .sort(function (a, b) { return a.y - b.y; });
            for (var ci = 0; ci < cands.length; ci++) {
                var h = cands[ci];
                var fila = its.filter(function (c) { return Math.abs(c.y - h.y) <= 6; }).sort(function (a, b) { return a.x - b.x; });
                var cols = [], usados = {}, i = 0;
                while (i < fila.length) {
                    var hallado = false;
                    for (var n = 4; n >= 1 && !hallado; n--) {
                        if (i + n > fila.length) { continue; }
                        var junto = fila.slice(i, i + n).map(function (c) { return norm(c.s); }).join('');
                        for (var e = 0; e < ETQ.length; e++) {
                            if (!usados[ETQ[e][0]] && ETQ[e][1].indexOf(junto) >= 0) {
                                var g = fila.slice(i, i + n), ult = g[g.length - 1];
                                cols.push({ k: ETQ[e][0], x0: g[0].x, x1: ult.x + (ult.w || 0) });
                                usados[ETQ[e][0]] = true; hallado = true; i += n; break;
                            }
                        }
                    }
                    if (!hallado) { i++; }
                }
                if (cols.length < 4 || !usados.base || !(usados.total || usados.iva)) { continue; }
                var minX = Math.min.apply(null, cols.map(function (c) { return c.x0; })) - 40;
                var maxX = Math.max.apply(null, cols.map(function (c) { return c.x1; })) + 40;
                var numericos = its.filter(function (c) {
                    return RE_NUM.test(String(c.s).trim()) && c.y < h.y - 0.5 && h.y - c.y < 70 && c.x + (c.w || 0) >= minX && c.x <= maxX;
                });
                if (!numericos.length) { continue; }
                var rowY = Math.max.apply(null, numericos.map(function (c) { return c.y; }));
                var banda = numericos.filter(function (c) { return Math.abs(c.y - rowY) <= 16; });
                var valores = {}, dist = {};
                banda.forEach(function (c) {
                    var ic = c.x + (c.w || 0) / 2, ir = c.x + (c.w || 0), mejor = null, dm = 1e9;
                    cols.forEach(function (col) {
                        var d = Math.min(Math.abs(ic - (col.x0 + col.x1) / 2), Math.abs(ir - col.x1));
                        if (d < dm) { dm = d; mejor = col.k; }
                    });
                    if (mejor && dm <= 40 && (dist[mejor] === undefined || dm < dist[mejor])) { dist[mejor] = dm; valores[mejor] = toNum(c.s); }
                });
                return { valores: valores, columnas: cols.length };
            }
        }
        return null;
    }

    function aplicarPieFactura(res, crudos) {
        res.avisos = res.avisos || [];
        res.pie = res.pie || {};
        var o = leerPieFactura(crudos);
        if (!o) {
            res.avisos.push('No se ha encontrado el pie de la factura (Base, % IVA, Cuota IVA … TOTAL FACTURA). Revisa los importes a mano.');
            return;
        }
        var v = o.valores;
        ['pctRE', 'cuotaRE', 'suplidos', 'irpf', 'pctIRPF', 'pctRT', 'retGat'].forEach(function (k) {
            res.pie[k] = (v[k] !== undefined && !isNaN(v[k])) ? v[k] : null;
        });
        if (v.total != null && v.base != null && v.iva != null) {
            var extra = (v.cuotaRE || 0) + (v.suplidos || 0) - (v.irpf || 0) - (v.retGat || 0);
            var cuadra = Math.abs(v.base + v.iva - v.total) <= 0.05 || Math.abs(v.base + v.iva + extra - v.total) <= 0.05;
            if (cuadra) {
                res.totales.base = v.base; res.totales.iva = v.iva; res.totales.total = v.total;
                if (v.ivaPct != null) { res.totales.ivaPct = v.ivaPct; }
            } else {
                res.avisos.push('El pie de la factura no cuadra (Base + IVA ≠ Total factura). Revisa los importes.');
            }
        } else if (v.total == null) {
            res.avisos.push('No se ha podido leer el TOTAL FACTURA del pie. Revisa el importe a mano.');
        }
    }

    /* ---- Relación de facturas emitidas (tabla de la ficha), leída por coordenadas ---- */
    function leerFacturasFicha(crudos) {
        var RE_NUM = /^-?\d{1,3}(?:\.\d{3})*,\d{2}\s*€?$/;
        var RE_PCT = /^\d+(?:,\d+)?\s*%$/;
        var toNum = function (t) { return parseFloat(String(t).replace(/[€\s]/g, '').replace(/\./g, '').replace(',', '.')); };
        var normT = function (t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); };
        var esNum = function (c) { return RE_NUM.test(String(c.s).trim()); };
        var esPct = function (c) { return RE_PCT.test(String(c.s).trim()); };
        var cx = function (c) { return c.x + (c.w || 0) / 2; };
        var unir = function (lista) {
            lista = lista.slice().sort(function (a, b) { return a.x - b.x; });
            var t = '', fin = null;
            lista.forEach(function (c) { if (fin !== null && c.x - fin > 1.5) { t += ' '; } t += c.s; fin = c.x + (c.w || 0); });
            return t.replace(/\s+/g, ' ').trim();
        };
        var paginas = {};
        (crudos || []).forEach(function (c) { if (c.s && String(c.s).trim()) { (paginas[c.p] = paginas[c.p] || []).push(c); } });
        var salida = [];
        Object.keys(paginas).forEach(function (pk) {
            if (salida.length) { return; }
            var its = paginas[pk];
            var hFac = null, hCon = null;
            its.filter(function (c) { return normT(c.s) === 'factura'; }).forEach(function (f) {
                if (hFac) { return; }
                var cc = its.filter(function (c) { return normT(c.s) === 'concepto' && Math.abs(c.y - f.y) < 4; })[0];
                if (cc) { hFac = f; hCon = cc; }
            });
            if (!hFac) { return; }
            var hy = hFac.y;
            var cab = function (nombre, cond) {
                return its.filter(function (c) { return Math.abs(c.y - hy) < 4 && normT(c.s) === nombre && (!cond || cond(c)); })[0] || null;
            };
            var hBase = cab('base'), hIva = cab('iva'), hTot = cab('total');
            if (!hBase || !hIva || !hTot) { return; }
            var hOri = cab('origen', function (c) { return c.x < hBase.x; });
            var hAnt = cab('origen anterior', function (c) { return c.x < hBase.x; });
            var hImp = cab('importe', function (c) { return c.x > hTot.x; });
            var hForma = its.filter(function (c) { return /^forma/.test(normT(c.s)) && Math.abs(c.y - hy) < 10 && c.x > hTot.x; })[0] || null;
            var hFecP = hImp ? (its.filter(function (c) { return normT(c.s) === 'fecha' && Math.abs(c.y - hy) < 4 && c.x > hImp.x; })[0] || null) : null;
            var cols = [];
            if (hOri) { cols.push({ k: 'origen', c: cx(hOri) }); }
            if (hAnt) { cols.push({ k: 'anterior', c: cx(hAnt) }); }
            cols.push({ k: 'base', c: cx(hBase) }, { k: 'iva', c: cx(hIva) }, { k: 'total', c: cx(hTot) });
            if (hImp) { cols.push({ k: 'cobrado', c: cx(hImp) }); }
            var columnaDe = function (c) {
                var m = cx(c), mejor = null, d = 1e9;
                cols.forEach(function (q) { var dd = Math.abs(q.c - m); if (dd < d) { d = dd; mejor = q.k; } });
                return mejor;
            };
            var izq = its.filter(function (c) { return c.x < 526 && c.y < hy - 4; }).sort(function (a, b) { return b.y - a.y; });
            var grupos = [];
            izq.forEach(function (c) {
                var g = grupos.filter(function (q) { return Math.abs(q.y - c.y) <= 3; })[0];
                if (!g) { g = { y: c.y, it: [] }; grupos.push(g); }
                g.it.push(c);
            });
            grupos.sort(function (a, b) { return b.y - a.y; });
            var empezado = false;
            for (var gi = 0; gi < grupos.length; gi++) {
                var g = grupos[gi];
                var cod = g.it.filter(function (c) { return /^\d{1,3}-\d{1,4}$/.test(String(c.s).trim()) && c.x > hFac.x - 20 && c.x < hCon.x - 5; })[0];
                if (!cod) { if (empezado) { break; } continue; }
                empezado = true;
                var f = { factura: String(cod.s).trim(), fecha: '', concepto: '', origen: null, origenTxt: '', base: null, iva: null, total: null, forma: '', cobrado: null, fechaPago: '' };

    /* ---- Contrato: cláusula 3.1 «Plazos de ejecución de obra» ---- */
    /** Hitos de la cláusula 3 (tabla «Hito · Plazo desde firma · Qué debe estar definido») y penalización. */
    function extraerHitosContrato(lineas) {

            if (vistos[n] || !(pn > 0)) { continue; }
            vistos[n] = true;
            var items = String(m[4] || '').split(/[•·●▪■]/).map(function (s) { return s.trim().replace(/[;,.]+$/, '').trim(); }).filter(function (s) { return s.length > 1; });
            out.hitos.push({ n: n, plazoN: pn, unidad: sem ? 'semanas' : 'dias', dias: sem ? pn * 7 : pn,
                plazoTxt: pn + ' ' + String(m[3]).toLowerCase().replace(/^dias/, 'días').replace(/^dia\b/, 'día'), definir: items });
        }

        if (pm) { out.penalizacionDesdeSemanas = parseInt(pm[1], 10); }
        out.ampliaPlazo = /ampliar[aá]\s+autom[aá]ticamente/i.test(t);

    function parsearContrato(lineas, opts) {

        var texto = ls.join(' ');

            r.avisos.push('El PDF del contrato no tiene texto legible (probablemente está escaneado). Los plazos de definición de materiales hay que introducirlos a mano, si el contrato los fija.');
            return r;

        } else {

        }

        if (ini3 >= 0) {

                if (k > ini3 && RE4.test(ls[k])) { break; }

            }

    }

    async function ocrPagina(pdf, worker, p) {

        var meses = '(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)';
        var m = tx.match(new RegExp('\\ben\\s+[a-z ]{3,25},?\\s*a\\s+(\\d{1,2})\\s*(?:de\\s+)?' + meses + '\\s*(?:de|del)?\\s*(20\\d{2})'));
        if (!m) { m = tx.match(new RegExp('(\\d{1,2})\\s*(?:de\\s+)?' + meses + '\\s*(?:de|del)?\\s*(20\\d{2})')); }
        if (m && +m[1] >= 1 && +m[1] <= 31) { return { iso: m[3] + '-' + p2(MES[m[2]]) + '-' + p2(+m[1]), origen: 'texto del contrato' }; }
        var txAll = (lineas || []).join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var m2 = txAll.match(new RegExp('\\b[a-z]{3,20},\\s*a\\s+(\\d{1,2})\\s+de\\s+' + meses + '\\s+de\\s+(2\\.?0\\d{2})\\b'));
        if (m2 && +m2[1] >= 1 && +m2[1] <= 31) { return { iso: m2[3].replace('.', '') + '-' + p2(MES[m2[2]]) + '-' + p2(+m2[1]), origen: 'texto del contrato (fecha de firma)' }; }
        var f = String(nombre || '').match(/(20\d{2})[-_.](\d{2})[-_.](\d{2})/);
        if (f && +f[2] >= 1 && +f[2] <= 12 && +f[3] >= 1 && +f[3] <= 31) { return { iso: f[1] + '-' + f[2] + '-' + f[3], origen: 'nombre del archivo' }; }
        return null;
    }

    async function leerContrato(file, lectura) {
        var porPag = {};
        lectura.lineas.forEach(function (l) { (porPag[l.pagina] = porPag[l.pagina] || []).push(l.texto); });
        var n = lectura.numPaginas || 0, tope = Math.min(n, 16);
        function esImagen(p) {
            var t = (porPag[p] || []).join(' ').replace(/zapsign/ig, '').replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/ig, '');
            return t.replace(/\s+/g, '').length < 60;
        }
        var compuesto = [], usoOcr = false, errOcr = '', worker = null, pdf = null, p, q;
        try {
            for (p = 1; p <= n; p++) {
                var lp = porPag[p] || [];
                if (p <= tope && !errOcr && esImagen(p)) {
                    try {
                        if (!worker) {
                            state.ocrMsg = 'Cargando el lector de texto en imágenes (OCR)… la primera vez tarda unos segundos.';
                            render();
                            var T = await asegurarTesseract();
                            if (!T) { throw new Error('no se ha podido cargar el OCR (¿sin conexión a internet?)'); }
                            worker = await T.createWorker('spa');
                            var lib = await asegurarPdfJs();
                            pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
                        }
                        state.ocrMsg = 'Leyendo el contrato por OCR · página ' + p + ' de ' + tope + '…';
                        render();
                        lp = await ocrPagina(pdf, worker, p);
                        usoOcr = true;
                    } catch (eo) { errOcr = (eo && eo.message) || String(eo); }
                }
                compuesto = compuesto.concat(lp);
                if (usoOcr && clausula3Completa(compuesto)) {
                    for (q = p + 1; q <= n; q++) { compuesto = compuesto.concat(porPag[q] || []); }
                    break;
                }
            }
        } finally {
            if (worker) { try { await worker.terminate(); } catch (et) { /* nada */ } }
            state.ocrMsg = '';
        }
        var res = parsearContrato(compuesto, { ocr: usoOcr });
        res.origen = usoOcr ? 'PDF + OCR' : 'PDF';
        res.numPaginas = n;
        res._lineas = compuesto;
        var fcon = fechaContratoISO(compuesto, file && file.name);
        if (fcon) { res.fechaFirma = fcon.iso; res.fechaFirmaOrigen = fcon.origen; }
        if (usoOcr) { res.avisos.unshift('Texto leído por reconocimiento óptico (OCR): comprueba cifras y plazos con el texto de abajo y con el propio contrato.'); }
        if (errOcr) { res.avisos.push('No se pudo completar la lectura por OCR: ' + errOcr + '. Los plazos hay que introducirlos a mano.'); }
        return res;
    }

    /* ---- Carga múltiple: reparto automático de archivos en sus casillas ---- */
    function zonaPorNombre(nombre) {
        var n = String(nombre || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var esHoja = /\.(xlsx|xls|csv)$/.test(n);
        if (/contrato/.test(n)) { return esHoja ? null : 'contrato'; }
        if (/seguimiento|ficha/.test(n)) { return 'pdf3'; }
        if (esHoja) { return 'excel5'; }
        if (/factura|(^|[^a-z])fra([^a-z]|$)/.test(n)) { return 'pdf4'; }
        if (/certificacion|certif/.test(n)) { return 'pdf1'; }
        if (/presupuesto|presu/.test(n)) { return 'pdf2'; }
        return null;
    }

    async function zonaPorTexto(file) {
        var lib = await asegurarPdfJs();
        if (!lib) { return null; }
        var pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
        var t = '';
        for (var p = 1; p <= Math.min(2, pdf.numPages); p++) {
            var cont = await (await pdf.getPage(p)).getTextContent();
            t += ' ' + cont.items.map(function (it) { return it.str; }).join(' ');
        }
        t = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (/contrato de ejecucion de obra|contrato de obra/.test(t)) { return 'contrato'; }
        if (/seguimiento economico|relacion de facturas emitidas|detalle obra ejecutada/.test(t)) { return 'pdf3'; }
        if (/total factura|factura n/.test(t)) { return 'pdf4'; }
        if (/certificacion/.test(t)) { return 'pdf1'; }
        if (/presupuesto/.test(t)) { return 'pdf2'; }
        return null;
    }

    async function colocarArchivos(lista) {
        state.multiSinAsignar = state.multiSinAsignar || [];
        var colocados = 0;
        state.multiMsg = 'Reconociendo ' + lista.length + ' archivo(s)…';
        state.vista = 'generador';
        render();
        for (var i = 0; i < lista.length; i++) {
            var f = lista[i], z = null;
            try {
                z = zonaPorNombre(f.name);
                if (!z && /\.pdf$/i.test(f.name)) { z = await zonaPorTexto(f); }
            } catch (e) { z = null; }
            if (z && !state.archivos[z]) { state.archivos[z] = f; colocados++; }
            else { state.multiSinAsignar.push({ file: f, motivo: z ? 'esa casilla ya tiene un archivo' : 'no se ha reconocido', sugerida: z || '' }); }
        }
        state.multiMsg = colocados + ' de ' + lista.length + ' archivo(s) colocado(s) automáticamente.';
        state.vista = 'generador';
        render();
    }

    function parsearCon(parser, lineas, opts) {
        opts = opts || {};
        var r;
        if (parser === 'presupuesto') { r = DX.parseBudget(lineas, opts); }
        else if (parser === 'certificacion') { r = DX.parseCertification(lineas, opts); }
        else if (parser === 'seguimiento') { r = DX.parseTracking(lineas, opts); }
        else if (parser === 'factura') { r = DX.parseInvoice(lineas, opts); }
        else if (parser === 'contrato') { r = parsearContrato(lineas, opts); }
        else { r = { tipo: parser, avisos: ['Tipo de documento no reconocido'] }; }
        r.origen = opts.origen || '';
        if (opts.numPaginas) { r.numPaginas = opts.numPaginas; }
        if (opts.hojas) { r.hojas = opts.hojas; }
        return r;
    }

            '<div class="val-texto-acciones"><button class="btn-sec" data-copiar-texto="' + esc(zonaId) + '">Copiar texto</button>' +

            '<pre class="val-pre">' + muestra + (lineas.length > 60 ? '\n… (' + (lineas.length - 60) + ' líneas más)' : '') + '</pre>' +
            '</details>';

                var cuerpoF = '<div class="val-grid-4">' +
                    '<label class="val-field"><span>Nº factura</span>' + inputNum(fident.numero, 'ident.numero', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Fecha</span>' + inputNum(fident.fecha, 'ident.fecha', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Cliente</span>' + inputNum(fident.cliente, 'ident.cliente', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>CIF</span>' + inputNum(fident.cif, 'ident.cif', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Base imponible</span>' + inputNum(ftot.base, 'totales.base', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Tipo de IVA (%)</span>' + inputNum(ftot.ivaPct, 'totales.ivaPct', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Cuota de IVA</span>' + inputNum(ftot.iva, 'totales.iva', 'pdf4') + '</label>' +
                    '<label class="val-field destacado"><span>Total factura (con IVA)</span>' + inputNum(ftot.total, 'totales.total', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>% RE</span>' + inputNum(fpie.pctRE, 'pie.pctRE', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Cuota RE</span>' + inputNum(fpie.cuotaRE, 'pie.cuotaRE', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>Cuota suplidos</span>' + inputNum(fpie.suplidos, 'pie.suplidos', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>IRPF</span>' + inputNum(fpie.irpf, 'pie.irpf', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>% IRPF</span>' + inputNum(fpie.pctIRPF, 'pie.pctIRPF', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>% RT</span>' + inputNum(fpie.pctRT, 'pie.pctRT', 'pdf4') + '</label>' +
                    '<label class="val-field"><span>RET. GAT.</span>' + inputNum(fpie.retGat, 'pie.retGat', 'pdf4') + '</label>' +
                    (fpie.nota ? '<div class="val-nota" style="grid-column:1/-1">Texto legal leído: <strong>' + esc(fpie.nota) + '</strong></div>' : '') +
                    '</div>';
                partes.push(tarjetaCabecera('Factura de la quincena (PDF 4)', 'Datos fiscales de la factura emitida.', cuerpoF, fac, 'pdf4'));
            } catch (err) { partes.push(bloqueFallo('Factura de la quincena (PDF 4)', fac, err)); }
        }

        // ---------- materiales: libro de definición por fases o listado genérico
        var mat = e.excel5;
        if (mat && mat.tipo === 'materiales') {
            try {
                var mitems = mat.items || [];
                var cuerpoM;
                if (mat._esLibroDefinicion) {
                    var resumen = resumenEstados(mitems);
                    var fasesTxt = (mat.fases || []).map(function (f) {
                        return '<span class="chip">' + esc(f.fase) + ': ' + (f.definiciones || []).length + '</span>';
                    }).join(' ');
                    cuerpoM = '<div class="val-nota">Libro de definición reconocido · <strong>' + mitems.length + ' definiciones</strong> en ' +
                        (mat.fases || []).length + ' fases · Hojas: ' + esc((mat.hojas || []).join(', ')) + '</div>' +
                        '<div class="chips">' + fasesTxt + '</div>' +
                        '<div class="chips">' + resumen.map(function (g) {
                            return '<span class="chip-estado ' + claseEstado(g.estado) + '">' + g.n + ' ' + esc(g.estado) + '</span>';
                        }).join('') + '</div>' +
                        '<div class="val-nota">Estas definiciones alimentan las pestañas <strong>Definición de materiales</strong> y ' +
                        '<strong>Datos y resumen de obra</strong>. Se pueden editar después en el dashboard si hiciera falta.</div>';
                } else if (mitems.length) {
                    var fm = '';
                    for (var m2 = 0; m2 < mitems.length; m2++) {
                        var it = mitems[m2];
                        fm += '<tr>' +
                            '<td class="mono">' + esc(it.id) + '</td>' +
                            '<td>' + esc(it.nombre) + '</td>' +
                            '<td>' + esc(it.categoria) + '</td>' +
                            '<td>' + esc(it.cantidad) + '</td>' +
                            '<td>' + esc(it.proveedor) + '</td>' +
                            '<td>' + esc(it.fechaEntrega) + '</td>' +
                            '<td><input type="text" class="val-input mini" data-zona="excel5" data-lista="items" data-idx="' + m2 + '" data-campo="estado" value="' + esc(it.estado) + '"></td>' +
                            '</tr>';
                    }
                    cuerpoM = '<div class="val-nota">Materiales detectados: <strong>' + mitems.length + '</strong> · Hojas leídas: ' +
                        esc((mat._hojas || []).map(function (h) { return h.name; }).join(', ')) + '</div>' +
                        '<div class="val-tabla-scroll alto"><table class="val-tabla"><thead><tr><th>Código</th><th>Material</th><th>Categoría</th><th>Cantidad</th><th>Proveedor</th><th>Entrega</th><th>Estado</th></tr></thead><tbody>' + fm + '</tbody></table></div>';
                } else {
                    cuerpoM = '<div class="val-nota">Hojas leídas: ' +
                        esc((mat._hojas || []).map(function (h) { return h.name + ' (' + h.rows.length + ' filas)'; }).join(', ') || '—') + '</div>' +
                        '<div class="val-aviso">No se han reconocido definiciones. Para el libro de definición se esperan hojas «Fase 1» … «Fase 5» ' +
                        'con las columnas GFH, ELEMENTO, DESCRIPCIÓN, COMENTARIOS, ESTADO y FECHA. Para un listado simple, columnas de ' +
                        'Material, Cantidad, Proveedor, Fecha y Estado.</div>';
                }
                partes.push(tarjetaCabecera('Materiales y definición (Excel 5)', 'Definiciones por fase y/o listado de materiales.', cuerpoM, mat, 'excel5'));
            } catch (err) { partes.push(bloqueFallo('Materiales y definición (Excel 5)', mat, err)); }
        }

        // ---------- plazos de definición de materiales (cláusula 3.1 del contrato)
        var matP = e.excel5;
        if (matP && matP._esLibroDefinicion && (matP.fases || []).length) {
            var pf = state.plazosForm || { firma: '', dias: {} };
            var conA = e.contrato, notaAuto = '';
            if (!pf.auto && conA && ((conA.plazosHitos || []).length || conA.fechaFirma)) {
                var hsA = conA.plazosHitos || [];
                if (!pf.firma && conA.fechaFirma) { pf.firma = conA.fechaFirma; }
                if (!pf.dias) { pf.dias = {}; }
                matP.fases.forEach(function (f, ix) { var nF = numFase(f.fase, ix + 1); var hA = hsA[nF - 1]; if (!pf.dias[f.fase] && hA) { pf.dias[f.fase] = hA.dias; } });
                pf.auto = true; state.plazosForm = pf;
            }
            if (conA && (pf.auto || conA.fechaFirma)) {
                notaAuto = '<div class="val-nota"><strong>Rellenado desde el contrato:</strong> fecha de firma ' + esc(conA.fechaFirma ? conA.fechaFirma.split('-').reverse().join('/') : 'no detectada') +
                    (conA.fechaFirmaOrigen ? ' (leída del ' + esc(conA.fechaFirmaOrigen) + ')' : '') +
                    ' y los plazos de cada hito, asignados por número: hito 1 a la Fase 1, hito 2 a la Fase 2, hito 3 a la Fase 3 y hito 4 a la Fase 4. Las fases sin hito (por ejemplo la Fase 5) quedan sin plazo. Compruébalo y corrígelo si hace falta.</div>';
            }
            var filasP = matP.fases.map(function (f) {
                var tit = (f.titulo || '').replace(/^FASE\s*\d+\s*-?\s*/i, '').slice(0, 50);
                return '<label class="plazo-fila"><span>' + esc(f.fase) + (tit ? ' · ' + esc(tit) : '') + '</span>' +
                    '<input type="number" min="1" step="1" class="val-input mini val-plazo" data-fase="' + esc(f.fase) + '" value="' +
                    esc((pf.dias && pf.dias[f.fase]) || '') + '" placeholder="días"></label>';
            }).join('');
            partes.push('<section class="val-card"><header class="val-head"><div><h3>Plazos de definición de materiales (contrato)</h3>' +
                '<p>Cláusula 3.1, «Plazos de ejecución de obra». Si el contrato no fija plazos de selección por fase, deja todo vacío y el dashboard no mostrará barras de plazo.</p></div>' +
                '<span class="val-badge">opcional</span></header>' +
                '<div class="plazo-form"><label class="plazo-fila"><span>Fecha de firma del contrato</span>' +
                '<input type="date" id="val-plazo-firma" class="val-input" value="' + esc(pf.firma || '') + '"></label>' + filasP + '</div>' +
                notaAuto + '<div id="val-cal-hitos">' + calendarioHitosHtml() + '</div><div class="val-nota">Días naturales contados desde la firma (1 semana = 7 días). Sin fecha de firma no se muestran las barras.</div></section>');
        }

        // ---------- contrato (cláusula 3.1)
        var con = e.contrato;
        if (con) {
            var cuerpoCo = '';
            if (con.hayClausula31) {
                var hit = con.plazosHitos || [];
                cuerpoCo = '<div class="val-nota"><strong>Cláusula 3.1 tal como se ha leído</strong>' +
                    (con.semanasTotal ? ' · plazo total de ejecución: ' + con.semanasTotal + ' semanas' : '') + '</div>' +
                    '<pre class="val-pre">' + con.clausula31.map(function (l) { return esc(l); }).join('\n') + '</pre>' +
                    ((con.clausula3 && con.clausula3.length > con.clausula31.length)
                        ? '<details class="val-texto"><summary>Ver la cláusula 3 completa (' + con.clausula3.length + ' líneas)</summary><pre class="val-pre">' +
                          con.clausula3.map(function (l) { return esc(l); }).join('\n') + '</pre></details>' : '') +
                    (hit.length
                        ? '<div class="val-nota"><strong>Plazos detectados en la cláusula 3 (a revisar):</strong> ' +
                          hit.map(function (h, i) { return 'Hito ' + (i + 1) + ': ' + h.dias + ' días' + (h.unidad === 'semanas' ? ' (' + h.n + ' semanas)' : ''); }).join(' · ') + '</div>' +
                          '<div class="val-texto-acciones"><button class="btn-sec" id="btn-plazos-contrato">Rellenar cada fase con su hito (hito N → Fase N)</button>' +
                          '<span class="nota-pie">Hito 1 → Fase 1, hito 2 → Fase 2, hito 3 → Fase 3, hito 4 → Fase 4; la fase sin hito queda vacía. Escribe la fecha de firma antes de confirmar.</span></div>'
                        : '') +
                    ((con.hitos || []).length ? '<div class="val-nota"><strong>Hitos de la cláusula 3.1 detectados:</strong> ' + con.hitos.map(function (h) { return 'Hito ' + h.n + ': ' + esc(h.plazoTxt) + ' (' + (h.definir || []).length + ' conceptos)'; }).join(' · ') + '. Se mostrarán en el resumen ejecutivo.</div>' : '') +
                    '<div class="plazo-form"><label class="plazo-fila"><span>Fecha de firma del contrato</span><input type="date" id="val-contrato-firma" class="val-input" value="' + esc(state.contratoFirma || (state.plazosForm && state.plazosForm.firma) || con.fechaFirma || '') + '"></label></div>' +
                    '<div class="val-nota">' + (con.mencionaMateriales
                        ? 'La cláusula menciona selección o definición de materiales. Si fija plazos por fase, introdúcelos en la tarjeta «Plazos de definición de materiales».'
                        : 'La cláusula no menciona plazos de selección de materiales: no se mostrarán barras de plazo, salvo que los introduzcas a mano.') + '</div>';
            } else {
                cuerpoCo = '<div class="val-nota">No hay plazos de definición de materiales leídos del contrato. Si el contrato los fija, introdúcelos a mano en la tarjeta «Plazos de definición de materiales».</div>';
            }
            partes.push(tarjetaCabecera('Contrato de ejecución de obra', 'Cláusula 3.1, «Plazos de ejecución de obra».', cuerpoCo, con, 'contrato'));
        }

        // ---------- zonas con resultado inesperado (documento no reconocido o error)
        ZONAS.forEach(function (z) {
            var r = state.extraido[z.id];
            if (r && (r.tipo !== z.parser || r.origen === 'error')) {
                partes.push(bloqueFallo(z.etiqueta, r, new Error(r.avisos && r.avisos.length ? r.avisos.join(' ') : 'documento no procesado')));
            }
        });

        // ---------- zonas sin documento
        var faltan = [];
        for (var zi = 0; zi < ZONAS.length; zi++) {
            if (!state.archivos[ZONAS[zi].id]) { faltan.push(ZONAS[zi].etiqueta); }
        }
        if (faltan.length) {
            partes.push('<section class="val-card"><div class="val-nota">Sin documento en: <strong>' + esc(faltan.join(' · ')) +
                '</strong>. Las pestañas que dependen de ellos se marcarán como «no disponible» en lugar de inventar datos.</div></section>');
        }

        // ---------- acciones
        partes.push('<div class="val-acciones">' +
            '<button id="btn-volver-generador" class="btn-sec">← Cambiar archivos</button>' +
            '<button id="btn-confirmar" class="btn-primario">Confirmar y generar dashboard</button>' +
            '</div>');

        return '<div class="val-wrap">' +
            '<div class="val-titulo"><h2>Validación de datos extraídos</h2>' +
            '<p>Revisa y corrige lo que haga falta. Lo que quede vacío se mostrará como «sin identificar» en el dashboard, nunca como 0 €.</p></div>' +
            partes.join('') + '</div>';
    }

    /** Tarjeta de fallo para un documento que no se ha podido procesar. */
    function bloqueFallo(titulo, res, err) {
        var avisos = (res && res.avisos) || [];
        return '<section class="val-card">' +
            '<header class="val-head"><div><h3>' + esc(titulo) + '</h3>' +
            '<p>Este documento no se ha podido procesar. Puedes seguir con el resto o pegar su texto a mano.</p></div>' +
            '<span class="val-badge">error</span></header>' +
            '<div class="val-aviso grave">' + esc((err && err.message) || 'Error desconocido') +
            (avisos.length ? '<br>' + avisos.map(function (a) { return '· ' + esc(a); }).join('<br>') : '') + '</div>' +
            '<div class="val-nota">Solución: abre el PDF, selecciona todo el texto (Ctrl+A, Ctrl+C), vuelve al generador, ' +
            'pulsa <strong>«Pegar texto»</strong> en la casilla correspondiente y pega. Vuelve a procesar.</div>' +
            (panelTexto(res, '') || '') +
            '</section>';
    }

    /* --------------------------------------------------------------- dashboard */

    function datos() { return state.datos || {}; }

    function partidaDePresupuesto(codigo) {
        var d = datos();
        var lista = (d.presupuesto && d.presupuesto.capitulos) || [];
        for (var i = 0; i < lista.length; i++) { if (lista[i].codigo === codigo) { return lista[i]; } }
        return null;
    }

    function certificadoDeCapitulo(codigo) {
        var d = datos();
        var lista = (d.certificacion && d.certificacion.capitulos) || [];
        for (var i = 0; i < lista.length; i++) { if (lista[i].codigo === codigo) { return lista[i]; } }
        return null;
    }

    /** Une presupuesto y certificación capítulo a capítulo. */
    /* ======================================================================
     * DASHBOARD
     * Todo el HTML de las 12 pestanas lo genera el motor compartido DXReport,
     * el mismo que usa el informe exportado. Aqui solo se resuelven los
     * filtros y se aporta el historial.
     * ==================================================================== */

    function contexto() {
        var d = datos();
        return {
            identificador: d.identificador, periodo: d.periodo, generado: d.generado,
            presupuesto: d.presupuesto, certificacion: d.certificacion,
            seguimiento: d.seguimiento, factura: d.factura,
            materiales: d.materiales, obra: d.obra,
            pem: d.pem, cert: d.cert, pct: d.pct,
            historial: state.soloLectura ? [] : state.historial.map(function (h) {
                return { fecha: h.fecha, identificador: h.identificador, pem: h.pem, cert: h.cert, pct: h.pct };
            })
        };
    }

    function tabDelegado(id) {
        return function () {
            try {
                return DXReport.render(contexto(), id, { fase: state.filtroFase, estado: state.filtroEstado });
            } catch (err) {
                return '<div class="bloque"><div class="val-aviso grave">Error al pintar esta pestana: ' +
                    esc(err.message) + '</div></div>';
            }
        };
    }

    var RENDER = {};
    DXReport.PESTANAS.forEach(function (t) { RENDER[t.id] = tabDelegado(t.id); });

    function vistaDashboard() {
        var d = datos();
        var id = state.identificador || 'Obra sin identificar';
        var publicada = (typeof location !== 'undefined') && /^https?:/.test(location.protocol);
        var ro = !!state.soloLectura;

        var avisos = [];
        ['pdf1', 'pdf2', 'pdf3', 'pdf4', 'excel5'].forEach(function (z) {
            var r = state.extraido[z];
            if (r && r.avisos && r.avisos.length) { avisos = avisos.concat(r.avisos); }
        });
        if (!state.usaPdfJs && !state.soloLectura) { avisos.unshift('El lector de PDF no se pudo cargar desde internet: los datos se han tomado del texto pegado a mano.'); }

        var tabs = DXReport.PESTANAS.map(function (t) {
            return '<button class="tab' + (state.pestana === t.id ? ' activa' : '') + '" data-tab="' + t.id + '">' + t.etiqueta + '</button>';
        }).join('');

        return '<div class="dash">' +
            '<div class="dash-cabecera">' +
            '<div><span class="dash-chip">Vista de dirección · solo lectura</span>' +
            '<h1>Informe ejecutivo de quincena</h1>' +
            '<p>' + esc(id) + (state.periodo ? ' · ' + esc(state.periodo) : '') + '</p></div>' +
            (ro ? '<div class="dash-botones"><button class="btn-sec" onclick="window.print()">Imprimir / PDF</button></div></div>' : ('<div class="dash-botones">' +
            '<button id="btn-enlace-largo" class="btn-primario">Generar enlace para el cliente</button>' +
            '<button id="btn-exportar" class="btn-sec">Descargar informe</button>' +
            '<button id="btn-volver-validacion" class="btn-sec">Volver a validación</button>' +
            '<button id="btn-nuevo" class="btn-sec">Empezar de nuevo</button>' +
            '</div></div>' +
            '<details class="dash-compartir"' + (state.abrirCompartir ? ' open' : '') + '>' +
            '<summary>Compartir con el cliente</summary>' +
            '<div class="compartir-grid">' +
            '<div class="compartir-card recomendado">' +
            '<span class="compartir-t">Enlace para el cliente</span>' +
            '<p>Genera un enlace corto que abre este informe en cualquier dispositivo, sin instalar nada ni registrarse.</p>' +
            (publicada ? '' : '<p class="warn">La aplicación está abierta como archivo local. Ábrela desde su dirección web (https://…) para que el enlace funcione en otros equipos.</p>') +
            '<div id="salida-enlace" class="salida-enlace"></div>' +
            '</div>' +
            '<div class="compartir-card">' +
            '<span class="compartir-t">Informe como archivo</span>' +
            '<p>Descarga un único archivo .html con el informe y los datos incluidos. Se abre sin conexión a internet.</p>' +
            '<button class="btn-sec" id="btn-exportar2">Descargar informe</button>' +
            '</div>' +
            '</div></details>')) +
            (avisos.length ? '<details class="dash-avisos"><summary>' + avisos.length + ' aviso(s) de extracción — revisar antes de compartir</summary><ul>' +
                avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></details>' : '') +
            DXReport.menuPestanas(state.pestana) +
            '<div class="dash-cuerpo">' + (RENDER[state.pestana] || RENDER.resumen)() + '</div>' +
            '</div>';
    }

    /* ------------------------------------------------------------- generador */

    function vistaGenerador() {
        var cargados = Object.keys(state.archivos).length;
        var zonas = ZONAS.map(function (z) {
            var f = state.archivos[z.id];
            var txt = state.textos[z.id] || '';
            return '<div class="zona' + (f ? ' con-archivo' : '') + '" data-zona="' + z.id + '">' +
                '<input type="file" id="file-' + z.id + '" accept="' + z.acepta + '" hidden>' +
                '<div class="zona-top"><span class="zona-id">' + esc(z.id.toUpperCase()) + '</span>' +
                (f ? '<button class="zona-quitar" data-quitar="' + z.id + '" title="Quitar">×</button>' : '') + '</div>' +
                '<label class="zona-titulo" for="file-' + z.id + '">' + esc(z.etiqueta) + '</label>' +
                (f
                    ? '<div class="zona-archivo"><span>' + esc(f.name) + '</span><small>' + fmtBytes(f.size) + '</small></div>'
                    : '<div class="zona-vacio">Arrastra el archivo aquí o pulsa para elegirlo</div>') +
                '<div class="zona-pie"><label class="zona-btn" for="file-' + z.id + '">' + (f ? 'Reemplazar' : 'Elegir archivo') + '</label>' +
                '<button class="zona-texto" data-toggle-texto="' + z.id + '">' + (txt ? 'Texto pegado' : 'Pegar texto') + '</button></div>' +
                '<textarea class="zona-area" data-texto="' + z.id + '" placeholder="Si el PDF no se lee bien, abre el documento, copia el texto y pégalo aquí. Tiene prioridad sobre el archivo.">' + esc(txt) + '</textarea>' +
                '</div>';
        }).join('');

        var sinAs = (state.multiSinAsignar || []).map(function (it, k) {
            var ops = '<option value="">Elegir casilla…</option>' + ZONAS.map(function (z) {
                return '<option value="' + z.id + '"' + (z.id === it.sugerida ? ' selected' : '') + '>' + esc(z.etiqueta) + '</option>';
            }).join('');
            return '<div class="multi-fila"><span class="multi-n">' + esc(it.file.name) + '</span><small>' + esc(it.motivo) + '</small>' +
                '<select class="val-input" data-asignar="' + k + '">' + ops + '</select></div>';
        }).join('');
        var multi = '<div class="multi-drop" id="multi-zona">' +
            '<input type="file" id="multi-file" multiple accept=".pdf,.xlsx,.xls,.csv" hidden>' +
            '<div class="multi-t">Carga todos los documentos a la vez</div>' +
            '<p>Arrastra aquí la certificación, el presupuesto, la ficha de seguimiento, la factura, el contrato y el Excel de materiales. Cada archivo se coloca solo en su casilla.</p>' +
            '<label class="zona-btn" for="multi-file">Elegir varios archivos</label>' +
            (state.multiMsg ? '<div class="multi-msg">' + esc(state.multiMsg) + '</div>' : '') +
            (sinAs ? '<div class="multi-sin"><div class="multi-sin-t">Archivos sin casilla asignada</div>' + sinAs + '</div>' : '') +
            '</div>';

        var hist = '';
        if (state.historial.length) {
            hist = '<div class="bloque"><div class="bloque-head"><div><h3>Dashboards generados</h3><p>Se guardan en este navegador (localStorage), sin base de datos externa.</p></div>' +
                '<span class="chip">' + state.historial.length + '</span></div>' +
                tabla(['Fecha', 'Obra', 'Presupuesto', 'Certificado', ''],
                    state.historial.map(function (h) {
                        return [esc(new Date(h.fecha).toLocaleString('es-ES')), esc(h.identificador), fmtMoney(h.pem), fmtMoney(h.cert),
                            '<button class="btn-mini" data-abrir="' + esc(h.slug) + '">Ver dashboard</button>'];
                    }), ['', '', 'num', 'num', '']) + '</div>';
        }

        return '<div class="gen">' +
            '<div class="gen-hero"><h1>Generador de dashboards de obra</h1>' +
            '<p>Carga los documentos de la quincena y pulsa el botón. <strong>La obra y la quincena se detectan solas</strong> ' +
            'a partir de los PDFs y del Excel: no hay que escribir nada.</p></div>' +
            '<div class="gen-card">' +
            '<label class="val-field"><span>Código de obra y periodo (opcional)</span>' +
            '<input type="text" id="gen-identificador" class="val-input" value="' + esc(state.identificador) + '" placeholder="Opcional: se detecta solo a partir de los PDFs y el Excel"></label>' +
            '<label class="val-field"><span>Periodo (quincena)</span>' +
            '<input type="text" id="gen-periodo" class="val-input" value="' + esc(state.periodo) + '" placeholder="Ej. 2ª quincena de septiembre de 2026"></label>' +
            '<div class="gen-cab">' +
            '<span>Documentos de la quincena</span><span class="chip">' + cargados + ' cargados</span></div>' +
            multi +
            '<div class="zonas">' + zonas + '</div>' +
            '<div class="gen-acciones"><button id="btn-generar" class="btn-primario grande">Procesar y validar datos →</button>' +
            '<p class="nota-pie">Los PDF se leen en tu navegador. Nada se sube a ningún servidor.</p></div>' +
            '</div>' + hist + '</div>';
    }

    function vistaProcesando() {
        var pasos = PASOS.map(function (p, i) {
            var estado = state.pasoActual > i ? 'hecho' : (state.pasoActual === i ? 'actual' : '');
            return '<li class="' + estado + '">' + esc(p.etiqueta) + '</li>';
        }).join('');
        return '<div class="gen-card centro"><h2>Extrayendo datos…</h2>' +
            '<div class="barra grande"><div class="barra-i" style="width:' + state.progreso + '%"></div></div>' +
            '<p class="progreso">' + state.progreso + ' %</p>' + (state.ocrMsg ? '<p class="progreso">' + esc(state.ocrMsg) + '</p>' : '') + '<ul class="pasos">' + pasos + '</ul></div>';
    }

    /* -------------------------------------------------------------------- render */

    function render() {
        var root = $('root');
        if (!root) { return; }
        var cuerpo = '';
        if (state.vista === 'generador') { cuerpo = vistaGenerador(); }
        else if (state.vista === 'procesando') { cuerpo = vistaProcesando(); }
        else if (state.vista === 'validacion') { cuerpo = vistaValidacion(); }
        else if (state.vista === 'cargando') { cuerpo = '<div class="gen-card centro"><h2>Abriendo informe…</h2><div class="barra grande"><div class="barra-i indet"></div></div></div>'; }
        else if (state.vista === 'errorEnlace') { cuerpo = '<div class="gen-card centro"><h2>No se ha podido abrir el informe</h2><p class="nota-pie">' + esc(state.errorEnlace || '') + '</p><p class="nota-pie">Solicita un nuevo enlace a quien te lo envió.</p></div>'; }
        else { cuerpo = vistaDashboard(); }

        root.innerHTML =
            '<header class="cabecera"><div class="cabecera-in">' +
            '<div class="marca" id="btn-inicio">' +
            '<div><strong>enue</strong><small>Proyectos y Construcción</small></div></div>' +
            '<span class="cab-estado">' + (state.soloLectura ? 'Informe de obra · solo lectura' : 'Control de certificaciones de obra') + '</span>' +
            '</div></header>' +
            (state.avisoGlobal ? '<div class="aviso-global">' + esc(state.avisoGlobal) + '</div>' : '') +
            '<main class="contenido">' + cuerpo + '</main>' +
            '<footer class="pie"><span>© ' + new Date().getFullYear() + ' ENUE Proyectos y Construcción, S.L.</span>' +
            '<span>' + (state.soloLectura ? 'Informe compartido · solo lectura' : 'Datos guardados en este navegador · sin servidor') + '</span></footer>';

        enlazar();
    }

    /* ------------------------------------------------------------------ eventos */

    function enlazar() {
        var el;

        el = $('btn-inicio');
        if (el) { el.onclick = function () { state.vista = state.datos ? 'dashboard' : 'generador'; render(); }; }

        el = $('gen-identificador');
        if (el) { el.oninput = function (ev) { state.identificador = (ev && ev.target ? ev.target.value : el.value); }; }
        el = $('gen-periodo');
        if (el) { el.oninput = function (ev) { state.periodo = (ev && ev.target ? ev.target.value : el.value); }; }

        // zonas: selector de archivo
        ZONAS.forEach(function (z) {
            var inp = $('file-' + z.id);
            if (inp) {
                inp.onchange = function () {
                    if (inp.files && inp.files[0]) { state.archivos[z.id] = inp.files[0]; state.vista = 'generador'; render(); }

        var mz = $('multi-zona');

        if (!window._dxDropMulti) {

                if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); }
            });
            window.addEventListener('drop', function (e) {
                if (!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)) { return; }
                e.preventDefault();
                if (state.vista !== 'generador') { return; }

        Array.prototype.forEach.call(document.querySelectorAll('[data-asignar]'), function (sel) {

        el = $('btn-generar');
        if (el) { el.onclick = procesar; }

        // validación
        el = $('val-identificador');
        if (el) { el.oninput = function (ev) { state.identificador = (ev && ev.target ? ev.target.value : el.value); state.identificadorManual = true; }; }
        el = $('val-periodo');
        if (el) { el.oninput = function (ev) { state.periodo = (ev && ev.target ? ev.target.value : el.value); state.identificadorManual = true; }; }

        Array.prototype.forEach.call(document.querySelectorAll('#root .val-input[data-zona]'), function (inp) {

        el = $('btn-volver-generador');

                Array.prototype.forEach.call(ins, function (nn, ix) { var nF = numFase(nn.getAttribute('data-fase'), ix + 1); nn.value = hs[nF - 1] ? hs[nF - 1].dias : ''; });
                leerPlazos(); refrescarCalendarioHitos();

        Array.prototype.forEach.call(document.querySelectorAll('[data-estado]'), function (b) {
            b.onclick = function () {

            };

        el = $('btn-volver-validacion');
        if (el) { el.onclick = function () { state.vista = 'validacion'; render(); }; }
        el = $('btn-nuevo');
        if (el) { el.onclick = function () { nuevaQuincena(); }; }
        el = $('btn-compartir');
        if (el) {
            el.onclick = function () {

        el = $('btn-exportar');
        if (el) { el.onclick = exportarInforme; }
        el = $('btn-exportar2');

        el = $('btn-enlace-largo');
        if (el) {
            el.onclick = function () {
                var salida = $('salida-enlace');

                if (salida) { salida.innerHTML = '<p class="nota-pie">Comprimiendo el dashboard…</p>'; }
                generarEnlace(contexto()).then(function (r) {
                    var kb = (r.bytes / 1024).toFixed(1);

                    if (!r.publicada) {

                    } else if (r.corto) {

                    }
                    html += '<textarea class="enlace-area" readonly rows="' + (r.corto ? 2 : 4) + '">' + esc(r.url) + '</textarea>' +
                        '<div class="chips">' +

                        (r.corto ? '' : '<button class="btn-sec" id="btn-copiar-enlace-query">Copiar variante ?d=</button>') +
                        '</div>' +
                        (r.corto
                            ? '<p class="nota-pie">El enlace permanece activo durante 180 días.</p>'
                            : '<p class="nota-pie">Enlace de ' + kb + ' KB' + (r.sinComprimir ? ' (comprimido desde ' + (r.sinComprimir / 1024).toFixed(1) + ' KB)' : '') + '.</p>');
                    if (!r.corto && r.demasiadoLargo) {
                        html += '<p class="warn">El enlace pasa de 8 KB y algunos correos o chats lo cortan. Si ocurre, usa «Descargar informe».</p>';
                    }
                    if (r.publicada) { html += bloqueCorreo(r); }
                    if (salida) { salida.innerHTML = html; }
                    // copia automática cuando la app está publicada
                    if (r.publicada && navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(r.url).then(function () {
                            boton.textContent = 'Enlace copiado al portapapeles';
                            setTimeout(function () { boton.textContent = textoOriginal; boton.disabled = false; }, 3000);
                        }).catch(function () {
                            boton.textContent = textoOriginal; boton.disabled = false;
                        });
                    } else {
                        boton.textContent = textoOriginal; boton.disabled = false;
                    }
                    var bc = $('btn-copiar-enlace-largo');
                    if (bc) {
                        bc.onclick = function () {
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(r.url).then(function () {
                                    bc.textContent = 'Copiado';
                                    setTimeout(function () { bc.textContent = 'Copiar enlace'; }, 2000);
                                });
                            } else { window.prompt('Copia el enlace:', r.url); }

                    var bq = $('btn-copiar-enlace-query');
                    if (bq) {
                        bq.onclick = function () {

                                    bq.textContent = 'Copiado';
                                    setTimeout(function () { bq.textContent = 'Copiar variante ?d='; }, 2000);

                enlazarCorreo(r);
                }).catch(function (err) {

                    if (salida) { salida.innerHTML = '<p class="warn">No se ha podido generar el enlace: ' + esc(err.message) + '</p>'; }

        Array.prototype.forEach.call(document.querySelectorAll('[data-abrir]'), function (b) {
            b.onclick = function () {
                var s = b.getAttribute('data-abrir');
                var h = state.historial.filter(function (x) { return x.slug === s; })[0];
                if (h) { state.datos = h.datos; state.identificador = h.identificador; state.pestana = 'resumen'; state.vista = 'dashboard'; render(); }
            };
        });
    }

    /* --------------------------------------------------- edición de la validación */

    function poner(obj, ruta, valor) {
        var partes = ruta.split('.'), cur = obj;
        for (var i = 0; i < partes.length - 1; i++) { cur = cur[partes[i]]; }
        cur[partes[partes.length - 1]] = valor;
    }

    function aplicarEdicion(inp) {
        var zona = inp.getAttribute('data-zona');
        var campo = inp.getAttribute('data-campo');
        var kpi = inp.getAttribute('data-kpi');
        var lista = inp.getAttribute('data-lista');
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        var res = state.extraido[zona];
        if (!res) { return; }
        var v = inp.value.trim() === '' ? null : num(inp.value);
        if (kpi) {
            if (!res.kpis) { res.kpis = {}; }
            if (!res.kpis[kpi]) { res.kpis[kpi] = { etiqueta: kpi, valor: null, textoFuente: '' }; }
            res.kpis[kpi].valor = v;
            res.kpis[kpi].manual = true;
            return;
        }
        if (lista) {
            if (res[lista] && res[lista][idx]) {
                res[lista][idx][campo] = v;
                if (zona === 'pdf1' && lista === 'capitulos' && campo === 'origen') { res[lista][idx].actual = v; }
            }
            recalcularZona(zona, res);
            return;
        }
        poner(res, campo, v);
        recalcularZona(zona, res);
    }

    function recalcularZona(zona, res) {
        if (zona === 'pdf2' && res.capitulos) {
            var suma = res.capitulos.reduce(function (a, b) { return a + (b.importeSinIva || 0); }, 0);
            res.capitulos.forEach(function (c) {
                c.pesoPresupuesto = res.totales.pem ? (c.importeSinIva / res.totales.pem) * 100 : null;
            });
            res._sumaCapitulos = suma;
        }
        if (zona === 'pdf1' && res.totales) {
            var o = res.totales.origen, p = res.totales.ivaPct;
            if (res.totales.iva === null && o !== null && p !== null) { res.totales.iva = +(o * p / 100).toFixed(3); }
            if (res.totales.total === null && o !== null) { res.totales.total = +(o + (res.totales.iva || 0)).toFixed(3); }
        }
        if (zona === 'pdf4' && res.totales) {
            var b = res.totales.base, pp = res.totales.ivaPct;
            if (res.totales.iva === null && b !== null && pp !== null) { res.totales.iva = +(b * pp / 100).toFixed(2); }
            if (res.totales.total === null && b !== null) { res.totales.total = +(b + (res.totales.iva || 0)).toFixed(2); }
        }
    }

    /* ------------------------------------------------------------- procesamiento */

    async function procesar() {
        state.plazosForm = null;
        // El nombre de la obra y la quincena se deducen de los documentos: no se pide nada.
        if (!Object.keys(state.archivos).length && !Object.keys(state.textos).filter(function (k) { return (state.textos[k] || '').trim(); }).length) {
            alert('Carga al menos un documento o pega su texto.');
            return;
        }
        var zonasConDoc = ZONAS.filter(function (z) { return state.archivos[z.id] || (state.textos[z.id] || '').trim(); });

        try {
            state.vista = 'procesando';
            state.progreso = 4;
            state.pasoActual = 0;
            render();

            var total = Math.max(1, zonasConDoc.length);
            var hechas = 0;

            for (var i = 0; i < zonasConDoc.length; i++) {
                var z = zonasConDoc[i];
                state.pasoActual = Math.min(PASOS.length - 1, Math.floor((hechas / total) * PASOS.length));
                state.progreso = Math.round(6 + (hechas / total) * 86);
                render();
                try {
                    state.extraido[z.id] = await extraerZona(z, state.archivos[z.id] || { name: 'texto pegado' });
                } catch (err) {
                    state.extraido[z.id] = {
                        tipo: z.parser, origen: 'error', capitulos: [], subcapitulos: [], partidas: [], items: [], kpis: {},
                        ident: {}, totales: {},
                        avisos: ['No se ha podido procesar «' + ((state.archivos[z.id] && state.archivos[z.id].name) || z.id) + '»: ' + (err.message || 'error desconocido')]
                    };
                }
                hechas++;
                await new Promise(function (r) { setTimeout(r, 30); });
            }
            state.pasoActual = PASOS.length - 1;
            state.progreso = 100;
            // La obra y la quincena se deducen de los propios documentos: el usuario
            // no tiene que escribir nada. Si ya había escrito algo, se respeta.
            try { deducirIdentificacion(); } catch (err) { state.avisoGlobal = 'Aviso al deducir la obra: ' + err.message; }
        } catch (err) {
            state.avisoGlobal = 'Error inesperado al procesar: ' + (err.message || err);
        } finally {
            render();
            setTimeout(function () { state.vista = 'validacion'; render(); }, 200);
        }
    }

    /** Rellena state.identificador y state.periodo a partir de los documentos. */
    function deducirIdentificacion() {
        var ficheros = {};
        Object.keys(state.archivos).forEach(function (z) { ficheros[z] = state.archivos[z].name; });
        var docs = {
            pdf1: state.extraido.pdf1, pdf2: state.extraido.pdf2, pdf3: state.extraido.pdf3,
            pdf4: state.extraido.pdf4, excel5: state.extraido.excel5, _ficheros: ficheros
        };
        var resumenObra = (state.extraido.excel5 && state.extraido.excel5._resumen) || null;
        var id = DX.identificarObra(docs, resumenObra);
        state.identificacion = id;
        // Solo se rellena si el usuario no había puesto nada: su valor manda.
        var vacio = !String(state.identificador || '').trim();
        if ((vacio || state.identificadorAuto) && id.identificador) {
            state.identificador = id.identificador;
            state.identificadorAuto = true;
        }
        if ((vacio || state.identificadorAuto || !String(state.periodo || '').trim()) && id.periodo && !state.periodo) {
            state.periodo = id.periodo;
        }
        return id;
    }

    /* ---------------------------------------------------------------- confirmar */

    function contratoDatos() {
        var c = (state.extraido || {}).contrato;
        if (!c || !c.hayClausula31) { return null; }
        var hs = c.hitos || [];
        if (!hs.length && !c.semanasTotal) { return null; }
        var fi = $('val-contrato-firma');

    function calendarioHitosHtml() {
        var m = state.extraido && state.extraido.excel5;
        if (!m || !m.fases || !m.fases.length) { return ''; }
        var pf = state.plazosForm || { firma: '', dias: {} };
        var fm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(pf.firma || '');
        var DIA = 86400000, ahora = new Date();
        var hoy = Date.UTC(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
        var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
        var fmtF = function (t) { var d = new Date(t); return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); };
        var ini = fm ? Date.UTC(+fm[1], +fm[2] - 1, +fm[3]) : null;
        var items = m.items || [];
        var hs = (state.extraido.contrato || {}).plazosHitos || [];
        var filas = m.fases.map(function (f, ix) {
            var nF = numFase(f.fase, ix + 1);
            var dias = parseInt((pf.dias || {})[f.fase], 10);
            var defs = items.length ? items.filter(function (i) { return i.fase === f.fase; }) : (f.definiciones || []);
            var eleg = defs.filter(function (x) { return x.estado === 'ELEGIDO'; }).length;
            var noproc = defs.filter(function (x) { return x.estado === 'NO PROCEDE'; }).length;
            var base = defs.length - noproc;
            var pct = base > 0 ? Math.round((eleg / base) * 100) : null;
            var hito = hs.length ? (hs[nF - 1] ? 'Hito ' + nF : 'Sin hito') : (dias > 0 ? 'Manual' : '—');
            var lim = '—', est, cls = 'c-gris';
            if (dias > 0 && ini !== null) {
                var l = ini + dias * DIA, restan = Math.round((l - hoy) / DIA);
                lim = fmtF(l);
                if (pct !== null && pct >= 100) { est = 'Completada'; cls = 'c-verde'; }
                else if (restan > 0) { est = 'Quedan ' + restan + (restan === 1 ? ' día' : ' días'); cls = (restan / dias < 0.25) ? 'c-ambar' : 'c-verde'; }
                else if (restan === 0) { est = 'Vence hoy'; cls = 'c-ambar'; }
                else { est = 'Fuera de plazo · ' + (-restan) + (restan === -1 ? ' día' : ' días') + ' de descuadre'; cls = 'c-rojo'; }
            } else if (dias > 0) { est = 'Falta la fecha de firma'; }
            else { est = 'Sin plazo'; }
            return '<tr><td><strong>' + esc(f.fase) + '</strong></td><td>' + hito + '</td><td>' + (dias > 0 ? dias + ' días' : '—') + '</td><td>' + lim + '</td><td class="' + cls + '">' + est + '</td><td>' + (pct === null ? 'sin datos' : pct + ' %') + '</td></tr>';
        }).join('');
        var pasados = (ini !== null && hoy >= ini) ? Math.round((hoy - ini) / DIA) : null;
        return '<p class="cal-hoy"><strong>Hoy (fecha del informe):</strong> ' + fmtF(hoy) + ' · <strong>Firma del contrato:</strong> ' + (ini !== null ? fmtF(ini) : 'sin indicar') +

    }

    function capitalizar(s) {
        if (s === s.toUpperCase()) { s = s.toLowerCase().replace(/(^|\s)(\S)/g, function (x, a, b) { return a + b.toUpperCase(); }); }

    function saludoCliente(D) {
        var c = (D.certificacion && D.certificacion.ident && D.certificacion.ident.cliente) ||
            (D.factura && D.factura.ident && D.factura.ident.cliente) ||

        var m = String(c).match(/^\s*(D|Dña|Doña|Dona)\.?\s+([^-–—,]+?)\s*(?:[-–—,]|$)/);
        if (!m) { return 'Buenos días,'; }
        var palabras = m[2].trim().split(/\s+/);

        return 'Buenos días ' + (m[1].length > 1 ? 'Sra. ' : 'Sr. ') + ape + ',';
    }

    function fechaEjecucion(D, per) {
        var m = String(per || '').match(/([12])\s*[ªaº°.]?\s*quincena\s+de\s+([a-záéíóú]+)\s+de\s+(\d{4})/i);
        if (m) {
            var mi = MESES_ES.indexOf(m[2].toLowerCase());
            if (mi >= 0) {
                var anio = +m[3];
                var dia = m[1] === '1' ? 15 : new Date(anio, mi + 1, 0).getDate();
                return dia + ' de ' + MESES_ES[mi] + ' de ' + anio;
            }
        }
        var f = D.certificacion && D.certificacion.ident && D.certificacion.ident.fecha;

    /** Importe de la factura CON IVA para el correo. Sale SIEMPRE de la factura emitida (PDF 4), nunca de la certificación.
     *  Devuelve { valor, seguro, sinFactura }. */
    function importeFacturaConIva(D) {
        var fa = D.factura || {};
        var f = fa.totales || {};
        var pie = fa.pie || {};
        var c = (D.certificacion && D.certificacion.totales) || {};
        var pct = hayValor(f.ivaPct) ? f.ivaPct : null;
        var r2 = function (x) { return Math.round(x * 100) / 100; };
        var casi = function (a, b) { return hayValor(a) && hayValor(b) && Math.abs(a - b) < 0.06; };
        var hayTotal = hayValor(f.total) && f.total > 0;
        // 1) Pie completo de la factura: Base + IVA (+/- RE, suplidos, IRPF, retención) = TOTAL FACTURA
        if (hayTotal && hayValor(f.base) && hayValor(f.iva)) {
            var extra = (pie.cuotaRE || 0) + (pie.suplidos || 0) - (pie.irpf || 0) - (pie.retGat || 0);
            if (casi(f.base + f.iva, f.total) || casi(f.base + f.iva + extra, f.total)) { return { valor: f.total, seguro: true }; }
            return { valor: r2(f.base + f.iva), seguro: false };
        }
        // 2) Base conocida: base + IVA
        if (hayValor(f.base)) {
            var iva = hayValor(f.iva) ? f.iva : (pct !== null ? r2(f.base * pct / 100) : null);
            if (iva !== null) { return { valor: r2(f.base + iva), seguro: true }; }
        }
        if (!hayTotal) { return { valor: null, seguro: false, sinFactura: true }; }
        // 3) Solo "total" de la factura: comprobar si ya incluye IVA o es la base
        if (hayValor(f.iva) && f.iva > 0) {
            if (pct !== null) {
                if (Math.abs(f.iva / f.total - pct / 100) < 0.003) { return { valor: r2(f.total + f.iva), seguro: true }; }
                if (Math.abs(f.iva / (f.total - f.iva) - pct / 100) < 0.003) { return { valor: f.total, seguro: true }; }
            }
            if (f.total > f.iva * 3) { return { valor: r2(f.total + f.iva), seguro: false }; }
        }
        // 4) La certificación solo sirve para decidir si el total de la factura ya lleva IVA; el importe es siempre el de la factura
        if (casi(f.total, c.total)) { return { valor: f.total, seguro: true }; }
        if (casi(f.total, c.actual) || casi(f.total, c.origen)) {
            var pc = pct !== null ? pct : (hayValor(c.ivaPct) ? c.ivaPct : null);
            if (pc !== null) { return { valor: r2(f.total * (1 + pc / 100)), seguro: true }; }
        }
        // 5) Sin pistas: se asume base si hay % de IVA, y se avisa
        var pg = pct !== null ? pct : (hayValor(c.ivaPct) ? c.ivaPct : null);
        if (pg !== null) { return { valor: r2(f.total * (1 + pg / 100)), seguro: false }; }
        return { valor: f.total, seguro: false };
    }

            m._esLibroDefinicion = !!(m.fases && m.fases.length);
            if (m.fases) {
                m.fases.forEach(function (f) {
                    f.definiciones = m.items.filter(function (i) { return i.fase === f.fase; })
                        .map(function (i) { return { estado: i.estado }; });
                });
            }
            if (!m.estados) {
                m.estados = {};
                m.items.forEach(function (i) { m.estados[i.estado] = (m.estados[i.estado] || 0) + 1; });
            }
        }
        return D;
    }

    function cadenaDelEnlace() {
        var h = location.hash || '', s = location.search || '';
        if (h.indexOf('#d=') === 0) { return h.slice(3); }
        var mm = s.match(/[?&]d=([^&]+)/);
        return mm ? decodeURIComponent(mm[1]) : null;
    }

    function idCortoDelEnlace() {
        var mm = (location.search || '').match(/[?&]c=([A-Za-z0-9_-]{4,20})/);
        return mm ? mm[1] : null;
    }

    window.addEventListener('beforeprint', function () {
        var d = document.querySelectorAll('details.pr-det');
        for (var i = 0; i < d.length; i++) { d[i]._ab = d[i].open; d[i].open = true; }
    });
    window.addEventListener('afterprint', function () {
        var d = document.querySelectorAll('details.pr-det');
        for (var i = 0; i < d.length; i++) { if (d[i]._ab === false) { d[i].open = false; } }
    });

    function inicio() {
        cargarHistorial();
        var cadena = cadenaDelEnlace();
        var corto = cadena ? null : idCortoDelEnlace();
        if (cadena || corto) {
            // Enlace compartido: se muestra el dashboard directamente, en solo lectura.
            state.vista = 'cargando';
            render();
            var obtener = cadena ? Promise.resolve(cadena) : fetch('/api/obtener?id=' + encodeURIComponent(corto)).then(function (resp) {
                if (resp.status === 404) { throw new Error('El enlace no existe o ha caducado.'); }
                if (!resp.ok) { throw new Error('No se ha podido consultar el enlace (HTTP ' + resp.status + ').'); }
                return resp.json();
            }).then(function (j) { return j.cadena; });
            obtener.then(function (c) { return DXExport.decodificarDatos(c); }).then(function (D) {
                state.datos = rehidratar(D);
                state.identificador = D.identificador || '';
                state.periodo = D.periodo || '';
                state.extraido = {};
                state.soloLectura = true;
                state.filtroFase = 'todas';
                state.filtroEstado = 'todos';
                state.pestana = 'resumen';
                state.vista = 'dashboard';
                render();
            }).catch(function (e) {
                state.vista = 'errorEnlace';
                state.errorEnlace = (e && e.message) || String(e);
                state.soloLectura = true;
                render();
            });
            return;
        }
        render();
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', inicio); }
    else { inicio(); }

    window.__ENUE__ = { state: state, render: render, DX: DX };

})();

</script>
