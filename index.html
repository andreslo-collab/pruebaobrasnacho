                            '<td>' + esc(it.cantidad) + '</td>' +
                            '<td>' + esc(it.proveedor) + '</td>' +
                            '<td>' + esc(it.fechaEntrega) + '</td>' +
                            '<td><input type="text" class="val-input mini" data-zona="excel5" data-lista="items" data-idx="' + m2 + '" data-campo="estado" value="' + esc(it.estado) + '"></td>' +
                            '</tr>';
                    }
                    cuerpoM = '<div class="val-nota">Materiales detectados: <strong>' + mitems.length + '</strong> · Hojas leídas: ' +
                        esc((mat._hojas || []).map(function (h) { return h.name; }).join(', ')) + '</div>' +
                        '<div class="val-tabla-scroll alto"><table class="val-tabla"><thead><tr><th>Código</th><th>Material</th><th>Categoría</th><th>Cantidad</th><th>Proveedor</th><th>Entrega</th><th>Estado</th></tr></thead><tbody>' + fm + '</tbody></table></div>';
                } else {
                    cuerpoM = '<div class="val-nota">Hojas leídas: ' +
                        esc((mat._hojas || []).map(function (h) { return h.name + ' (' + h.rows.length + ' filas)'; }).join(', ') || '—') + '</div>' +
                        '<div class="val-aviso">No se han reconocido definiciones. Para el libro de definición se esperan hojas «Fase 1» … «Fase 5» ' +
                        'con las columnas GFH, ELEMENTO, DESCRIPCIÓN, COMENTARIOS, ESTADO y FECHA. Para un listado simple, columnas de ' +
                        'Material, Cantidad, Proveedor, Fecha y Estado.</div>';
                }
                partes.push(tarjetaCabecera('Materiales y definición (Excel 5)', 'Definiciones por fase y/o listado de materiales.', cuerpoM, mat, 'excel5'));
            } catch (err) { partes.push(bloqueFallo('Materiales y definición (Excel 5)', mat, err)); }
        }

        // ---------- zonas con resultado inesperado (documento no reconocido o error)
        ZONAS.forEach(function (z) {
            var r = state.extraido[z.id];
            if (r && (r.tipo !== z.parser || r.origen === 'error')) {
                partes.push(bloqueFallo(z.etiqueta, r, new Error(r.avisos && r.avisos.length ? r.avisos.join(' ') : 'documento no procesado')));
            }
        });

        // ---------- zonas sin documento
        var faltan = [];
        for (var zi = 0; zi < ZONAS.length; zi++) {
            if (!state.archivos[ZONAS[zi].id]) { faltan.push(ZONAS[zi].etiqueta); }
        }
        if (faltan.length) {
            partes.push('<section class="val-card"><div class="val-nota">Sin documento en: <strong>' + esc(faltan.join(' · ')) +
                '</strong>. Las pestañas que dependen de ellos se marcarán como «no disponible» en lugar de inventar datos.</div></section>');
        }

        // ---------- acciones
        partes.push('<div class="val-acciones">' +
            '<button id="btn-volver-generador" class="btn-sec">← Cambiar archivos</button>' +
            '<button id="btn-confirmar" class="btn-primario">Confirmar y generar dashboard</button>' +
            '</div>');

        return '<div class="val-wrap">' +
            '<div class="val-titulo"><h2>Validación de datos extraídos</h2>' +
            '<p>Revisa y corrige lo que haga falta. Lo que quede vacío se mostrará como «sin identificar» en el dashboard, nunca como 0 €.</p></div>' +
            partes.join('') + '</div>';
    }

    /** Tarjeta de fallo para un documento que no se ha podido procesar. */
    function bloqueFallo(titulo, res, err) {
        var avisos = (res && res.avisos) || [];
        return '<section class="val-card">' +
            '<header class="val-head"><div><h3>' + esc(titulo) + '</h3>' +
            '<p>Este documento no se ha podido procesar. Puedes seguir con el resto o pegar su texto a mano.</p></div>' +
            '<span class="val-badge">error</span></header>' +
            '<div class="val-aviso grave">' + esc((err && err.message) || 'Error desconocido') +
            (avisos.length ? '<br>' + avisos.map(function (a) { return '· ' + esc(a); }).join('<br>') : '') + '</div>' +
            '<div class="val-nota">Solución: abre el PDF, selecciona todo el texto (Ctrl+A, Ctrl+C), vuelve al generador, ' +
            'pulsa <strong>«Pegar texto»</strong> en la casilla correspondiente y pega. Vuelve a procesar.</div>' +
            (panelTexto(res, '') || '') +
            '</section>';
    }

    /* --------------------------------------------------------------- dashboard */

    function datos() { return state.datos || {}; }

    function partidaDePresupuesto(codigo) {
        var d = datos();
        var lista = (d.presupuesto && d.presupuesto.capitulos) || [];
        for (var i = 0; i < lista.length; i++) { if (lista[i].codigo === codigo) { return lista[i]; } }
        return null;
    }

    function certificadoDeCapitulo(codigo) {
        var d = datos();
        var lista = (d.certificacion && d.certificacion.capitulos) || [];
        for (var i = 0; i < lista.length; i++) { if (lista[i].codigo === codigo) { return lista[i]; } }
        return null;
    }

    /** Une presupuesto y certificación capítulo a capítulo. */
    /* ======================================================================
     * DASHBOARD
     * Todo el HTML de las 12 pestanas lo genera el motor compartido DXReport,
     * el mismo que usa el informe exportado. Aqui solo se resuelven los
     * filtros y se aporta el historial.
     * ==================================================================== */

    function contexto() {
        var d = datos();
        return {
            identificador: d.identificador, periodo: d.periodo, generado: d.generado,
            presupuesto: d.presupuesto, certificacion: d.certificacion,
            seguimiento: d.seguimiento, factura: d.factura,
            materiales: d.materiales, obra: d.obra,
            pem: d.pem, cert: d.cert, pct: d.pct,
            historial: state.soloLectura ? [] : state.historial.map(function (h) {
                return { fecha: h.fecha, identificador: h.identificador, pem: h.pem, cert: h.cert, pct: h.pct };
            })
        };
    }

    function tabDelegado(id) {
        return function () {
            try {
                return DXReport.render(contexto(), id, { fase: state.filtroFase, estado: state.filtroEstado });
            } catch (err) {
                return '<div class="bloque"><div class="val-aviso grave">Error al pintar esta pestana: ' +
                    esc(err.message) + '</div></div>';
            }
        };
    }

    var RENDER = {};
    DXReport.PESTANAS.forEach(function (t) { RENDER[t.id] = tabDelegado(t.id); });

    function vistaDashboard() {
        var d = datos();
        var id = state.identificador || 'Obra sin identificar';
        var publicada = (typeof location !== 'undefined') && /^https?:/.test(location.protocol);
        var ro = !!state.soloLectura;

        var avisos = [];
        ['pdf1', 'pdf2', 'pdf3', 'pdf4', 'excel5'].forEach(function (z) {
            var r = state.extraido[z];
            if (r && r.avisos && r.avisos.length) { avisos = avisos.concat(r.avisos); }
        });
        if (!state.usaPdfJs && !state.soloLectura) { avisos.unshift('El lector de PDF no se pudo cargar desde internet: los datos se han tomado del texto pegado a mano.'); }

        var tabs = DXReport.PESTANAS.map(function (t) {
            return '<button class="tab' + (state.pestana === t.id ? ' activa' : '') + '" data-tab="' + t.id + '">' + t.etiqueta + '</button>';
        }).join('');

        return '<div class="dash">' +
            '<div class="dash-cabecera">' +
            '<div><span class="dash-chip">Vista de dirección · solo lectura</span>' +
            '<h1>Informe ejecutivo de quincena</h1>' +
            '<p>' + esc(id) + (state.periodo ? ' · ' + esc(state.periodo) : '') + '</p></div>' +
            (ro ? '<div class="dash-botones"><button class="btn-sec" onclick="window.print()">Imprimir / PDF</button></div></div>' : ('<div class="dash-botones">' +
            '<button id="btn-enlace-largo" class="btn-primario">Generar enlace para el cliente</button>' +
            '<button id="btn-exportar" class="btn-sec">Descargar informe</button>' +
            '<button id="btn-volver-validacion" class="btn-sec">Volver a validación</button>' +
            '<button id="btn-nuevo" class="btn-sec">Nueva quincena</button>' +
            '</div></div>' +
            '<details class="dash-compartir"' + (state.abrirCompartir ? ' open' : '') + '>' +
            '<summary>Compartir con el cliente</summary>' +
            '<div class="compartir-grid">' +
            '<div class="compartir-card recomendado">' +
            '<span class="compartir-t">Enlace para el cliente</span>' +
            '<p>Genera un enlace corto que abre este informe en cualquier dispositivo, sin instalar nada ni registrarse.</p>' +
            (publicada ? '' : '<p class="warn">La aplicación está abierta como archivo local. Ábrela desde su dirección web (https://…) para que el enlace funcione en otros equipos.</p>') +
            '<div id="salida-enlace" class="salida-enlace"></div>' +
            '</div>' +
            '<div class="compartir-card">' +
            '<span class="compartir-t">Informe como archivo</span>' +
            '<p>Descarga un único archivo .html con el informe y los datos incluidos. Se abre sin conexión a internet.</p>' +
            '<button class="btn-sec" id="btn-exportar2">Descargar informe</button>' +
            '</div>' +
            '</div></details>')) +
            (avisos.length ? '<details class="dash-avisos"><summary>' + avisos.length + ' aviso(s) de extracción — revisar antes de compartir</summary><ul>' +
                avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></details>' : '') +
            '<div class="tabs">' + tabs + '</div>' +
            '<div class="dash-cuerpo">' + (RENDER[state.pestana] || RENDER.resumen)() + '</div>' +
            '</div>';
    }

    /* ------------------------------------------------------------- generador */

    function vistaGenerador() {
        var cargados = Object.keys(state.archivos).length;
        var zonas = ZONAS.map(function (z) {
            var f = state.archivos[z.id];
            var txt = state.textos[z.id] || '';
            return '<div class="zona' + (f ? ' con-archivo' : '') + '" data-zona="' + z.id + '">' +
                '<input type="file" id="file-' + z.id + '" accept="' + z.acepta + '" hidden>' +
                '<div class="zona-top"><span class="zona-id">' + esc(z.id.toUpperCase()) + '</span>' +
                (f ? '<button class="zona-quitar" data-quitar="' + z.id + '" title="Quitar">×</button>' : '') + '</div>' +
                '<label class="zona-titulo" for="file-' + z.id + '">' + esc(z.etiqueta) + '</label>' +
                (f
                    ? '<div class="zona-archivo"><span>' + esc(f.name) + '</span><small>' + fmtBytes(f.size) + '</small></div>'
                    : '<div class="zona-vacio">Arrastra el archivo aquí o pulsa para elegirlo</div>') +
                '<div class="zona-pie"><label class="zona-btn" for="file-' + z.id + '">' + (f ? 'Reemplazar' : 'Elegir archivo') + '</label>' +
                '<button class="zona-texto" data-toggle-texto="' + z.id + '">' + (txt ? 'Texto pegado' : 'Pegar texto') + '</button></div>' +
                '<textarea class="zona-area" data-texto="' + z.id + '" placeholder="Si el PDF no se lee bien, abre el documento, copia el texto y pégalo aquí. Tiene prioridad sobre el archivo.">' + esc(txt) + '</textarea>' +
                '</div>';
        }).join('');

        var hist = '';
        if (state.historial.length) {
            hist = '<div class="bloque"><div class="bloque-head"><div><h3>Dashboards generados</h3><p>Se guardan en este navegador (localStorage), sin base de datos externa.</p></div>' +
                '<span class="chip">' + state.historial.length + '</span></div>' +
                tabla(['Fecha', 'Obra', 'Presupuesto', 'Certificado', ''],
                    state.historial.map(function (h) {
                        return [esc(new Date(h.fecha).toLocaleString('es-ES')), esc(h.identificador), fmtMoney(h.pem), fmtMoney(h.cert),
                            '<button class="btn-mini" data-abrir="' + esc(h.slug) + '">Ver dashboard</button>'];
                    }), ['', '', 'num', 'num', '']) + '</div>';
        }

        return '<div class="gen">' +
            '<div class="gen-hero"><h1>Generador de dashboards de obra</h1>' +
            '<p>Carga los documentos de la quincena y pulsa el botón. <strong>La obra y la quincena se detectan solas</strong> ' +
            'a partir de los PDFs y del Excel: no hay que escribir nada.</p></div>' +
            '<div class="gen-card">' +
            '<label class="val-field"><span>Código de obra y periodo (opcional)</span>' +
            '<input type="text" id="gen-identificador" class="val-input" value="' + esc(state.identificador) + '" placeholder="Opcional: se detecta solo a partir de los PDFs y el Excel"></label>' +
            '<label class="val-field"><span>Periodo (quincena)</span>' +
            '<input type="text" id="gen-periodo" class="val-input" value="' + esc(state.periodo) + '" placeholder="Ej. 2ª quincena de septiembre de 2026"></label>' +
            '<div class="gen-cab">' +
            '<span>Documentos de la quincena</span><span class="chip">' + cargados + ' de 5 cargados</span></div>' +
            '<div class="zonas">' + zonas + '</div>' +
            '<div class="gen-acciones"><button id="btn-generar" class="btn-primario grande">Procesar y validar datos →</button>' +
            '<p class="nota-pie">Los PDF se leen en tu navegador. Nada se sube a ningún servidor.</p></div>' +
            '</div>' + hist + '</div>';
    }

    function vistaProcesando() {
        var pasos = PASOS.map(function (p, i) {
            var estado = state.pasoActual > i ? 'hecho' : (state.pasoActual === i ? 'actual' : '');
            return '<li class="' + estado + '">' + esc(p.etiqueta) + '</li>';
        }).join('');
        return '<div class="gen-card centro"><h2>Extrayendo datos…</h2>' +
            '<div class="barra grande"><div class="barra-i" style="width:' + state.progreso + '%"></div></div>' +
            '<p class="progreso">' + state.progreso + ' %</p><ul class="pasos">' + pasos + '</ul></div>';
    }

    /* -------------------------------------------------------------------- render */

    function render() {
        var root = $('root');
        if (!root) { return; }
        var cuerpo = '';
        if (state.vista === 'generador') { cuerpo = vistaGenerador(); }
        else if (state.vista === 'procesando') { cuerpo = vistaProcesando(); }
        else if (state.vista === 'validacion') { cuerpo = vistaValidacion(); }
        else if (state.vista === 'cargando') { cuerpo = '<div class="gen-card centro"><h2>Abriendo informe…</h2><div class="barra grande"><div class="barra-i indet"></div></div></div>'; }
        else if (state.vista === 'errorEnlace') { cuerpo = '<div class="gen-card centro"><h2>No se ha podido abrir el informe</h2><p class="nota-pie">' + esc(state.errorEnlace || '') + '</p><p class="nota-pie">Solicita un nuevo enlace a quien te lo envió.</p></div>'; }
        else { cuerpo = vistaDashboard(); }

        root.innerHTML =
            '<header class="cabecera"><div class="cabecera-in">' +
            '<div class="marca" id="btn-inicio"><span class="logo">E</span>' +
            '<div><strong>ENUE</strong><small>Proyectos y Construcción</small></div></div>' +
            '<span class="cab-estado">' + (state.soloLectura ? 'Informe de obra · solo lectura' : 'Control de certificaciones de obra') + '</span>' +
            '</div></header>' +
            (state.avisoGlobal ? '<div class="aviso-global">' + esc(state.avisoGlobal) + '</div>' : '') +
            '<main class="contenido">' + cuerpo + '</main>' +
            '<footer class="pie"><span>© ' + new Date().getFullYear() + ' ENUE Proyectos y Construcción, S.L.</span>' +
            '<span>' + (state.soloLectura ? 'Informe compartido · solo lectura' : 'Datos guardados en este navegador · sin servidor') + '</span></footer>';

        enlazar();
    }

    /* ------------------------------------------------------------------ eventos */

    function enlazar() {
        var el;

        el = $('btn-inicio');
        if (el) { el.onclick = function () { state.vista = state.datos ? 'dashboard' : 'generador'; render(); }; }

        el = $('gen-identificador');
        if (el) { el.oninput = function (ev) { state.identificador = (ev && ev.target ? ev.target.value : el.value); }; }
        el = $('gen-periodo');
        if (el) { el.oninput = function (ev) { state.periodo = (ev && ev.target ? ev.target.value : el.value); }; }

        // zonas: selector de archivo
        ZONAS.forEach(function (z) {
            var inp = $('file-' + z.id);
            if (inp) {
                inp.onchange = function () {
                    if (inp.files && inp.files[0]) { state.archivos[z.id] = inp.files[0]; state.vista = 'generador'; render(); }
                };
            }
        });

        // botones quitar / texto
        Array.prototype.forEach.call(document.querySelectorAll('[data-quitar]'), function (b) {
            b.onclick = function (ev) {
                ev.stopPropagation();
                delete state.archivos[b.getAttribute('data-quitar')];
                render();
            };
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-texto]'), function (b) {
            b.onclick = function (ev) {
                ev.stopPropagation();
                var id = b.getAttribute('data-toggle-texto');
                var ta = document.querySelector('[data-texto="' + id + '"]');
                if (ta) { ta.classList.toggle('abierta'); if (ta.classList.contains('abierta')) { ta.focus(); } }
            };
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-texto]'), function (ta) {
            ta.oninput = function () { state.textos[ta.getAttribute('data-texto')] = ta.value; };
        });

        // drag & drop en cada zona
        Array.prototype.forEach.call(document.querySelectorAll('.zona'), function (dz) {
            var id = dz.getAttribute('data-zona');
            dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('arrastrando'); };
            dz.ondragleave = function () { dz.classList.remove('arrastrando'); };
            dz.ondrop = function (e) {
                e.preventDefault(); dz.classList.remove('arrastrando');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    state.archivos[id] = e.dataTransfer.files[0]; render();
                }
            };
        });

        el = $('btn-generar');
        if (el) { el.onclick = procesar; }

        // validación
        el = $('val-identificador');
        if (el) { el.oninput = function (ev) { state.identificador = (ev && ev.target ? ev.target.value : el.value); state.identificadorManual = true; }; }
        el = $('val-periodo');
        if (el) { el.oninput = function (ev) { state.periodo = (ev && ev.target ? ev.target.value : el.value); state.identificadorManual = true; }; }

        Array.prototype.forEach.call(document.querySelectorAll('#root .val-input[data-zona]'), function (inp) {
            inp.onchange = function () { aplicarEdicion(inp); };
            inp.onblur = function () { aplicarEdicion(inp); };
        });

        Array.prototype.forEach.call(document.querySelectorAll('[data-copiar-texto]'), function (b) {
            b.onclick = function (ev) {
                ev.preventDefault();
                var zid = b.getAttribute('data-copiar-texto');
                var res = state.extraido[zid];
                var txt = (res && res._lineas ? res._lineas.join('\n') : '');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(function () {
                        b.textContent = 'Copiado';
                        setTimeout(function () { b.textContent = 'Copiar texto'; }, 2000);
                    });
                } else { window.prompt('Copia el texto:', txt.slice(0, 4000)); }
            };
        });

        el = $('btn-volver-generador');
        if (el) { el.onclick = function () { state.vista = 'generador'; render(); }; }
        el = $('btn-confirmar');
        if (el) { el.onclick = confirmar; }

        // dashboard
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
            b.onclick = function () { state.pestana = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); };
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-fase]'), function (b) {
            b.onclick = function () {
                var f = b.getAttribute('data-fase');
                state.filtroFase = (f === 'todas' || state.filtroFase === f) ? 'todas' : f;
                render();
            };
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-estado]'), function (b) {
            b.onclick = function () {
                var es = b.getAttribute('data-estado');
                state.filtroEstado = (es === 'todos' || state.filtroEstado === es) ? 'todos' : es;
                render();
            };
        });
        el = $('btn-volver-validacion');
        if (el) { el.onclick = function () { state.vista = 'validacion'; render(); }; }
        el = $('btn-nuevo');
        if (el) { el.onclick = function () { nuevaQuincena(); }; }
        el = $('btn-compartir');
        if (el) {
            el.onclick = function () {
                state.abrirCompartir = true;
                render();
                var det = document.querySelector('.dash-compartir');
                if (det) { det.setAttribute('open', 'open'); }
                var b = $('btn-enlace-largo');
                if (b) { b.click(); }
            };
        }
        el = $('btn-exportar');
        if (el) { el.onclick = exportarInforme; }
        el = $('btn-exportar2');
        if (el) { el.onclick = exportarInforme; }
        el = $('btn-enlace-largo');
        if (el) {
            el.onclick = function () {
                var salida = $('salida-enlace');
                var boton = el;
                boton.disabled = true;
                var textoOriginal = boton.textContent;
                boton.textContent = 'Generando enlace…';
                if (salida) { salida.innerHTML = '<p class="nota-pie">Comprimiendo el dashboard…</p>'; }
                generarEnlace(contexto()).then(function (r) {
                    var kb = (r.bytes / 1024).toFixed(1);
                    var html = '';
                    if (!r.publicada) {
                        html += '<p class="warn">La aplicación se está ejecutando como archivo local, así que este enlace no se abrirá en otro dispositivo. Ábrela desde su dirección web (https://…) y vuelve a generarlo.</p>';
                    } else if (r.corto) {
                        html += '<p class="ok-enlace">Enlace corto generado y copiado. Ya puedes enviárselo al cliente.</p>';
                    } else {
                        html += '<p class="warn">No se ha podido crear el enlace corto' + (r.errorCorto ? ' (' + esc(r.errorCorto) + ')' : '') +
                            '. Se muestra el enlace largo, que también funciona pero algunos correos o chats pueden cortarlo.</p>';
                    }
                    html += '<textarea class="enlace-area" readonly rows="' + (r.corto ? 2 : 4) + '">' + esc(r.url) + '</textarea>' +
                        '<div class="chips">' +
                        '<button class="btn-sec" id="btn-copiar-enlace-largo">Copiar enlace</button>' +
                        (r.corto ? '' : '<button class="btn-sec" id="btn-copiar-enlace-query">Copiar variante ?d=</button>') +
                        '</div>' +
                        (r.corto
                            ? '<p class="nota-pie">El enlace permanece activo durante 180 días.</p>'
                            : '<p class="nota-pie">Enlace de ' + kb + ' KB' + (r.sinComprimir ? ' (comprimido desde ' + (r.sinComprimir / 1024).toFixed(1) + ' KB)' : '') + '.</p>');
                    if (!r.corto && r.demasiadoLargo) {
                        html += '<p class="warn">El enlace pasa de 8 KB y algunos correos o chats lo cortan. Si ocurre, usa «Descargar informe».</p>';
                    }
                    if (salida) { salida.innerHTML = html; }
                    // copia automática cuando la app está publicada
                    if (r.publicada && navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(r.url).then(function () {
                            boton.textContent = 'Enlace copiado al portapapeles';
                            setTimeout(function () { boton.textContent = textoOriginal; boton.disabled = false; }, 3000);
                        }).catch(function () {
                            boton.textContent = textoOriginal; boton.disabled = false;
                        });
                    } else {
                        boton.textContent = textoOriginal; boton.disabled = false;
                    }
                    var bc = $('btn-copiar-enlace-largo');
                    if (bc) {
                        bc.onclick = function () {
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(r.url).then(function () {
                                    bc.textContent = 'Copiado';
                                    setTimeout(function () { bc.textContent = 'Copiar enlace'; }, 2000);
                                });
                            } else { window.prompt('Copia el enlace:', r.url); }
                        };
                    }
                    var bq = $('btn-copiar-enlace-query');
                    if (bq) {
                        bq.onclick = function () {
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(r.urlQuery).then(function () {
                                    bq.textContent = 'Copiado';
                                    setTimeout(function () { bq.textContent = 'Copiar variante ?d='; }, 2000);
                                });
                            } else { window.prompt('Copia el enlace:', r.urlQuery); }
                        };
                    }
                }).catch(function (err) {
                    boton.textContent = textoOriginal; boton.disabled = false;
                    if (salida) { salida.innerHTML = '<p class="warn">No se ha podido generar el enlace: ' + esc(err.message) + '</p>'; }
                });
            };
        }
        Array.prototype.forEach.call(document.querySelectorAll('[data-abrir]'), function (b) {
            b.onclick = function () {
                var s = b.getAttribute('data-abrir');
                var h = state.historial.filter(function (x) { return x.slug === s; })[0];
                if (h) { state.datos = h.datos; state.identificador = h.identificador; state.pestana = 'resumen'; state.vista = 'dashboard'; render(); }
            };
        });
    }

    /* --------------------------------------------------- edición de la validación */

    function poner(obj, ruta, valor) {
        var partes = ruta.split('.'), cur = obj;
        for (var i = 0; i < partes.length - 1; i++) { cur = cur[partes[i]]; }
        cur[partes[partes.length - 1]] = valor;
    }

    function aplicarEdicion(inp) {
        var zona = inp.getAttribute('data-zona');
        var campo = inp.getAttribute('data-campo');
        var kpi = inp.getAttribute('data-kpi');
        var lista = inp.getAttribute('data-lista');
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        var res = state.extraido[zona];
        if (!res) { return; }
        var v = inp.value.trim() === '' ? null : num(inp.value);
        if (kpi) {
            if (!res.kpis) { res.kpis = {}; }
            if (!res.kpis[kpi]) { res.kpis[kpi] = { etiqueta: kpi, valor: null, textoFuente: '' }; }
            res.kpis[kpi].valor = v;
            res.kpis[kpi].manual = true;
            return;
        }
        if (lista) {
            if (res[lista] && res[lista][idx]) { res[lista][idx][campo] = v; }
            recalcularZona(zona, res);
            return;
        }
        poner(res, campo, v);
        recalcularZona(zona, res);
    }

    function recalcularZona(zona, res) {
        if (zona === 'pdf2' && res.capitulos) {
            var suma = res.capitulos.reduce(function (a, b) { return a + (b.importeSinIva || 0); }, 0);
            res.capitulos.forEach(function (c) {
                c.pesoPresupuesto = res.totales.pem ? (c.importeSinIva / res.totales.pem) * 100 : null;
            });
            res._sumaCapitulos = suma;
        }
        if (zona === 'pdf1' && res.totales) {
            var o = res.totales.origen, p = res.totales.ivaPct;
            if (res.totales.iva === null && o !== null && p !== null) { res.totales.iva = +(o * p / 100).toFixed(3); }
            if (res.totales.total === null && o !== null) { res.totales.total = +(o + (res.totales.iva || 0)).toFixed(3); }
        }
        if (zona === 'pdf4' && res.totales) {
            var b = res.totales.base, pp = res.totales.ivaPct;
            if (res.totales.iva === null && b !== null && pp !== null) { res.totales.iva = +(b * pp / 100).toFixed(2); }
            if (res.totales.total === null && b !== null) { res.totales.total = +(b + (res.totales.iva || 0)).toFixed(2); }
        }
    }

    /* ------------------------------------------------------------- procesamiento */

    async function procesar() {
        // El nombre de la obra y la quincena se deducen de los documentos: no se pide nada.
        if (!Object.keys(state.archivos).length && !Object.keys(state.textos).filter(function (k) { return (state.textos[k] || '').trim(); }).length) {
            alert('Carga al menos un documento o pega su texto.');
            return;
        }
        var zonasConDoc = ZONAS.filter(function (z) { return state.archivos[z.id] || (state.textos[z.id] || '').trim(); });

        try {
            state.vista = 'procesando';
            state.progreso = 4;
            state.pasoActual = 0;
            render();

            var total = Math.max(1, zonasConDoc.length);
            var hechas = 0;

            for (var i = 0; i < zonasConDoc.length; i++) {
                var z = zonasConDoc[i];
                state.pasoActual = Math.min(PASOS.length - 1, Math.floor((hechas / total) * PASOS.length));
                state.progreso = Math.round(6 + (hechas / total) * 86);
                render();
                try {
                    state.extraido[z.id] = await extraerZona(z, state.archivos[z.id] || { name: 'texto pegado' });
                } catch (err) {
                    state.extraido[z.id] = {
                        tipo: z.parser, origen: 'error', capitulos: [], subcapitulos: [], partidas: [], items: [], kpis: {},
                        ident: {}, totales: {},
                        avisos: ['No se ha podido procesar «' + ((state.archivos[z.id] && state.archivos[z.id].name) || z.id) + '»: ' + (err.message || 'error desconocido')]
                    };
                }
                hechas++;
                await new Promise(function (r) { setTimeout(r, 30); });
            }
            state.pasoActual = PASOS.length - 1;
            state.progreso = 100;
            // La obra y la quincena se deducen de los propios documentos: el usuario
            // no tiene que escribir nada. Si ya había escrito algo, se respeta.
            try { deducirIdentificacion(); } catch (err) { state.avisoGlobal = 'Aviso al deducir la obra: ' + err.message; }
        } catch (err) {
            state.avisoGlobal = 'Error inesperado al procesar: ' + (err.message || err);
        } finally {
            render();
            setTimeout(function () { state.vista = 'validacion'; render(); }, 200);
        }
    }

    /** Rellena state.identificador y state.periodo a partir de los documentos. */
    function deducirIdentificacion() {
        var ficheros = {};
        Object.keys(state.archivos).forEach(function (z) { ficheros[z] = state.archivos[z].name; });
        var docs = {
            pdf1: state.extraido.pdf1, pdf2: state.extraido.pdf2, pdf3: state.extraido.pdf3,
            pdf4: state.extraido.pdf4, excel5: state.extraido.excel5, _ficheros: ficheros
        };
        var resumenObra = (state.extraido.excel5 && state.extraido.excel5._resumen) || null;
        var id = DX.identificarObra(docs, resumenObra);
        state.identificacion = id;
        // Solo se rellena si el usuario no había puesto nada: su valor manda.
        var vacio = !String(state.identificador || '').trim();
        if ((vacio || state.identificadorAuto) && id.identificador) {
            state.identificador = id.identificador;
            state.identificadorAuto = true;
        }
        if ((vacio || state.identificadorAuto || !String(state.periodo || '').trim()) && id.periodo && !state.periodo) {
            state.periodo = id.periodo;
        }
        return id;
    }

    /* ---------------------------------------------------------------- confirmar */

    function confirmar() {
        // El nombre sale de lo que se ve en pantalla; si no hay nada, de lo detectado.
        var vis = ($('val-identificador') || {}).value;
        var visPer = ($('val-periodo') || {}).value;
        var idd = state.identificacion || {};
        state.identificador = (vis && vis.trim()) || state.identificador || idd.identificador || 'Obra sin identificar';
        state.periodo = (visPer && visPer.trim()) || state.periodo || idd.periodo || '';

        var e = state.extraido;
        var pre = e.pdf2 || null, cer = e.pdf1 || null, seg = e.pdf3 || null, fac = e.pdf4 || null, mat = e.excel5 || null;
        var pem = pre && pre.totales ? pre.totales.pem : null;
        var cert = cer && cer.totales ? cer.totales.origen : null;
        var pct = (pem && cert !== null && pem !== 0) ? (cert / pem) * 100 : null;

        state.datos = {
            identificador: state.identificador,
            periodo: state.periodo,
            generado: new Date().toISOString(),
            archivos: Object.keys(state.archivos).map(function (k) { return { zona: k, nombre: state.archivos[k].name }; }),
            presupuesto: pre,
            certificacion: cer,
            seguimiento: seg,
            factura: fac,
            materiales: (mat && mat.items && mat.items.length) ? mat : null,
            obra: (mat && mat._resumen) ? mat._resumen : null,
            pem: pem, cert: cert, pct: pct
        };

        guardarEnHistorial({
            slug: slug(state.identificador), identificador: state.identificador, fecha: new Date().toISOString(),
            pem: pem, cert: cert, pct: pct, datos: state.datos
        });

        state.pestana = 'resumen';
        state.vista = 'dashboard';
        render();
        window.scrollTo(0, 0);
    }

    /** Genera el enlace: corto (guardado en la nube) y, si falla, el largo con los datos dentro. */
    function generarEnlace(ctx) {
        return DXExport.generarEnlaceLargo(ctx).then(function (r) {
            r.corto = false;
            if (!r.publicada) { return r; }
            var cadena = r.url.slice(r.url.indexOf('#d=') + 3);
            return fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cadena: cadena })
            }).then(function (resp) {
                if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
                return resp.json();
            }).then(function (j) {
                if (!j || !j.id) { throw new Error('respuesta sin identificador'); }
                r.url = r.base + '?c=' + j.id;
                r.urlQuery = r.url;
                r.corto = true;
                return r;
            }).catch(function (e) {
                r.errorCorto = String((e && e.message) || e);
                return r;
            });
        });
    }

    /** Descarga el informe autónomo (un solo archivo con los datos dentro). */
    function exportarInforme() {
        try {
            var bytes = DXExport.exportarInforme(contexto());
            state.avisoGlobal = '';
            var nom = DXExport.nombreArchivo(state.datos || {});
            alert('Informe descargado: ' + nom + '\n\n' +
                (bytes / 1024).toFixed(0) + ' KB, con el dashboard y los datos dentro.\n' +
                'Se abre en cualquier ordenador o móvil, con o sin internet.');
        } catch (err) {
            state.avisoGlobal = 'No se ha podido exportar el informe: ' + (err.message || err);
            render();
        }
    }

    function nuevaQuincena() {
        state.archivos = {};
        state.extraido = {};
        state.lineas = {};
        state.textos = {};
        state.datos = null;
        state.pestana = 'resumen';
        state.vista = 'generador';
        render();
    }

    /* -------------------------------------------------------------------- inicio */

    /* Reconstruye lo que el enlace compacto no trae (campos "_" y definiciones por fase) */
    function rehidratar(D) {
        var m = D && D.materiales;
        if (m && m.items && m.items.length) {
            m._esLibroDefinicion = !!(m.fases && m.fases.length);
            if (m.fases) {
                m.fases.forEach(function (f) {
                    f.definiciones = m.items.filter(function (i) { return i.fase === f.fase; })
                        .map(function (i) { return { estado: i.estado }; });
                });
            }
            if (!m.estados) {
                m.estados = {};
                m.items.forEach(function (i) { m.estados[i.estado] = (m.estados[i.estado] || 0) + 1; });
            }
        }
        return D;
    }

    function cadenaDelEnlace() {
        var h = location.hash || '', s = location.search || '';
        if (h.indexOf('#d=') === 0) { return h.slice(3); }
        var mm = s.match(/[?&]d=([^&]+)/);
        return mm ? decodeURIComponent(mm[1]) : null;
    }

    function idCortoDelEnlace() {
        var mm = (location.search || '').match(/[?&]c=([A-Za-z0-9_-]{4,20})/);
        return mm ? mm[1] : null;
    }

    function inicio() {
        cargarHistorial();
        var cadena = cadenaDelEnlace();
        var corto = cadena ? null : idCortoDelEnlace();
        if (cadena || corto) {
            // Enlace compartido: se muestra el dashboard directamente, en solo lectura.
            state.vista = 'cargando';
            render();
            var obtener = cadena ? Promise.resolve(cadena) : fetch('/api/obtener?id=' + encodeURIComponent(corto)).then(function (resp) {
                if (resp.status === 404) { throw new Error('El enlace no existe o ha caducado.'); }
                if (!resp.ok) { throw new Error('No se ha podido consultar el enlace (HTTP ' + resp.status + ').'); }
                return resp.json();
            }).then(function (j) { return j.cadena; });
            obtener.then(function (c) { return DXExport.decodificarDatos(c); }).then(function (D) {
                state.datos = rehidratar(D);
                state.identificador = D.identificador || '';
                state.periodo = D.periodo || '';
                state.extraido = {};
                state.soloLectura = true;
                state.filtroFase = 'todas';
                state.filtroEstado = 'todos';
                state.pestana = 'resumen';
                state.vista = 'dashboard';
                render();
            }).catch(function (e) {
                state.vista = 'errorEnlace';
                state.errorEnlace = (e && e.message) || String(e);
                state.soloLectura = true;
                render();
            });
            return;
        }
        render();
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', inicio); }
    else { inicio(); }

    window.__ENUE__ = { state: state, render: render, DX: DX };

})();

</script>
